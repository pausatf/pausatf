---
extends: default
rules:
  line-length:
    max: 120
    level: warning
  indentation:
    indent-sequences: whatever
    check-multi-line-strings: false
  truthy:
    check-keys: false
    allowed-values: ["true", "false", "yes", "no"]
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  new-line-at-end-of-file: disable
  braces:
    max-spaces-inside: 1
    level: warning
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
# yamllint configuration for pausatf ansible playbooks
# v3: ansible-lint 25.12.2 compatibility
