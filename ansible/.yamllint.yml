---
extends: default
rules:
  line-length:
    max: 120
    level: warning
  indentation:
    indent-sequences: whatever
    check-multi-line-strings: false
  truthy:
    check-keys: false
    allowed-values: ['true', 'false', 'yes', 'no']
  comments:
    min-spaces-from-content: 1
  new-line-at-end-of-file: disable
  braces:
    max-spaces-inside: 1
    level: warning
# yamllint configuration for pausatf ansible playbooks
