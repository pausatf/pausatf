---
# DigitalOcean Dynamic Inventory
# Requires: community.digitalocean collection + DO_API_TOKEN env var
# Install: ansible-galaxy collection install community.digitalocean
# Usage: ansible-inventory -i inventory/digitalocean.yml --list
#
# This auto-discovers droplets by tag and builds groups dynamically.
# Static hosts.yml is kept as fallback when DO API is unavailable.

plugin: community.digitalocean.digitalocean
api_token: "{{ lookup('env', 'DO_API_TOKEN') }}"

# Group droplets by their tags
keyed_groups:
  - key: do_tags | default([])
    prefix: tag
    separator: "_"
  - key: do_region.slug | default('unknown')
    prefix: region
    separator: "_"
  - key: do_size.slug | default('unknown')
    prefix: size
    separator: "_"
  - key: do_status | default('unknown')
    prefix: status
    separator: "_"

# Build groups from tags matching our environments
groups:
  production: "'production' in (do_tags | default([]))"
  staging: "'staging' in (do_tags | default([]))"
  dev: "'dev' in (do_tags | default([]))"
  webservers: "'web' in (do_tags | default([]))"
  pausatf: "'pausatf' in (do_tags | default([]))"

# Use public IPv4 for connection
compose:
  ansible_host: do_networks.v4 | selectattr('type', 'eq', 'public') | map(attribute='ip_address') | first
  ansible_user: "'root'"
  ansible_python_interpreter: "'/usr/bin/python3'"

# Only include active droplets with the pausatf tag
filters:
  - do_status == 'active'
  - "'pausatf' in (do_tags | default([]))"
