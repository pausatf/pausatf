---
# PAUSATF Ansible Inventory
# ==========================
#
# This inventory defines all PAUSATF infrastructure hosts organized by
# environment and role.
#

all:
  children:
    # Production Environment
    production:
      hosts:
        pausatf-prod:
          ansible_host: REDACTED_PROD_NEW_IP
          ansible_user: github-deploy
          ansible_ssh_private_key_file: ~/.ssh/pausatf-prod
          ansible_python_interpreter: /usr/bin/python3
          wordpress_path: /var/www/html
          legacy_path: /var/www/legacy/public_html
          web_server: apache
          wordpress_enabled: true

    # Staging Environment
    staging:
      hosts:
        pausatf-stage:
          ansible_host: stage.pausatf.org
          ansible_user: github-deploy
          ansible_ssh_private_key_file: ~/.ssh/deploy_key
          ansible_python_interpreter: /usr/bin/python3
          wordpress_path: /var/www/html
          web_server: openlitespeed
          wordpress_enabled: true

    # Development Environment
    dev:
      hosts:
        pausatf-dev:
          ansible_host: REDACTED_DEV_IP
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/deploy_key
          ansible_python_interpreter: /usr/bin/python3
          wordpress_path: /var/www/html
          web_server: apache
          wordpress_enabled: true

    # WordPress Servers umbrella
    webservers:
      children:
        production:
        staging:
        dev:

  vars:
    # Global variables for all hosts
    ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'
    timezone: "America/Los_Angeles"
