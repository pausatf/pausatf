---
# PAUSATF Ansible Inventory
# ==========================
#
# This inventory defines all PAUSATF infrastructure hosts organized by
# environment and role.
#

all:
  children:
    # Production Environment
    production:
      hosts:
        pausatf-prod:
          ansible_host: ssh.pausatf.org
          ansible_user: somethingwithproof
          ansible_python_interpreter: /usr/bin/python3
          wordpress_path: /var/www/html
          legacy_path: /var/www/legacy/public_html
          web_server: apache
          wordpress_enabled: true

    # Staging Environment
    staging:
      hosts:
        pausatf-stage:
          ansible_host: "{{ lookup('env', 'STAGE_SERVER_IP') | default('127.0.0.1', true) }}"
          ansible_user: somethingwithproof
          ansible_ssh_private_key_file: ~/.ssh/deploy_key
          ansible_python_interpreter: /usr/bin/python3
          wordpress_path: /var/www/html
          web_server: openlitespeed
          wordpress_enabled: true

    # Development Environment
    dev:
      hosts:
        pausatf-dev:
          ansible_host: "{{ lookup('env', 'DEV_SERVER_IP') | default('127.0.0.1', true) }}"
          ansible_user: somethingwithproof
          ansible_ssh_private_key_file: ~/.ssh/deploy_key
          ansible_python_interpreter: /usr/bin/python3
          wordpress_path: /var/www/html
          web_server: apache
          wordpress_enabled: true

    # New Production (Ubuntu 24.04 migration target)
    production_new:
      hosts:
        pausatf-prod-new:
          ansible_host: "{{ lookup('env', 'PROD_SERVER_IP') | default('127.0.0.1', true) }}"
          ansible_user: somethingwithproof
          ansible_ssh_private_key_file: ~/.ssh/deploy_key
          ansible_python_interpreter: /usr/bin/python3
          wordpress_path: /var/www/html
          legacy_path: /var/www/legacy
          web_server: apache
          wordpress_enabled: true

    # WordPress Servers umbrella
    webservers:
      children:
        production:
        production_new:
        staging:
        dev:
  vars:
    # Global variables for all hosts
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"
    timezone: "America/Los_Angeles"
