---
# Dev environment overrides
web_server: apache
apache_mpm: "event"
use_php_fpm: true
php_version: "8.4"
mysql_version: "8"
mysql_enabled: false # skip standalone MySQL role in site.yml
mysql_managed: true # DO Managed MySQL; skip mysql dependency in wordpress role
wp_environment_type: "development"
is_active_web: false

# Origin TLS is a Cloudflare Origin CA certificate mounted into the Apache
# WordPress container at /etc/ssl/pausatf. Cloudflare manages the public edge
# certificate; Origin CA renewal is a separately scheduled operational task.
tls_origin_certificate_issuer: cloudflare_origin_ca
tls_origin_certificate_renewal: manual
tls_origin_certificate_domains:
  - dev.pausatf.org
tls_origin_certificate_path: /etc/ssl/pausatf/fullchain.pem
tls_origin_private_key_path: /etc/ssl/pausatf/privkey.pem
tls_origin_minimum_protocol: TLSv1.2
certbot_enabled: false

# WordPress — dev overrides merged with defaults from all.yml
wordpress_installs:
  - >-
    {{ wordpress_install_defaults | combine({
    'domain': 'dev.pausatf.org',
    'wp_version': 'latest',
    'debug_mode': true,
    'db_password': vault_wp_dev_db_password
      | default(lookup('password',
        '/dev/null length=32 chars=ascii_letters,digits')),
    'auth_key': vault_wp_dev_auth_key
      | default(lookup('password',
        '/dev/null length=64 chars=ascii_letters,digits,punctuation')),
    'secure_auth_key': vault_wp_dev_secure_auth_key
      | default(lookup('password',
        '/dev/null length=64 chars=ascii_letters,digits,punctuation')),
    'logged_in_key': vault_wp_dev_logged_in_key
      | default(lookup('password',
        '/dev/null length=64 chars=ascii_letters,digits,punctuation')),
    'nonce_key': vault_wp_dev_nonce_key
      | default(lookup('password',
        '/dev/null length=64 chars=ascii_letters,digits,punctuation')),
    'auth_salt': vault_wp_dev_auth_salt
      | default(lookup('password',
        '/dev/null length=64 chars=ascii_letters,digits,punctuation')),
    'secure_auth_salt': vault_wp_dev_secure_auth_salt
      | default(lookup('password',
        '/dev/null length=64 chars=ascii_letters,digits,punctuation')),
    'logged_in_salt': vault_wp_dev_logged_in_salt
      | default(lookup('password',
        '/dev/null length=64 chars=ascii_letters,digits,punctuation')),
    'nonce_salt': vault_wp_dev_nonce_salt
      | default(lookup('password',
        '/dev/null length=64 chars=ascii_letters,digits,punctuation')),
    }) }}

# WordPress authorized users for dev
# These accounts exist on dev and are authorized.
# Dev mirrors production admin accounts managed by Cynci.
# wp_users: stored in GitHub Secret WP_USERS
