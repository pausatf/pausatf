---
# Global Defaults — all environments
# ====================================
# Variables here apply to every host (production, staging, dev) unless a
# more-specific group_vars file overrides them.
#
# Production-specific values (droplet IDs, DNS records, WP install block,
# theme/plugin lists, backup paths) live in:
#   ansible/group_vars/production/main.yml
#
# Per-environment overrides (staging, dev) live in:
#   ansible/group_vars/staging.yml
#   ansible/group_vars/dev.yml
#
# Variable precedence (lowest -> highest):
#   defaults/main.yml         (role defaults, widest scope)
#   -> group_vars/all.yml     (this file, applies to all hosts)
#   -> group_vars/<ENV>.yml   (environment-specific, e.g. staging.yml)
#   -> host_vars/<HOST>.yml   (host-specific, highest precedence)
# Use host_vars only for values that genuinely differ per host (e.g. IP,
# hostname). Prefer group_vars for shared configuration.

# =============================================================================
# INFRASTRUCTURE / HOSTING
# =============================================================================
hosting_provider: "digitalocean"
digitalocean_api_token: "{{ vault_digitalocean_api_token }}"

# Cloudflare zone/API — shared across environments
cloudflare_enabled: true
cloudflare_zone: "pausatf.org"
cloudflare_zone_id: "{{ vault_cloudflare_zone_id | default('') }}"
cloudflare_api_token: "{{ vault_cloudflare_api_token | default('') }}"
cloudflare_email: "{{ vault_cloudflare_email | default('') }}"
cloudflare_plan: "Free Website"
cloudflare_status: "active"
cloudflare_manage_dns: false  # DNS is managed via Terraform
cloudflare_nameservers:
  - curt.ns.cloudflare.com
  - eva.ns.cloudflare.com

# Cloudflare SSL/TLS Settings
cloudflare_ssl_mode: "strict"
cloudflare_min_tls_version: "1.2"
cloudflare_always_use_https: true

# Cloudflare Security Settings
cloudflare_security_level: "medium"
cloudflare_waf_enabled: true

# Cloudflare Caching Settings
cloudflare_cache_level: "aggressive"
cloudflare_browser_cache_ttl: 0

# =============================================================================
# SYSTEM
# =============================================================================
timezone: "America/Los_Angeles"
os_distribution: "ubuntu"
os_version: "24.04"
os_codename: "noble"

# =============================================================================
# REDIS (local object cache on droplet)
# =============================================================================
redis_enabled: true
redis_socket: "/var/run/redis/redis.sock"
redis_maxmemory: "256mb"
redis_maxmemory_policy: "allkeys-lru"

# =============================================================================
# CERTBOT (Let's Encrypt via Cloudflare DNS-01)
# =============================================================================
certbot_email: "admin@pausatf.org"

# =============================================================================
# APACHE CONFIGURATION
# =============================================================================
apache_service_name: apache2
apache_user: www-data
apache_group: www-data
apache_listen_port: 80
apache_listen_port_ssl: 443
apache_server_admin: "webmaster@pausatf.org"
apache_server_name: "www.pausatf.org"
apache_conf_dir: "/etc/apache2"

# MPM — event for PHP-FPM, prefork for legacy mod_php
apache_mpm: "event"

# MPM Prefork settings (legacy, kept for reference)
apache_mpm_prefork:
  start_servers: 5
  min_spare_servers: 5
  max_spare_servers: 8
  max_request_workers: 256
  max_connections_per_child: 0

# Apache modules to enable (mpm_event + proxy_fcgi managed separately by role)
apache_modules:
  - access_compat
  - alias
  - auth_basic
  - authn_core
  - authn_file
  - authz_core
  - authz_host
  - authz_user
  - autoindex
  - deflate
  - dir
  - env
  - expires
  - filter
  - headers
  - http2
  - mime
  - negotiation
  - remoteip
  - reqtimeout
  - rewrite
  - setenvif
  - socache_shmcb
  - ssl
  - status

# =============================================================================
# PHP CONFIGURATION
# =============================================================================
php_version: "8.3"
use_php_fpm: true
php_fpm_socket: "/run/php/php{{ php_version }}-fpm.sock"

# PHP settings (for WordPress optimization)
php_memory_limit: "256M"
php_max_execution_time: 300
php_max_input_time: 300
php_max_input_vars: 3000
php_upload_max_filesize: "64M"
php_post_max_size: "64M"
php_date_timezone: "America/Los_Angeles"

# PHP modules to ensure installed (used by both php and php-fpm roles)
php_modules:
  - bcmath
  - cli
  - common
  - curl
  - gd
  - imagick
  - intl
  - mbstring
  - mysql
  - opcache
  - redis
  - soap
  - xml
  - zip

# OPcache settings
php_opcache_enable: 1
php_opcache_memory_consumption: 128
php_opcache_interned_strings_buffer: 16
php_opcache_max_accelerated_files: 10000
php_opcache_revalidate_freq: 60
php_opcache_save_comments: 1

# =============================================================================
# MYSQL CONFIGURATION
# =============================================================================
# Local MySQL 8 on the droplet
mysql_version: "8"
mysql_managed: false
mysql_enabled: false
mysql_port: 3306

# DigitalOcean Managed MySQL (populated from Terraform outputs + vault)
# To populate: terraform -chdir=terraform/environments/production output
managed_db_host: "{{ vault_managed_db_host | default('') }}"
managed_db_port: 25060
managed_db_user: "{{ vault_managed_db_user | default('') }}"
managed_db_password: "{{ vault_managed_db_password | default('') }}"

# Managed MySQL application credentials used by WordPress runtime.
# Keep these separate from admin/import credentials.
managed_wp_db_user: "{{ vault_managed_wp_db_user | default('wordpress') }}"
managed_wp_db_password: "{{ vault_managed_wp_db_password | default(vault_wp_main_db_password | default('')) }}"

# =============================================================================
# WORDPRESS INSTALL DEFAULTS
# =============================================================================
# Shared defaults for all environments. Per-environment group_vars override
# only the keys that differ (domain, db_password, auth keys, etc.).
# Usage in env group_vars: wordpress_install_defaults | combine({...})
wordpress_install_defaults:
  name: "pausatf-main"
  path: "/var/www/html"
  db_name: "wordpress"
  db_user: "wordpress"
  db_host: "localhost"
  db_port: ""
  db_ssl_mode: ""
  db_ssl_required: false
  table_prefix: "wp_"
  active_theme: "TheSource-child"
  cron_enabled: true
  disallow_file_edit: true
  disallow_file_mods: false
  auto_update_core: "minor"
  fs_method: "direct"

# =============================================================================
# WP-CLI CONFIGURATION
# =============================================================================
wpcli_enabled: true
wpcli_path: "/usr/local/bin/wp"
wpcli_auto_update: true

# WP-CLI update settings
wpcli_update_plugins: true
wpcli_update_themes: true
wpcli_update_core: "minor"  # false, true, or "minor"
wpcli_update_schedule: "weekly"  # daily, weekly, monthly

# Plugins to exclude from auto-updates (premium/custom)
wpcli_exclude_plugins:
  - "tablepress-premium"

# Themes to exclude from auto-updates (custom child themes)
wpcli_exclude_themes:
  - "TheSource-child"
  - "pausatf-oceanwp-child"
  - "pausatf-oceanwp-child-v2"
  - "pausatf-oceanwp-theme"

# =============================================================================
# LEGACY/STATIC CONTENT
# =============================================================================
legacy_content_path: "/var/www/legacy"
legacy_sites:
  - name: "legacy-public"
    path: "/var/www/legacy/public_html"
    type: "mixed_html_php"
    description: "Legacy PAUSATF public site"
  - name: "legacy-data"
    path: "/var/www/legacy/data"
    type: "mixed_html_php"
    description: "Athletic results and records (1994-2025)"
  - name: "legacy-calendar"
    path: "/var/www/legacy/calendar"
    type: "mixed_html_php"
    description: "Legacy calendar application"

# Legacy PHP scripts that need database access are hosted on x10host.
# Apache RedirectMatch sends these before the Alias fires (open_basedir
# blocks PHP execution under the legacy tree).
legacy_data_redirects:
  - pattern: "clubs\\.php"
    target: "https://pausatf.x10host.com/data/clubs.php"
  - pattern: "members\\.php"
    target: "https://pausatf.x10host.com/data/members.php"
  - pattern: "ScoreSheet\\.php"
    target: "https://pausatf.x10host.com/data/ScoreSheet.php"
  - pattern: "3024/geolocate\\.php"
    target: "https://pausatf.x10host.com/data/3024/geolocate.php"

# =============================================================================
# SSL CONFIGURATION
# =============================================================================
ssl_enabled: true
ssl_protocol: "all -SSLv3 -TLSv1 -TLSv1.1"
# ECDHE+AESGCM suites only — forward secrecy, authenticated encryption, no CBC.
# yamllint disable-line rule:line-length
ssl_cipher_suite: "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
ssl_certificate: "/etc/letsencrypt/live/pausatf.org/fullchain.pem"
ssl_certificate_key: "/etc/letsencrypt/live/pausatf.org/privkey.pem"

# =============================================================================
# SECURITY
# =============================================================================

# Content-Security-Policy — controls which domains the browser may load resources from.
# Each directive is a list of sources; the template joins them with spaces.
# yamllint disable rule:line-length
csp_enabled: true
csp_default_src: "'self'"
csp_script_src: "'self' 'unsafe-inline' 'unsafe-eval' *.googleapis.com *.gstatic.com *.google.com *.googletagmanager.com *.google-analytics.com ajax.cloudflare.com static.cloudflareinsights.com challenges.cloudflare.com *.wp.com *.wordpress.com widgetlogic.org"
csp_style_src: "'self' 'unsafe-inline' fonts.googleapis.com *.wp.com"
csp_img_src: "'self' data: *.googleapis.com *.gravatar.com *.wp.com *.google-analytics.com *.googletagmanager.com *.instagram.com *.cdninstagram.com *.pausatf.org"
csp_font_src: "'self' fonts.gstatic.com data:"
csp_frame_src: "'self' *.google.com *.wp.com"
csp_connect_src: "'self' *.googleapis.com *.google-analytics.com *.googletagmanager.com *.wp.com *.wordpress.com"
# yamllint enable rule:line-length

# Fail2ban
fail2ban_enabled: true
fail2ban_bantime: 3600
fail2ban_findtime: 600
fail2ban_maxretry: 5
fail2ban_destemail: "admin@pausatf.org"
fail2ban_sendername: "Fail2Ban"
fail2ban_mta: "sendmail"
fail2ban_action: "%(action_mwl)s"
fail2ban_jails:
  - name: sshd
    enabled: true
  - name: apache-auth
    enabled: true
  - name: apache-badbots
    enabled: true
  - name: wordpress-auth
    enabled: true
  - name: wordpress-enum
    enabled: true

# UFW Firewall
ufw_enabled: true
# Restrict SSH to specific CIDRs when possible (e.g. office/VPN ranges).
# Empty list preserves current behavior (allow 22 from anywhere); DO firewall should still enforce perimeter rules.
allowed_ssh_networks: []
ufw_allowed_ports:
  - "22/tcp"
  - "80/tcp"
  - "443/tcp"

# =============================================================================
# MONITORING
# =============================================================================

# New Relic APM
newrelic_enabled: true
newrelic_license_key: "{{ vault_newrelic_license_key | default('') }}"
newrelic_app_name: "PAUSATF WordPress"

# Monit
monit_enabled: true
monit_check_interval: 120
monit_start_delay: 240

# Health Check Endpoint
healthcheck_enabled: true
healthcheck_token: "{{ vault_healthcheck_token }}"
healthcheck_allowed_ips:
  - "127.0.0.1"
  - "::1"
# Add your uptime monitoring service IPs here (e.g., UptimeRobot, Pingdom)
#  - "216.245.221.0/24"  # UptimeRobot
#  - "52.0.0.0/8"        # AWS (various monitoring services)

# =============================================================================
# BACKUP
# =============================================================================
backup_enabled: true
backup_retention_days: 30
backup_destination: "/var/backups/wordpress"
backup_schedule: "0 2 * * *"  # 2 AM daily

# =============================================================================
# EMAIL (Google Workspace)
# =============================================================================
email_provider: "google_workspace"
email_mx_records:
  - priority: 1
    server: "aspmx.l.google.com"
  - priority: 5
    server: "alt1.aspmx.l.google.com"
  - priority: 5
    server: "alt2.aspmx.l.google.com"
  - priority: 10
    server: "alt3.aspmx.l.google.com"
  - priority: 10
    server: "alt4.aspmx.l.google.com"

# SendGrid for transactional email
sendgrid_enabled: true
sendgrid_subdomain: "em5172"

# =============================================================================
# ADDITIONAL SERVICES
# =============================================================================

# FTP (vsftpd)
vsftpd_enabled: false

# Postfix (mail)
postfix_enabled: true
