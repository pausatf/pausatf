# =============================================================================
# BACKUP — PRODUCTION PATHS
# =============================================================================
# References production filesystem paths; dev/staging use different layouts.
backup_items:
  - name: "wordpress-main"
    path: "/var/www/html"
    db_name: "wordpress"
  - name: "legacy-data"
    path: "/var/www/legacy/public_html/data"
