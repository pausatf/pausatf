# Production-specific variables
# ==============================
# This file holds values that are specific to the production environment.
# Truly global defaults (shared across all envs) live in group_vars/all.yml.
# Ansible merges both automatically when targeting the production group.

# =============================================================================
# DIGITALOCEAN — PRODUCTION DROPLET
# =============================================================================
# These values describe the live production droplet and must not bleed into
# dev/staging, which use different (or no) DigitalOcean resources.
digitalocean_droplet_id: "{{ vault_digitalocean_droplet_id }}"
digitalocean_droplet_name: "pausatf-prod-new"
digitalocean_region: "sfo2"
digitalocean_region_name: "San Francisco 2"
digitalocean_size: "s-4vcpu-8gb"
digitalocean_vcpus: 4
digitalocean_memory_mb: 8192
digitalocean_disk_gb: 160
digitalocean_image: "pausatf.org 2023-05-16"
digitalocean_public_ip: "167.71.117.226"
digitalocean_private_ip: "10.138.0.2"
digitalocean_vpc_uuid: "4ee39499-dc85-11e8-9f23-3cfdfea9fff1"
digitalocean_features:
  - backups
  - droplet_agent
  - private_networking
digitalocean_tags:
  - pausatf
  - production
  - web
  - wordpress

# =============================================================================
# CLOUDFLARE — PRODUCTION DNS RECORDS
# =============================================================================
# These A records point to the production IP. Dev/staging use different targets.
cloudflare_dns_records:
  - name: "@"
    type: "A"
    content: "64.225.40.54"
    proxied: true
  - name: "www"
    type: "A"
    content: "64.225.40.54"
    proxied: true
  - name: "ftp"
    type: "A"
    content: "64.225.40.54"
    proxied: false
  - name: "mail"
    type: "A"
    content: "64.225.40.54"
    proxied: false
  - name: "monitor"
    type: "A"
    content: "64.225.40.54"
    proxied: false

# =============================================================================
# SYSTEM — PRODUCTION HOSTNAME
# =============================================================================
hostname: "pausatf-prod"
web_server: apache

# Ubuntu 24.04: event MPM + PHP-FPM
apache_mpm: "event"
use_php_fpm: true
php_version: "8.4"

# Temporary incident mode: keep ModSecurity in audit-only operation while rules are tuned.
modsecurity_rule_engine: "DetectionOnly"
modsecurity_audit_engine: "On"

# Production WordPress runs on DigitalOcean Managed MySQL, not local MySQL.
mysql_managed: true
mysql_enabled: false

# Redis object cache
redis_enabled: true
redis_maxmemory: "128mb"

# AppArmor
apparmor_apache_enforce: true

# Certbot
certbot_enabled: true

# =============================================================================
# WORDPRESS — PRODUCTION INSTALL
# =============================================================================
# Production-specific overrides merged with shared defaults from all.yml.
# Dev/staging define their own wordpress_installs in their group_vars.
wordpress_installs:
  - "{{ wordpress_install_defaults | combine({
      'domain': 'www.pausatf.org',
      'aliases': ['pausatf.org'],
      'wp_version': '6.8.3',
      'debug_mode': false,
      'wp_memory_limit': '256M',
      'wp_max_memory_limit': '512M',
      'ssl_enabled': true,
      'ssl_certificate': '/etc/letsencrypt/live/www.pausatf.org/fullchain.pem',
      'ssl_certificate_key': '/etc/letsencrypt/live/www.pausatf.org/privkey.pem',
      'manage_wp_config': false,
      'db_host': managed_db_host ~ ':' ~ (managed_db_port | string),
      'db_port': managed_db_port,
      'db_user': managed_wp_db_user,
      'db_password': managed_wp_db_password,
      'db_ssl_mode': 'REQUIRED',
      'db_ssl_required': true,
    }) }}"

# =============================================================================
# ADDITIONAL VHOSTS (non-WordPress)
# =============================================================================
additional_vhosts:
  - name: "pausatf-transit"
    domain: "transit.pausatf.org"
    path: "/var/www/transit/html"
    ssl_enabled: false

