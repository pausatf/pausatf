---
# Main orchestration playbook
# Composes all subsystem playbooks in dependency order.
# Use tags for selective execution: ansible-playbook site.yml --tags wordpress
- ansible.builtin.import_playbook: playbooks/base.yml
- ansible.builtin.import_playbook: playbooks/webserver.yml
- ansible.builtin.import_playbook: playbooks/database.yml
- ansible.builtin.import_playbook: playbooks/wordpress.yml
- ansible.builtin.import_playbook: playbooks/monitoring.yml
