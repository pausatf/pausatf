---
# Credential rotation checklist and WordPress salt rotation
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/rotate-credentials.yml \
#     -l production --vault-password-file vault.pass
#
# The only credential this playbook changes is the WordPress salts, through
# WP-CLI on the host. The database password and API tokens are rotated by
# hand: docs/procedures/database-password-rotation.md for the database, the
# provider dashboards for DO and CF, then the vault file.

- name: Rotate WordPress credentials
  hosts: webservers
  gather_facts: false
  become: true

  vars:
    wpcli_path: "/usr/local/bin/wp"
    rotate_salts: true

  tasks:
    # rotate_db_password used to tick a checklist box without changing
    # anything. Stop a caller that still passes it rather than let it
    # believe the database password was rotated.
    - name: Refuse rotate_db_password
      ansible.builtin.fail:
        msg: >-
          rotate_db_password is not supported: this playbook does not rotate the
          database password. Rotate it by hand with
          docs/procedures/database-password-rotation.md, then run this playbook
          without rotate_db_password.
      when: rotate_db_password | default(false) | bool

    - name: Display rotation checklist
      ansible.builtin.debug:
        msg: |
          === Credential Rotation Checklist ===
          Manual steps (rotate in dashboard, update vault):
            [ ] DigitalOcean API token (DO_TOKEN)
            [ ] Cloudflare API token
            [ ] New Relic license key
            [ ] WordPress DB password (docs/procedures/database-password-rotation.md)
          Automated by this playbook:
            [{{ 'x' if rotate_salts else ' ' }}] WordPress auth salts
          ======================================

    - name: Regenerate WordPress salts
      ansible.builtin.command: >
        {{ wpcli_path }} config shuffle-salts
        --path={{ wordpress_installs[0].path }}
        --allow-root
      when: rotate_salts
      register: salt_result

    - name: Salt rotation result
      ansible.builtin.debug:
        msg: "Salts rotated successfully. Update vault_wp_main_*_key and vault_wp_main_*_salt values to match."
      when: salt_result is changed

    - name: Remind about vault update
      ansible.builtin.debug:
        msg: |
          IMPORTANT: After rotating credentials:
          1. Update ansible/group_vars/vault.yml with new values
          2. Re-encrypt: ansible-vault encrypt ansible/group_vars/vault.yml
          3. Update ANSIBLE_VAULT_FILE secret in GitHub (base64 of vault file)
          4. Test deploy to staging before production
