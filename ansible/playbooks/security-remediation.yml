---
# Security Remediation Playbook
# ==============================
# Responds to the Jan-2026 breach and the unauthorized mark_murray admin account
# (User ID 46, created 2026-02-14, email murray@cawrecycles.org).
#
# Required actions from issue #<issue>:
#   1. Remove the mark_murray account immediately
#   2. Rotate all WordPress auth keys/salts
#   3. Audit admin accounts for additional persistence mechanisms
#   4. Enable login notifications for admin accounts
#   5. Scan for webshells in uploads directories
#   6. Verify WordPress core file integrity
#   7. Audit SSH authorized_keys across all users
#   8. Audit cron jobs for unexpected scheduled tasks
#
# Usage:
#   ansible-playbook playbooks/security-remediation.yml -i inventory/production
#   ansible-playbook playbooks/security-remediation.yml -i inventory/production --check

- name: WordPress security remediation
  hosts: production
  become: true
  gather_facts: false

  vars:
    wp_bin: "{{ wpcli_path | default('/usr/local/bin/wp') }}"

  tasks:
    # -------------------------------------------------------------------------
    # 1. Remove unauthorized accounts (wp_users_remove list)
    # -------------------------------------------------------------------------
    - name: Remove unauthorized WordPress user accounts
      command: >
        {{ wp_bin }} user delete {{ item.id }}
        --reassign=1 --yes --path={{ wp_site.path }} --allow-root
      loop: "{{ wp_users_remove | default([]) }}"
      loop_control:
        label: "{{ item.username }} (ID {{ item.id }}) — {{ item.reason }}"
      register: wp_user_delete
      changed_when: "'Deleted user' in wp_user_delete.stdout"
      failed_when: false
      vars:
        wp_site: "{{ wordpress_installs | selectattr('name', 'equalto', 'pausatf-main') | first }}"

    # -------------------------------------------------------------------------
    # 2. Rotate WordPress authentication keys and salts
    # -------------------------------------------------------------------------
    - name: Rotate WordPress auth keys and salts
      command: >
        {{ wp_bin }} config shuffle-salts
        --path={{ wp_site.path }} --allow-root
      vars:
        wp_site: "{{ wordpress_installs | selectattr('name', 'equalto', 'pausatf-main') | first }}"
      register: salt_rotation
      changed_when: true

    # -------------------------------------------------------------------------
    # 3. Audit admin accounts for additional persistence
    # -------------------------------------------------------------------------
    - name: List current administrator accounts
      command: >
        {{ wp_bin }} user list --role=administrator
        --fields=ID,user_login,user_email,user_registered
        --format=table --path={{ wp_site.path }} --allow-root
      vars:
        wp_site: "{{ wordpress_installs | selectattr('name', 'equalto', 'pausatf-main') | first }}"
      register: admin_list
      changed_when: false

    - name: Display current administrators (review for unexpected accounts)
      debug:
        var: admin_list.stdout_lines

    - name: Get administrator login names
      command: >
        {{ wp_bin }} user list --role=administrator
        --field=user_login --path={{ wp_site.path }} --allow-root
      vars:
        wp_site: "{{ wordpress_installs | selectattr('name', 'equalto', 'pausatf-main') | first }}"
      register: admin_logins
      changed_when: false

    - name: Build authorized administrator logins
      set_fact:
        wp_authorized_admins: >-
          {{ wp_users | default([]) | selectattr('roles', 'search', 'administrator') | map(attribute='username') | list }}

    - name: Identify unexpected administrator accounts
      set_fact:
        wp_unexpected_admins: >-
          {{ admin_logins.stdout_lines | default([]) | difference(wp_authorized_admins) }}

    - name: Warn about unexpected administrator accounts
      debug:
        msg: >
          WARNING: Unexpected administrator account(s) found: {{ wp_unexpected_admins | join(', ') }}.
          Investigate and add to wp_users_remove if confirmed illegitimate.
      when: wp_unexpected_admins | length > 0

    - name: Confirm no unexpected administrators remain
      assert:
        that: wp_unexpected_admins | length == 0
        fail_msg: >
          Unexpected administrator account(s) remain: {{ wp_unexpected_admins | join(', ') }}.
          Manual review required before completing remediation.
        success_msg: "All administrator accounts are in the authorized list."

    # -------------------------------------------------------------------------
    # 4. Enable Jetpack login notifications for admins
    # -------------------------------------------------------------------------
    - name: Check if Jetpack is active
      command: >
        {{ wp_bin }} plugin is-active jetpack
        --path={{ wp_site.path }} --allow-root
      vars:
        wp_site: "{{ wordpress_installs | selectattr('name', 'equalto', 'pausatf-main') | first }}"
      register: jetpack_active
      changed_when: false
      failed_when: false

    - name: Enable Jetpack master user login notification
      # Use option patch insert to avoid overwriting the full jetpack_options blob.
      # wp option update would replace the entire serialized object.
      command: >
        {{ wp_bin }} option patch insert jetpack_options master_user_login_notification true
        --path={{ wp_site.path }} --allow-root
      vars:
        wp_site: "{{ wordpress_installs | selectattr('name', 'equalto', 'pausatf-main') | first }}"
      when: jetpack_active.rc == 0
      register: jetpack_notif
      changed_when: "'Success' in jetpack_notif.stdout"

    # -------------------------------------------------------------------------
    # 5. Webshell scan — PHP files in uploads directories
    # -------------------------------------------------------------------------
    - name: Find PHP files in uploads directories (potential webshells)
      find:
        paths: "{{ item.path }}/wp-content/uploads"
        patterns: "*.php,*.phtml,*.php7,*.phar"
        recurse: true
      loop: "{{ wordpress_installs }}"
      loop_control:
        label: "{{ item.name }}"
      register: uploads_php_scan
      failed_when: false
      changed_when: false

    - name: Fail if PHP files found in any uploads directory
      fail:
        msg: >
          WEBSHELL DETECTED in {{ item.item.name }} ({{ item.item.path }}):
          {{ item.files | map(attribute='path') | list | join(', ') }}
          Investigate and remove before continuing.
      loop: "{{ uploads_php_scan.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.matched | default(0) | int > 0

    # -------------------------------------------------------------------------
    # 6. WordPress core integrity check
    # -------------------------------------------------------------------------
    - name: Verify WordPress core checksums
      command: >
        {{ wp_bin }} core verify-checksums
        --path={{ item.path }} --allow-root
      loop: "{{ wordpress_installs }}"
      loop_control:
        label: "{{ item.name }}"
      register: wp_checksums
      changed_when: false
      failed_when: false

    - name: Fail if core checksums do not match
      fail:
        msg: >
          WordPress core checksum mismatch in {{ item.item.name }} ({{ item.item.path }}):
          {{ item.stderr_lines | join(' ') }}
          Core files may have been tampered with — investigate immediately.
      loop: "{{ wp_checksums.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.rc | default(0) != 0

    # -------------------------------------------------------------------------
    # 7. SSH authorized_keys audit
    # -------------------------------------------------------------------------
    - name: Find all authorized_keys files
      find:
        paths:
          - /root/.ssh
          - /home
        patterns: "authorized_keys"
        recurse: true
      register: auth_keys_files
      changed_when: false

    - name: Read authorized_keys contents
      command: cat {{ item.path }}
      loop: "{{ auth_keys_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      changed_when: false
      register: auth_keys_content

    - name: Display authorized_keys for manual review
      debug:
        msg: "{{ item.item.path }}:\n{{ item.stdout }}"
      loop: "{{ auth_keys_content.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    # -------------------------------------------------------------------------
    # 8. Cron job audit
    # -------------------------------------------------------------------------
    - name: Enumerate all user cron jobs
      shell: |
        set -o pipefail
        for user in $(cut -f1 -d: /etc/passwd); do
          crontab -u "$user" -l 2>/dev/null \
            | grep -v '^#' | grep -v '^[[:space:]]*$' \
            | sed "s/^/${user}: /" || true
        done
      changed_when: false
      register: all_crontabs

    - name: Display cron jobs for manual review
      debug:
        msg: "{{ all_crontabs.stdout_lines | default(['(no cron jobs found)']) }}"

    # -------------------------------------------------------------------------
    # 9. Summary
    # -------------------------------------------------------------------------
    - name: Remediation summary
      debug:
        msg: |
          ============================================================
          Security Remediation Complete
          ============================================================
          Accounts removed : {{ wp_users_remove | default([]) | map(attribute='username') | join(', ') or 'none' }}
          Auth salts rotated: {{ 'yes' if (salt_rotation is defined and salt_rotation.rc is defined and salt_rotation.rc == 0) else 'FAILED' }}
          Admin audit      : {{ 'PASS — no unexpected admins' if wp_unexpected_admins | length == 0 else 'FAIL — review required' }}
          Login notify     : {{ 'enabled (Jetpack)' if (jetpack_active.rc == 0 and jetpack_notif is defined and jetpack_notif.rc is defined and jetpack_notif.rc == 0) else 'skipped (Jetpack not active)' }}
          Webshell scan    : PASS — no PHP files in uploads
          Core checksums   : PASS — all installs verified clean
          SSH keys         : displayed above — review output manually
          Cron jobs        : displayed above — review output manually
          ============================================================
          Next steps:
            - Rotate WordPress database password (vault_wp_main_db_password)
            - Rotate all admin user passwords manually
            - Review server access logs for the Jan-2026 breach window
            - Re-run capture-wp-inventory.yml to refresh group_vars
            - Add DO_TOKEN + DO_PROD_DROPLET_ID repo secrets to restore nightly snapshots
