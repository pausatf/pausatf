# MySQL role - Database configuration for PAUSATF
# Skipped entirely when using a managed database (mysql_managed: true).

- name: Assert MySQL root password is configured
  assert:
    that:
      - mysql_root_password | length > 0
    fail_msg: "mysql_root_password must be set via vault for local MySQL installations"
  when: not (mysql_managed | default(false))

- name: Local MySQL setup
  when: not (mysql_managed | default(false))
  block:
    - name: Install MySQL packages
      apt:
        name:
          - mysql-server
          - mysql-client
          - python3-mysqldb
          - python3-pymysql
        state: present

    - name: Ensure MySQL is started and enabled
      service:
        name: mysql
        state: started
        enabled: yes

    - name: Deploy MySQL configuration
      template:
        src: mysqld.cnf.j2
        dest: /etc/mysql/mysql.conf.d/mysqld.cnf
        owner: root
        group: root
        mode: '0644'
        backup: yes
      notify: Restart MySQL

    - name: Create MySQL log directory
      file:
        path: /var/log/mysql
        state: directory
        owner: mysql
        group: adm
        mode: '0750'

    - name: Set MySQL root password
      mysql_user:
        name: root
        password: "{{ mysql_root_password }}"
        host: localhost
        login_unix_socket: "{{ mysql_socket }}"
        state: present
      no_log: true
      register: root_pwd_result
      # Access denied is expected on re-runs when root is already secured via
      # a different auth method (e.g. auth_socket). Any other failure is real.
      failed_when: root_pwd_result.failed and 'Access denied' not in (root_pwd_result.msg | default(''))

    - name: Create .my.cnf for root
      template:
        src: root-my.cnf.j2
        dest: /root/.my.cnf
        owner: root
        group: root
        mode: '0600'

    - name: Remove anonymous MySQL users
      mysql_user:
        name: ''
        host_all: yes
        state: absent
        login_unix_socket: "{{ mysql_socket }}"

    - name: Remove test database
      mysql_db:
        name: test
        state: absent
        login_unix_socket: "{{ mysql_socket }}"

    - name: Create WordPress databases
      mysql_db:
        name: "{{ item.db_name }}"
        state: present
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci
        login_unix_socket: "{{ mysql_socket }}"
      loop: "{{ wordpress_installs }}"
      loop_control:
        # Suppress full item dict (contains db_password) from log output
        label: "{{ item.db_name | default('unknown') }}"
      when: item.db_name is defined

    - name: Create WordPress database users
      mysql_user:
        name: "{{ item.db_user }}"
        password: "{{ item.db_password }}"
        priv: "{{ item.db_name }}.*:SELECT,INSERT,UPDATE,DELETE,CREATE,DROP,INDEX,ALTER,CREATE TEMPORARY TABLES,LOCK TABLES"
        host: localhost
        state: present
        login_unix_socket: "{{ mysql_socket }}"
      loop: "{{ wordpress_installs }}"
      loop_control:
        label: "{{ item.db_name | default('unknown') }}"
      when: item.db_user is defined
      no_log: true

    - name: Configure MySQL slow query log
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: "^#?slow_query_log"
        line: "slow_query_log = 1"
      notify: Restart MySQL

    - name: Configure MySQL slow query log file
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: "^#?slow_query_log_file"
        line: "slow_query_log_file = /var/log/mysql/mysql-slow.log"
      notify: Restart MySQL

    - name: Configure MySQL long query time
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        regexp: "^#?long_query_time"
        line: "long_query_time = 2"
      notify: Restart MySQL

  rescue:
    - name: MySQL setup failed
      fail:
        msg: "MySQL setup failed. Review the task output above for details."
