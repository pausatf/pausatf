---
- name: Converge
  hosts: all
  become: true
  vars:
    web_server: apache
    cloudflare_zone: "example.com"
    cloudflare_zone_id: "test-zone-id-molecule"
    cloudflare_api_token: "test-api-token-molecule"
    cloudflare_email: "test@example.com"
    cloudflare_ssl_mode: "strict"
    cloudflare_min_tls_version: "1.2"
    cloudflare_always_use_https: true
    cloudflare_security_level: "medium"
    cloudflare_manage_dns: false
    cloudflare_purge_cache: false
    legacy_content_path: /var/www/legacy
  pre_tasks:
    - name: Install Apache (dependency)
      apt:
        name:
          - apache2
          - python3-pip
        state: present
        update_cache: true
    - name: Enable remoteip module
      command: a2enmod remoteip
      args:
        creates: /etc/apache2/mods-enabled/remoteip.load
    - name: Create legacy data directory
      file:
        path: /var/www/legacy/public_html/data
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
  roles:
    - role: cloudflare
      vars:
        # Skip tasks that call the real Cloudflare API
        cloudflare_ssl_mode: null
        cloudflare_min_tls_version: null
        cloudflare_always_use_https: null
        cloudflare_security_level: null
      tags:
        - cloudflare
  tasks:
    # Run only local-file tasks (skip API calls) by overriding the
    # uri tasks to be skipped via tags. The converge focuses on
    # file deployment, not API integration.
    - name: Note
      debug:
        msg: >
          Cloudflare API tasks are skipped in molecule.
          This test verifies script deployment and cron scheduling only.
