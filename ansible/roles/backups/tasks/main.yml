---
# Backups role — automated daily WordPress backups for PAUSATF
# DB dump via WP-CLI, uploads rsync, retention pruning, cron scheduling

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags:
    - backups

- name: Create uploads backup subdirectory
  ansible.builtin.file:
    path: "{{ backup_dir }}/uploads"
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags:
    - backups

- name: Deploy backup script
  ansible.builtin.template:
    src: backup-pausatf.sh.j2
    dest: "{{ backup_script_path }}"
    owner: root
    group: root
    mode: "0750"
  notify: Validate backup script
  tags:
    - backups

- name: Schedule daily backup cron job
  ansible.builtin.cron:
    name: "PAUSATF daily backup"
    hour: "{{ backup_cron_hour }}"
    minute: "{{ backup_cron_minute }}"
    job: "{{ backup_script_path }} >> /var/log/pausatf-backup.log 2>&1"
    user: root
  tags:
    - backups

- name: Configure logrotate for backup log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/pausatf-backup
    content: |
      /var/log/pausatf-backup.log {
          weekly
          rotate 4
          compress
          missingok
          notifempty
      }
    owner: root
    group: root
    mode: "0644"
  tags:
    - backups
