---
# New Relic role - Application monitoring for PAUSATF

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download New Relic repository key
  get_url:
    url: https://download.newrelic.com/infrastructure_agent/gpg/newrelic-infra.gpg
    dest: /etc/apt/keyrings/newrelic-infra.gpg
    mode: '0644'

- name: Add New Relic repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/newrelic-infra.gpg] https://download.newrelic.com/infrastructure_agent/linux/apt {{ ansible_distribution_release }} main"
    state: present
    filename: newrelic-infra

- name: Install New Relic infrastructure agent
  apt:
    name: newrelic-infra
    state: present
    update_cache: yes

- name: Deploy New Relic infrastructure configuration
  template:
    src: newrelic-infra.yml.j2
    dest: /etc/newrelic-infra.yml
    owner: root
    group: root
    mode: '0600'
  notify: Restart New Relic infrastructure

- name: Install New Relic PHP agent
  apt:
    name: newrelic-php5
    state: present

- name: Set New Relic PHP SAPI
  set_fact:
    _newrelic_sapi: "{{ 'fpm' if (use_php_fpm | default(false)) else 'apache2' }}"

- name: Configure New Relic PHP agent
  template:
    src: newrelic.ini.j2
    dest: "/etc/php/{{ php_version }}/mods-available/newrelic.ini"
    owner: root
    group: root
    mode: '0644'
  notify: "{{ 'Restart PHP-FPM' if (use_php_fpm | default(false)) else 'Restart Apache' }}"

- name: Check if New Relic PHP module is enabled
  stat:
    path: "/etc/php/{{ php_version }}/{{ _newrelic_sapi }}/conf.d/20-newrelic.ini"
  register: newrelic_module_enabled
  changed_when: false

- name: Enable New Relic PHP module
  command: "phpenmod -v {{ php_version }} newrelic"
  when: not newrelic_module_enabled.stat.exists
  changed_when: true
  notify: "{{ 'Restart PHP-FPM' if (use_php_fpm | default(false)) else 'Restart Apache' }}"

- name: Ensure New Relic services are started
  service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - newrelic-infra
