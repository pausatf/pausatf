---
# ModSecurity role — WAF configuration for PAUSATF
# CRS is installed via the modsecurity-crs Debian package.

- name: Install ModSecurity CRS package
  ansible.builtin.apt:
    name:
      - libapache2-mod-security2
      - modsecurity-crs
    state: present

- name: Create ModSecurity working directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0750"
  loop:
    - "{{ modsecurity_tmp_dir }}"
    - "{{ modsecurity_data_dir }}"

- name: Deploy ModSecurity configuration
  ansible.builtin.template:
    src: modsecurity.conf.j2
    dest: /etc/modsecurity/modsecurity.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload Apache

- name: Ensure CRS setup directory exists
  ansible.builtin.file:
    path: /etc/modsecurity/crs
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy CRS pre-rules exclusion file
  ansible.builtin.copy:
    src: REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
    dest: /etc/modsecurity/crs/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload Apache

- name: Deploy CRS post-rules exclusion file
  ansible.builtin.copy:
    src: RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
    dest: /etc/modsecurity/crs/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload Apache

- name: Deploy WPRS setup configuration
  ansible.builtin.template:
    src: wprs/01-SETUP.conf.j2
    dest: /etc/modsecurity/crs/wprs-01-SETUP.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload Apache

- name: Deploy WPRS rule files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/modsecurity/crs/wprs-{{ item | basename }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - wprs/02-INITIALIZATION.conf
    - wprs/03-BRUTEFORCE.conf
    - wprs/04-EVENTS.conf
    - wprs/05-HARDENING.conf
  notify: Reload Apache

- name: Ensure ModSecurity audit log exists
  ansible.builtin.file:
    path: "{{ modsecurity_audit_log }}"
    state: touch
    owner: root
    group: adm
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Deploy ModSecurity audit log rotation
  ansible.builtin.copy:
    dest: /etc/logrotate.d/modsecurity
    content: |
      {{ modsecurity_audit_log }} {
          weekly
          missingok
          rotate 12
          compress
          delaycompress
          notifempty
          postrotate
              systemctl reload apache2 > /dev/null 2>&1 || true
          endscript
      }
    owner: root
    group: root
    mode: "0644"
