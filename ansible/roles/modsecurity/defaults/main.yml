---
modsecurity_enabled: true
# DetectionOnly = audit/log only, On = blocking, Off = disabled
modsecurity_rule_engine: "DetectionOnly"
modsecurity_request_body_access: true
modsecurity_request_body_limit: 13107200
modsecurity_request_body_nofiles_limit: 131072
modsecurity_request_body_inmemory_limit: 131072
modsecurity_request_body_limit_action: "Reject"
modsecurity_response_body_access: true
modsecurity_response_body_mime_types: "text/plain text/html text/xml"
modsecurity_response_body_limit: 524288
modsecurity_response_body_limit_action: "ProcessPartial"
modsecurity_pcre_match_limit: 100000
modsecurity_pcre_match_limit_recursion: 100000
modsecurity_audit_engine: "RelevantOnly"
modsecurity_audit_log_relevant_status: '"^(?:5|4(?!04))"'
modsecurity_audit_log_parts: "ABDEFHIJZ"
modsecurity_audit_log_type: "Serial"
modsecurity_audit_log: "/var/log/apache2/modsec_audit.log"
modsecurity_tmp_dir: "/var/lib/modsecurity/tmp"
modsecurity_data_dir: "/var/lib/modsecurity/data"
modsecurity_unicode_map_file: "unicode.mapping 20127"
modsecurity_argument_separator: "&"
modsecurity_cookie_format: 0
modsecurity_status_engine: true

# OWASP CRS settings
modsecurity_crs_enabled: true
modsecurity_crs_paranoia_level: 1
modsecurity_crs_anomaly_threshold_inbound: 5
modsecurity_crs_anomaly_threshold_outbound: 4
