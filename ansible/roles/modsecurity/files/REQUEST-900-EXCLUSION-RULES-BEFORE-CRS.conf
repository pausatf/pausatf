# pausatf.org ModSecurity CRS Exclusions
# Generated: 2026-03-18 from audit log analysis
#
# These rules are whitelisted because they are false positives
# from legitimate bot traffic, not real attacks.

# WordPress CRS exclusion (built-in)
SecAction "id:900130, phase:1, pass, t:none, nolog, \
    setvar:tx.crs_exclusions_wordpress=1"

# Rule 920450: accept-charset header restricted
# Triggered 35 times by DotBot and SemrushBot crawlers.
# These bots send Accept-Charset headers which CRS flags as
# a restricted header. This is legitimate bot behavior.
SecRuleRemoveById 920450

# Rule 920440: URL file extension restricted
# Triggered 1 time on a directory listing request.
# Legacy /data/ paths serve PDFs and static files.
# The extension check blocks access to legitimate content.
SecRuleRemoveById 920440

# Allow Jetpack/WordPress.com callbacks
# Jetpack phones home to WP.com for stats, backup, etc.
SecRule REQUEST_HEADERS:User-Agent "@contains WordPress" \
    "id:900200, phase:1, pass, t:none, nolog, \
    ctl:ruleRemoveById=942100, \
    ctl:ruleRemoveById=942200, \
    ctl:ruleRemoveById=942260"

# Allow WordPress REST API (wp-json)
# Internal API calls may trigger SQL injection false positives
SecRule REQUEST_URI "@beginsWith /wp-json/" \
    "id:900201, phase:1, pass, t:none, nolog, \
    ctl:ruleRemoveById=942100, \
    ctl:ruleRemoveById=942200, \
    ctl:ruleRemoveById=942260, \
    ctl:ruleRemoveById=941100, \
    ctl:ruleRemoveById=941160"

# Allow WordPress admin AJAX
SecRule REQUEST_URI "@beginsWith /wp-admin/admin-ajax.php" \
    "id:900202, phase:1, pass, t:none, nolog, \
    ctl:ruleRemoveById=942100, \
    ctl:ruleRemoveById=942200, \
    ctl:ruleRemoveById=942260, \
    ctl:ruleRemoveById=941100, \
    ctl:ruleRemoveById=941160, \
    ctl:ruleRemoveById=921110"

# Allow WordPress post editor (Gutenberg/Classic)
# Block editor sends HTML in POST which triggers XSS rules
SecRule REQUEST_URI "@beginsWith /wp-admin/post.php" \
    "id:900203, phase:1, pass, t:none, nolog, \
    ctl:ruleRemoveById=941100, \
    ctl:ruleRemoveById=941110, \
    ctl:ruleRemoveById=941120, \
    ctl:ruleRemoveById=941130, \
    ctl:ruleRemoveById=941140, \
    ctl:ruleRemoveById=941160, \
    ctl:ruleRemoveById=941170, \
    ctl:ruleRemoveById=941180, \
    ctl:ruleRemoveById=941210, \
    ctl:ruleRemoveById=941350, \
    ctl:ruleRemoveById=942100, \
    ctl:ruleRemoveById=942200, \
    ctl:ruleRemoveById=942260"

# Allow Contact Form 7 submissions
SecRule REQUEST_URI "@contains /wp-json/contact-form-7/" \
    "id:900204, phase:1, pass, t:none, nolog, \
    ctl:ruleRemoveById=942100, \
    ctl:ruleRemoveById=942200"

# Allow wp-login.php (password field triggers detection)
SecRule REQUEST_URI "@streq /wp-login.php" \
    "id:900205, phase:1, pass, t:none, nolog, \
    ctl:ruleRemoveById=942100"

# Allow static file access in /data/ (legacy PDFs, docs)
SecRule REQUEST_URI "@beginsWith /data/" \
    "id:900206, phase:1, pass, t:none, nolog, \
    ctl:ruleRemoveById=920440"


# === Added 2026-03-28 from audit log analysis ===

# Jetpack health check callbacks (/jetpack-temp/jp-helper-*.php)
# 1,748 hits/day, all from Automattic IPs (192.0.64.0/18)
# These POST requests trigger anomaly scoring due to content type
SecRule REQUEST_URI "@beginsWith /jetpack-temp/" \
    "id:900210, phase:1, pass, t:none, nolog, \
    ctl:ruleRemoveById=920420, \
    ctl:ruleRemoveById=200002, \
    ctl:ruleRemoveById=949110, \
    ctl:ruleRemoveById=980130"

# Whitelist Jetpack/Automattic IPs from anomaly scoring
SecRule REMOTE_ADDR "@ipMatch 192.0.64.0/18,192.0.80.0/20,192.0.96.0/20,192.0.112.0/20,195.234.108.0/22,122.248.245.244,54.217.201.243,54.232.116.4" \
    "id:900211, phase:1, pass, t:none, nolog, \
    ctl:ruleRemoveById=949110, \
    ctl:ruleRemoveById=980130"

# Rule 200002: Failed to parse request body
# Triggered by malformed bot requests and multipart uploads
# Not actionable in audit mode, adds noise
SecRule REQUEST_URI "@beginsWith /wp-admin/" \
    "id:900212, phase:1, pass, t:none, nolog, \
    ctl:ruleRemoveById=200002"
# Rule 920440: Email addresses appear in URL paths across the legacy /data/ directory,
# /pausatf-contacts/ pages, and /youth/ section. The TLD segment (.com, .net, .org)
# matches the restricted-extension blocklist, causing false 403s on real site pages.
SecRule REQUEST_URI "@rx ^/(data|pausatf-contacts|youth)/" \
    "id:1001001,phase:1,pass,nolog,ctl:ruleRemoveById=920440"

# Rule 921110: Jetpack uses system.multicall via xmlrpc.php to sync plugin and theme
# state with the WordPress.com API. The multicall body matches the HTTP smuggling
# pattern because it embeds HTTP method names and URLs as XML text nodes.
SecRule REQUEST_URI "@streq /xmlrpc.php" \
    "id:1001002,phase:1,pass,nolog,ctl:ruleRemoveById=921110"

# Rule 921190: Some legacy post slugs contain encoded special characters (colons,
# semicolons, parentheses) from post titles. The encoded sequences match the
# CR/LF-in-filename detection pattern at paranoia level 1.
SecRule REQUEST_URI "@rx %(?:3[AB]|28|29|2[BC])" \
    "id:1001003,phase:1,pass,nolog,ctl:ruleRemoveById=921190"

# Rule 920350: Requests arriving with a numeric IP host header are handled by the
# block-direct-ip vhost which returns 403 before WordPress runs. Skip the CRS
# anomaly scoring to avoid redundant log noise on these already-denied requests.
SecRule REQUEST_HEADERS:Host "@rx ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}" \
    "id:1001004,phase:1,pass,nolog,ctl:ruleRemoveById=920350"

# Rule 932115: TablePress sends table cell content via admin-ajax.php that includes
# strings like '& REG INFO' (meeting registration notes) which match the Windows
# command injection pattern. Scope the exclusion to POST args on this endpoint
# only; the URL and all other rules remain fully inspected.
SecRule REQUEST_URI "@streq /wp-admin/admin-ajax.php" \
    "id:1001005,phase:1,pass,nolog,ctl:ruleRemoveTargetById=932115;ARGS"

# teeters-php/scorer_upload.php: race result file uploader (Jeff Teeters).
# Uploaded HTML race result files contain attributes and script-like content
# that triggers XSS rules (941100, 941160, 941110). Request body inspection
# disabled; the script enforces HMAC authentication via /etc/pausatf/scorer-salt
# before accepting any file, and validates extensions and file size independently.
SecRule REQUEST_URI "@streq /teeters-php/scorer_upload.php" \
    "id:1001006,phase:1,pass,nolog,ctl:requestBodyAccess=Off"
