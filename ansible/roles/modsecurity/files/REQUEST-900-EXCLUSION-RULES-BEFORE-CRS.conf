# OWASP CRS — Local pre-CRS exclusions
# Add ctl:ruleRemoveById, ctl:ruleRemoveTargetById, etc. here.
# These are evaluated BEFORE the CRS rules load.
#
# Example: disable ModSecurity for a known scanner IP
# SecRule REMOTE_ADDR "@ipMatch 192.168.1.100" \
#     "id:1000,phase:1,pass,nolog,ctl:ruleEngine=Off"
#
# Example: exclude a parameter from SQLi inspection for a specific URL
# SecRule REQUEST_URI "@beginsWith /wp-admin/post.php" \
#     "id:1001,phase:1,pass,nolog,ctl:ruleRemoveTargetById=942100;ARGS:post_content"

# Enable built-in CRS WordPress exclusions.
# Without this, XSS rules (941100, 941140, 941160, 941180, 941190) trigger
# false positives on legitimate HTML content in the WordPress page editor,
# causing 403 Forbidden for admins.
SecAction \
    "id:1000130,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.crs_exclusions_wordpress=1"

# Widgets editor stores trusted admin HTML in widget-custom_html payloads.
# CRS XSS rules 941100/941160 are false positives on this endpoint and can block saves.
SecRule REQUEST_URI "@streq /wp-admin/widgets.php" \
    "id:1000131,phase:1,pass,nolog,ctl:ruleRemoveById=941100,ctl:ruleRemoveById=941160"

# Widgets admin responses can trigger CRS response regex limits and outbound scoring noise.
# Skip response-body inspection on this authenticated admin endpoint.
SecRule REQUEST_URI "@streq /wp-admin/widgets.php" \
    "id:1000132,phase:1,pass,nolog,ctl:responseBodyAccess=Off"
