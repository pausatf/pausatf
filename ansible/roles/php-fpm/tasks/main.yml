---
# PHP-FPM role — replaces mod_php with FPM over unix socket

- name: Add Ondrej PHP repository
  apt_repository:
    repo: "ppa:ondrej/php"
    state: present
    update_cache: yes

- name: Install PHP {{ php_version }}-FPM and extensions
  apt:
    name: "{{ _php_packages }}"
    state: present
  vars:
    _php_module_packages: "{{ php_modules | map('regex_replace', '^(.*)$', 'php' + (php_version | string) + '-\\1') | list }}"
    _php_extra_packages: "{{ ['php' + (php_version | string) + '-fpm', 'php' + (php_version | string) + '-memcached'] }}"
    _php_packages: "{{ _php_module_packages + _php_extra_packages }}"

- name: Remove mod_php if installed
  apt:
    name:
      - "libapache2-mod-php*"
    state: absent
  notify: Restart php-fpm

- name: Deploy FPM pool configuration
  template:
    src: www.conf.j2
    dest: /etc/php/{{ php_version }}/fpm/pool.d/www.conf
    owner: root
    group: root
    mode: '0644'
    backup: yes
  notify: Restart php-fpm

- name: Deploy php.ini for FPM
  template:
    src: php.ini.j2
    dest: /etc/php/{{ php_version }}/fpm/conf.d/99-pausatf.ini
    owner: root
    group: root
    mode: '0644'
  notify: Restart php-fpm

- name: Set default PHP CLI version
  alternatives:
    name: php
    path: /usr/bin/php{{ php_version }}
  register: php_alternatives
  failed_when:
    - php_alternatives.rc != 0
    - "'no alternatives' not in (php_alternatives.stderr | default(''))"

- name: Create PHP session directory
  file:
    path: /var/lib/php/sessions
    state: directory
    owner: www-data
    group: www-data
    mode: '0770'

- name: Ensure PHP {{ php_version }}-FPM is enabled and running
  service:
    name: php{{ php_version }}-fpm
    state: started
    enabled: yes
