- name: Converge
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install software-properties-common for add-apt-repository
      apt:
        name: software-properties-common
        state: present
      when: ansible_os_family == "Debian"

  roles:
    - role: php-fpm
