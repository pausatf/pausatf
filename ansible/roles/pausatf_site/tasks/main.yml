---
# Deploy and activate the consolidated PAUSATF Site plugin (pausatf/pausatf-site)
# at a pinned commit, then optionally retire the plugins it absorbed.

- name: Install git
  ansible.builtin.apt:
    name: git
    state: present
  tags:
    - pausatf_site

- name: Ensure the pausatf-site git metadata parent directory exists
  ansible.builtin.file:
    path: "{{ pausatf_site_git_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags:
    - pausatf_site

# wp-content/plugins is writable by the web server, so an existing
# pausatf-seo entry is reused only after it is shown to be this role's
# checkout: a real directory owned by root whose .git is a root-owned file
# pointing at pausatf_site_git_dir. Anything else stops the deploy untouched.
- name: Inspect an existing pausatf-seo plugin entry
  ansible.builtin.stat:
    path: "{{ pausatf_site_path }}"
    follow: false
  register: _pausatf_site_dir
  tags:
    - pausatf_site

- name: Inspect the existing checkout's .git entry
  ansible.builtin.stat:
    path: "{{ pausatf_site_path }}/.git"
    follow: false
  register: _pausatf_site_git
  when: _pausatf_site_dir.stat.exists
  tags:
    - pausatf_site

- name: Read the existing checkout's gitdir pointer
  ansible.builtin.slurp:
    src: "{{ pausatf_site_path }}/.git"
  register: _pausatf_site_gitdir
  when:
    - _pausatf_site_dir.stat.exists
    - _pausatf_site_git.stat.isreg | default(false)
    - not (_pausatf_site_git.stat.islnk | default(false))
  tags:
    - pausatf_site

# The pausatf-site rollout guide also requires a backup of any earlier
# pausatf-seo copy before it is replaced, so an unrecognized one is not removed.
- name: Refuse to reuse a pausatf-seo entry this role did not install
  ansible.builtin.assert:
    that:
      - _pausatf_site_dir.stat.isdir
      - not _pausatf_site_dir.stat.islnk
      - _pausatf_site_dir.stat.uid == 0
      - _pausatf_site_git.stat.exists
      - _pausatf_site_git.stat.isreg
      - not _pausatf_site_git.stat.islnk
      - _pausatf_site_git.stat.uid == 0
      - "(_pausatf_site_gitdir.content | b64decode | trim) == ('gitdir: ' ~ pausatf_site_git_dir)"
    fail_msg: >-
      {{ pausatf_site_path }} is not a checkout installed by this role. Inspect
      it, back it up, move it out of wp-content/plugins, and rerun the deploy.
    quiet: true
  when: _pausatf_site_dir.stat.exists
  tags:
    - pausatf_site

- name: Inspect the pausatf-site git metadata directory
  ansible.builtin.stat:
    path: "{{ pausatf_site_git_dir }}"
    follow: false
  register: _pausatf_site_git_dir
  tags:
    - pausatf_site

- name: Refuse git metadata that root does not own
  ansible.builtin.assert:
    that:
      - _pausatf_site_git_dir.stat.isdir
      - not _pausatf_site_git_dir.stat.islnk
      - _pausatf_site_git_dir.stat.uid == 0
    fail_msg: "{{ pausatf_site_git_dir }} must be a root-owned directory."
    quiet: true
  when: _pausatf_site_git_dir.stat.exists
  tags:
    - pausatf_site

- name: Clone or update pausatf-site at the pinned commit
  ansible.builtin.git:
    repo: "{{ pausatf_site_repo }}"
    dest: "{{ pausatf_site_path }}"
    separate_git_dir: "{{ pausatf_site_git_dir }}"
    version: "{{ pausatf_site_version }}"
    key_file: "{{ pausatf_site_git_key_file if pausatf_site_git_key_file | length > 0 else omit }}"
    accept_newhostkey: true
    update: true
    force: false
  notify: Flush WordPress object cache for pausatf-site
  tags:
    - pausatf_site

- name: Inspect the checkout after cloning
  ansible.builtin.stat:
    path: "{{ pausatf_site_path }}"
    follow: false
  register: _pausatf_site_checkout
  tags:
    - pausatf_site

# Guards the window between the checks above and the clone.
- name: Confirm the checkout is a root-owned directory
  ansible.builtin.assert:
    that:
      - _pausatf_site_checkout.stat.isdir
      - not _pausatf_site_checkout.stat.islnk
      - _pausatf_site_checkout.stat.uid == 0
    fail_msg: "{{ pausatf_site_path }} is not the root-owned checkout the clone created."
    quiet: true
  when: not ansible_check_mode or _pausatf_site_checkout.stat.exists
  tags:
    - pausatf_site

# The code stays root-owned and read-only to the web server; the plugin writes
# nothing into its own directory. An explicit mode corrects the clone's umask.
- name: Set pausatf-site plugin ownership and permissions
  ansible.builtin.file:
    path: "{{ pausatf_site_path }}"
    owner: root
    group: root
    mode: "u=rwX,g=rX,o=rX"
    recurse: true
    follow: false
    state: directory
  tags:
    - pausatf_site

- name: Check whether pausatf-site is active
  ansible.builtin.command: >-
    wp plugin is-active {{ pausatf_site_slug }}
    --path={{ pausatf_site_wp_docroot }}
    --allow-root
  register: _pausatf_site_active
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - pausatf_site

# Activation is additive. While the superseded plugins are still loaded,
# PAUSATF Site leaves passwordless sign-in and the committee content model to
# them, and its widget filter matches PAUSATF Core's for the same widget.
- name: Activate pausatf-site
  ansible.builtin.command: >-
    wp plugin activate {{ pausatf_site_slug }}
    --path={{ pausatf_site_wp_docroot }}
    --allow-root
  register: _pausatf_site_activate
  changed_when: "'activated' in _pausatf_site_activate.stdout"
  when: _pausatf_site_active.rc != 0
  notify: Flush WordPress object cache for pausatf-site
  tags:
    - pausatf_site

- name: Retire the plugins pausatf-site supersedes
  ansible.builtin.include_tasks: retire.yml
  when: pausatf_site_retire_superseded | bool
  tags:
    - pausatf_site
