---
- name: Install monitoring tools
  apt:
    name:
      - htop
      - iotop
      - iftop
      - nethogs
      - sysstat
      - vnstat
    state: present

- name: Enable sysstat
  lineinfile:
    path: /etc/default/sysstat
    regexp: '^ENABLED='
    line: 'ENABLED="true"'
    state: present
  notify: restart sysstat

- name: Start and enable vnstat
  systemd:
    name: vnstat
    state: started
    enabled: yes

- name: Start and enable sysstat
  systemd:
    name: sysstat
    state: started
    enabled: yes

- name: Deploy WordPress backup script
  template:
    src: backup-wordpress.sh.j2
    dest: /usr/local/sbin/backup-wordpress.sh
    owner: root
    group: root
    mode: '0700'

- name: Schedule nightly WordPress backup
  cron:
    name: "WordPress backup"
    minute: "{{ (backup_schedule.split(' '))[0] }}"
    hour: "{{ (backup_schedule.split(' '))[1] }}"
    day: "{{ (backup_schedule.split(' '))[2] }}"
    month: "{{ (backup_schedule.split(' '))[3] }}"
    weekday: "{{ (backup_schedule.split(' '))[4] }}"
    job: "/usr/local/sbin/backup-wordpress.sh >> /var/log/wordpress-backup.log 2>&1"
    state: "{{ 'present' if backup_enabled | default(true) else 'absent' }}"
