---
- name: Install monitoring tools
  apt:
    name:
      - htop
      - iotop
      - iftop
      - nethogs
      - sysstat
      - vnstat
    state: present

- name: Enable sysstat
  lineinfile:
    path: /etc/default/sysstat
    regexp: '^ENABLED='
    line: 'ENABLED="true"'
    state: present
  notify: restart sysstat

- name: Start and enable vnstat
  systemd:
    name: vnstat
    state: started
    enabled: yes

- name: Start and enable sysstat
  systemd:
    name: sysstat
    state: started
    enabled: yes

- name: Deploy WordPress backup script
  template:
    src: backup-wordpress.sh.j2
    dest: /usr/local/sbin/backup-wordpress.sh
    owner: root
    group: root
    mode: '0700'

- name: Ensure .well-known directory exists
  file:
    path: "{{ wordpress_installs[0].path | default('/var/www/html') }}/.well-known"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  when:
    - healthcheck_enabled | default(false)
    - wordpress_installs is defined
    - wordpress_installs | length > 0

- name: Deploy health check endpoint
  template:
    src: health-check.php.j2
    dest: "{{ wordpress_installs[0].path | default('/var/www/html') }}/.well-known/health-check.php"
    owner: www-data
    group: www-data
    mode: '0640'
  when:
    - healthcheck_enabled | default(false)
    - wordpress_installs is defined
    - wordpress_installs | length > 0

- name: Schedule nightly WordPress backup
  cron:
    name: "WordPress backup"
    minute: "{{ (backup_schedule.split(' '))[0] }}"
    hour: "{{ (backup_schedule.split(' '))[1] }}"
    day: "{{ (backup_schedule.split(' '))[2] }}"
    month: "{{ (backup_schedule.split(' '))[3] }}"
    weekday: "{{ (backup_schedule.split(' '))[4] }}"
    job: "/usr/local/sbin/backup-wordpress.sh >> /var/log/wordpress-backup.log 2>&1"
    state: "{{ 'present' if backup_enabled | default(true) else 'absent' }}"

- name: Deploy Apache health check script
  template:
    src: httpd-check.sh.j2
    dest: /etc/cron.d/httpd-check.sh
    owner: root
    group: root
    mode: '0755'

- name: Schedule Apache health check every 30 minutes
  cron:
    name: "Apache health check"
    minute: "*/30"
    job: "/etc/cron.d/httpd-check.sh"
    user: root
