---
- name: Verify fail2ban
  hosts: all
  become: true
  tasks:
    - name: Validate Fail2ban configuration
      ansible.builtin.command: fail2ban-client -t
      changed_when: false

    - name: Verify rsyslog preserves individual authentication messages
      ansible.builtin.command:
        argv:
          - grep
          - -Fx
          - '$RepeatedMsgReduction off'
          - /etc/rsyslog.conf
      changed_when: false

    - name: Verify WordPress jails monitor the authentication log
      ansible.builtin.command:
        argv:
          - awk
          - |
            /^\[wordpress-auth\]$/ { jail = "auth"; next }
            /^\[wordpress-enum\]$/ { jail = "enum"; next }
            /^\[wordpress-hard\]$/ { jail = "hard"; next }
            /^\[wordpress-soft\]$/ { jail = "soft"; next }
            /^\[/ { jail = "" }
            /^logpath = \/var\/log\/auth\.log$/ && jail != "" { found[jail] = 1 }
            END { exit !(found["auth"] && found["enum"] && found["hard"] && found["soft"]) }
          - /etc/fail2ban/jail.local
      changed_when: false
