---
# Fail2ban role - Intrusion prevention for PAUSATF

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Deploy fail2ban configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Deploy WordPress authentication fail2ban filter
  ansible.builtin.template:
    src: wordpress-auth.conf.j2
    dest: /etc/fail2ban/filter.d/wordpress-auth.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Deploy WordPress user enumeration fail2ban filter
  ansible.builtin.template:
    src: wordpress-enum.conf.j2
    dest: /etc/fail2ban/filter.d/wordpress-enum.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Deploy OpenLiteSpeed fail2ban filter
  ansible.builtin.template:
    src: openlitespeed-auth.conf.j2
    dest: /etc/fail2ban/filter.d/openlitespeed-auth.conf
    owner: root
    group: root
    mode: "0644"
  when: web_server | default('apache') == 'openlitespeed'
  notify: Restart fail2ban

- name: Ensure fail2ban is started and enabled
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
