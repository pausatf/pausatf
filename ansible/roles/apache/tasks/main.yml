---
# Apache role — Web server configuration for PAUSATF
# Supports both mod_php (legacy) and PHP-FPM (Ubuntu 24.04+) via apache_mpm var

- name: Install Apache packages
  apt:
    name:
      - apache2
      - apache2-utils
      - libapache2-mod-security2
    state: present

- name: Ensure Apache modules directory exists
  file:
    path: /etc/apache2/mods-available
    state: directory

# MPM selection — event for FPM, prefork for mod_php
- name: Disable mpm_prefork (when using event MPM)
  apache2_module:
    name: mpm_prefork
    state: absent
    ignore_configcheck: true
  when: apache_mpm | default('prefork') == 'event'
  notify: Restart Apache
  ignore_errors: yes

- name: Disable mod_php (when using FPM)
  apache2_module:
    name: "php{{ php_version | default('7.4') | regex_replace('\\.', '') }}"
    state: absent
    ignore_configcheck: true
  when: apache_mpm | default('prefork') == 'event'
  notify: Restart Apache
  ignore_errors: yes

- name: Enable mpm_event (when using event MPM)
  apache2_module:
    name: mpm_event
    state: present
    ignore_configcheck: true
  when: apache_mpm | default('prefork') == 'event'
  notify: Restart Apache

- name: Enable proxy and proxy_fcgi for PHP-FPM
  apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - proxy
    - proxy_fcgi
  when: apache_mpm | default('prefork') == 'event'
  notify: Restart Apache

- name: Disable conflicting MPM modules (when using prefork)
  apache2_module:
    name: "{{ item }}"
    state: absent
  loop:
    - mpm_event
    - mpm_worker
  when: apache_mpm | default('prefork') == 'prefork'
  notify: Restart Apache
  ignore_errors: yes

- name: Enable required Apache modules
  apache2_module:
    name: "{{ item }}"
    state: present
  loop: "{{ apache_modules }}"
  notify: Restart Apache

- name: Deploy Apache main configuration
  template:
    src: apache2.conf.j2
    dest: /etc/apache2/apache2.conf
    owner: root
    group: root
    mode: '0644'
    backup: yes
  notify: Reload Apache

- name: Deploy ports configuration
  template:
    src: ports.conf.j2
    dest: /etc/apache2/ports.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload Apache

- name: Deploy MPM prefork configuration
  template:
    src: mpm_prefork.conf.j2
    dest: /etc/apache2/mods-available/mpm_prefork.conf
    owner: root
    group: root
    mode: '0644'
  when: apache_mpm | default('prefork') == 'prefork'
  notify: Restart Apache

- name: Deploy security configuration
  template:
    src: security.conf.j2
    dest: /etc/apache2/conf-available/security.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload Apache

- name: Enable security configuration
  file:
    src: /etc/apache2/conf-available/security.conf
    dest: /etc/apache2/conf-enabled/security.conf
    state: link
  notify: Reload Apache

- name: Deploy SSL configuration
  template:
    src: ssl.conf.j2
    dest: /etc/apache2/mods-available/ssl.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload Apache

- name: Remove default virtual host
  file:
    path: /etc/apache2/sites-enabled/000-default.conf
    state: absent
  notify: Reload Apache

- name: Deploy virtual host configurations
  template:
    src: vhost.conf.j2
    dest: "/etc/apache2/sites-available/{{ item.name }}.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ wordpress_installs }}"
  notify: Reload Apache

- name: Deploy SSL virtual host configurations
  template:
    src: vhost-ssl.conf.j2
    dest: "/etc/apache2/sites-available/{{ item.name }}-ssl.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ wordpress_installs }}"
  when: item.ssl_enabled | default(false)
  notify: Reload Apache

- name: Enable virtual hosts
  file:
    src: "/etc/apache2/sites-available/{{ item.name }}.conf"
    dest: "/etc/apache2/sites-enabled/{{ item.name }}.conf"
    state: link
  loop: "{{ wordpress_installs }}"
  notify: Reload Apache

- name: Enable SSL virtual hosts
  file:
    src: "/etc/apache2/sites-available/{{ item.name }}-ssl.conf"
    dest: "/etc/apache2/sites-enabled/{{ item.name }}-ssl.conf"
    state: link
  loop: "{{ wordpress_installs }}"
  when: item.ssl_enabled | default(false)
  notify: Reload Apache

- name: Deploy block-backups configuration
  copy:
    dest: /etc/apache2/conf-available/block-backups.conf
    content: |
      # Block access to backup and archive files at the server level.
      # Covers date/number-suffixed variants (e.g. wp-config.php.bak2025,
      # wp-config.php.backup-20250501) as well as plain .bak/.backup/.zip.
      <FilesMatch "\.(bak[^.]*|backup[^.]*|log|old|orig|sql|swp|tmp|zip)$">
          Require all denied
      </FilesMatch>
    mode: '0644'
  notify: Reload Apache

- name: Enable block-backups configuration
  file:
    src: /etc/apache2/conf-available/block-backups.conf
    dest: /etc/apache2/conf-enabled/block-backups.conf
    state: link
  notify: Reload Apache

- name: Deploy block-xmlrpc configuration
  copy:
    dest: /etc/apache2/conf-available/block-xmlrpc.conf
    content: |
      # Block WordPress XML-RPC attacks
      <Files xmlrpc.php>
          Require all denied
      </Files>
    mode: '0644'
  notify: Reload Apache

- name: Enable block-xmlrpc configuration
  file:
    src: /etc/apache2/conf-available/block-xmlrpc.conf
    dest: /etc/apache2/conf-enabled/block-xmlrpc.conf
    state: link
  notify: Reload Apache

- name: Disable default-ssl virtual host (conflicts with pausatf-main-ssl)
  file:
    path: /etc/apache2/sites-enabled/default-ssl.conf
    state: absent
  notify: Reload Apache

- name: Deploy phpMyAdmin localhost-only restriction
  copy:
    dest: /etc/apache2/conf-available/phpmyadmin-restrict.conf
    content: |
      # Restrict phpMyAdmin to server-local access only
      <Location /phpmyadmin>
          Require local
      </Location>
    owner: root
    group: root
    mode: '0644'
  notify: Reload Apache

- name: Enable phpMyAdmin localhost restriction
  file:
    src: /etc/apache2/conf-available/phpmyadmin-restrict.conf
    dest: /etc/apache2/conf-enabled/phpmyadmin-restrict.conf
    state: link
  notify: Reload Apache

- name: Block HTTP access to ai1wm-backups directory
  copy:
    dest: /var/www/html/wp-content/ai1wm-backups/.htaccess
    content: |
      <IfModule mod_authz_core.c>
          Require all denied
      </IfModule>
      <IfModule !mod_authz_core.c>
          Deny from all
      </IfModule>
    owner: www-data
    group: www-data
    mode: '0644'
  when: wordpress_installs | selectattr('path', 'equalto', '/var/www/html') | list | length > 0

- name: Deploy legacy /data/ alias configuration
  template:
    src: legacy-data.conf.j2
    dest: /etc/apache2/conf-available/legacy-data.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload Apache

- name: Enable legacy /data/ alias
  file:
    src: /etc/apache2/conf-available/legacy-data.conf
    dest: /etc/apache2/conf-enabled/legacy-data.conf
    state: link
  notify: Reload Apache

- name: Ensure Apache is started and enabled
  service:
    name: apache2
    state: started
    enabled: yes

- name: Verify Apache configuration
  command: apache2ctl configtest
  register: apache_configtest
  changed_when: false
  failed_when: "'Syntax OK' not in apache_configtest.stderr"
