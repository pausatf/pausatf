# Apache role — Web server configuration for PAUSATF
# Supports both mod_php (legacy) and PHP-FPM (Ubuntu 24.04+) via apache_mpm var

- name: Install Apache packages
  apt:
    name:
      - apache2
      - apache2-utils
    state: present

- name: Ensure Apache modules directory exists
  file:
    path: /etc/apache2/mods-available
    state: directory

# apache2_module is broken for idempotent runs: fails on "already enabled/disabled"
# modules due to conflict/dependency messages in a2enmod/a2dismod output.
# Use command tasks with proper changed_when/failed_when guards instead.

# MPM selection — event for FPM, prefork for mod_php
- name: Disable mpm_prefork (when using event MPM)
  command: a2dismod mpm_prefork
  register: _dis_prefork
  changed_when: "'Module mpm_prefork disabled' in _dis_prefork.stdout"
  failed_when: false
  when: apache_mpm | default('prefork') == 'event'
  notify: Restart Apache

- name: Disable mod_php (when using FPM)
  command: "a2dismod php{{ php_version | default('7.4') }}"
  register: _dis_php
  changed_when: "'Module' in _dis_php.stdout and 'disabled' in _dis_php.stdout"
  failed_when: false
  when: apache_mpm | default('prefork') == 'event'
  notify: Restart Apache

- name: Enable mpm_event (when using event MPM)
  command: a2enmod mpm_event
  register: _en_event
  changed_when: "'Enabling module' in _en_event.stdout"
  failed_when: "_en_event.rc != 0 and 'already enabled' not in _en_event.stdout"
  when: apache_mpm | default('prefork') == 'event'
  notify: Restart Apache

- name: Enable proxy and proxy_fcgi for PHP-FPM
  command: "a2enmod {{ item }}"
  register: _en_proxy
  changed_when: "'Enabling module' in _en_proxy.stdout"
  failed_when: "_en_proxy.rc != 0 and 'already enabled' not in _en_proxy.stdout"
  loop:
    - proxy
    - proxy_fcgi
  when: apache_mpm | default('prefork') == 'event'
  notify: Restart Apache

- name: Disable conflicting MPM modules (when using prefork)
  command: "a2dismod {{ item }}"
  register: _dis_mpm
  changed_when: "'disabled' in _dis_mpm.stdout"
  failed_when: false
  loop:
    - mpm_event
    - mpm_worker
  when: apache_mpm | default('prefork') == 'prefork'
  notify: Restart Apache

- name: Enable required Apache modules
  command: "a2enmod {{ item }}"
  register: _en_mod
  changed_when: "'Enabling module' in _en_mod.stdout"
  failed_when: "_en_mod.rc != 0 and 'already enabled' not in _en_mod.stdout"
  loop: "{{ apache_modules }}"
  notify: Restart Apache

- name: Deploy Apache main configuration
  template:
    src: apache2.conf.j2
    dest: /etc/apache2/apache2.conf
    owner: root
    group: root
    mode: '0644'
    backup: yes
  notify: Reload Apache

- name: Deploy ports configuration
  template:
    src: ports.conf.j2
    dest: /etc/apache2/ports.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload Apache

- name: Deploy MPM prefork configuration
  template:
    src: mpm_prefork.conf.j2
    dest: /etc/apache2/mods-available/mpm_prefork.conf
    owner: root
    group: root
    mode: '0644'
  when: apache_mpm | default('prefork') == 'prefork'
  notify: Restart Apache

- name: Deploy MPM event configuration
  template:
    src: mpm_event.conf.j2
    dest: /etc/apache2/mods-available/mpm_event.conf
    owner: root
    group: root
    mode: '0644'
  when: apache_mpm | default('prefork') == 'event'
  notify: Restart Apache

- name: Deploy security configuration
  template:
    src: security.conf.j2
    dest: /etc/apache2/conf-available/security.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload Apache

- name: Enable security configuration
  file:
    src: /etc/apache2/conf-available/security.conf
    dest: /etc/apache2/conf-enabled/security.conf
    state: link
    force: true
  notify: Reload Apache

- name: Deploy SSL configuration
  template:
    src: ssl.conf.j2
    dest: /etc/apache2/mods-available/ssl.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload Apache

- name: Remove default virtual host
  file:
    path: /etc/apache2/sites-enabled/000-default.conf
    state: absent
  notify: Reload Apache

- name: Deploy virtual host configurations
  template:
    src: vhost.conf.j2
    dest: "/etc/apache2/sites-available/{{ item.name }}.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ wordpress_installs }}"
  notify: Reload Apache

- name: Deploy SSL virtual host configurations
  template:
    src: vhost-ssl.conf.j2
    dest: "/etc/apache2/sites-available/{{ item.name }}-ssl.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ wordpress_installs }}"
  when: item.ssl_enabled | default(false)
  notify: Reload Apache

- name: Enable virtual hosts
  file:
    src: "/etc/apache2/sites-available/{{ item.name }}.conf"
    dest: "/etc/apache2/sites-enabled/{{ item.name }}.conf"
    state: link
    force: true
  loop: "{{ wordpress_installs }}"
  notify: Reload Apache

- name: Enable SSL virtual hosts
  file:
    src: "/etc/apache2/sites-available/{{ item.name }}-ssl.conf"
    dest: "/etc/apache2/sites-enabled/{{ item.name }}-ssl.conf"
    state: link
    force: true
  loop: "{{ wordpress_installs }}"
  when: item.ssl_enabled | default(false)
  notify: Reload Apache

- name: Deploy additional (non-WordPress) virtual hosts
  template:
    src: vhost.conf.j2
    dest: "/etc/apache2/sites-available/{{ item.name }}.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ additional_vhosts | default([]) }}"
  notify: Reload Apache

- name: Enable additional virtual hosts
  file:
    src: "/etc/apache2/sites-available/{{ item.name }}.conf"
    dest: "/etc/apache2/sites-enabled/{{ item.name }}.conf"
    state: link
    force: true
  loop: "{{ additional_vhosts | default([]) }}"
  notify: Reload Apache

- name: Deploy block-backups configuration
  copy:
    dest: /etc/apache2/conf-available/block-backups.conf
    content: |
      # Block access to backup and archive files at the server level.
      # Covers date/number-suffixed variants (e.g. wp-config.php.bak2025,
      # wp-config.php.backup-20250501) as well as plain .bak/.backup/.zip.
      <FilesMatch "\.(bak[^.]*|backup[^.]*|log|old|orig|sql|swp|tmp|zip)$">
          Require all denied
      </FilesMatch>
    mode: '0644'
  notify: Reload Apache

- name: Enable block-backups configuration
  file:
    src: /etc/apache2/conf-available/block-backups.conf
    dest: /etc/apache2/conf-enabled/block-backups.conf
    state: link
    force: true
  notify: Reload Apache

- name: Deploy block-xmlrpc configuration
  copy:
    dest: /etc/apache2/conf-available/block-xmlrpc.conf
    content: |
      # Block WordPress XML-RPC attacks
      <Files xmlrpc.php>
          Require all denied
      </Files>
    mode: '0644'
  notify: Reload Apache

- name: Enable block-xmlrpc configuration
  file:
    src: /etc/apache2/conf-available/block-xmlrpc.conf
    dest: /etc/apache2/conf-enabled/block-xmlrpc.conf
    state: link
    force: true
  notify: Reload Apache

- name: Disable default-ssl virtual host (conflicts with pausatf-main-ssl)
  file:
    path: /etc/apache2/sites-enabled/default-ssl.conf
    state: absent
  notify: Reload Apache

- name: Deploy phpMyAdmin access restriction
  copy:
    dest: /etc/apache2/conf-available/phpmyadmin-restrict.conf
    content: |
      # Restrict phpMyAdmin to authenticated users only
      <Location /phpmyadmin>
          AuthType Basic
          AuthName "phpMyAdmin - Authorized Access Only"
          AuthUserFile /etc/apache2/.phpmyadmin-htpasswd
          Require valid-user
      </Location>
    owner: root
    group: root
    mode: '0644'
  notify: Reload Apache

- name: Enable phpMyAdmin localhost restriction
  file:
    src: /etc/apache2/conf-available/phpmyadmin-restrict.conf
    dest: /etc/apache2/conf-enabled/phpmyadmin-restrict.conf
    state: link
    force: true
  notify: Reload Apache

- name: Block HTTP access to ai1wm-backups directory
  file:
    path: /var/www/html/wp-content/ai1wm-backups
    state: directory
    owner: www-data
    group: www-data
    mode: '0750'
  when: wordpress_installs | selectattr('path', 'equalto', '/var/www/html') | list | length > 0

- name: Deploy ai1wm-backups deny-all .htaccess
  copy:
    dest: /var/www/html/wp-content/ai1wm-backups/.htaccess
    content: |
      <IfModule mod_authz_core.c>
          Require all denied
      </IfModule>
      <IfModule !mod_authz_core.c>
          Deny from all
      </IfModule>
    owner: www-data
    group: www-data
    mode: '0644'
  when: wordpress_installs | selectattr('path', 'equalto', '/var/www/html') | list | length > 0

- name: Create teeters-php directory for scorer upload script
  file:
    path: /var/www/html/teeters-php
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create scorer credentials directory
  file:
    path: /etc/pausatf
    state: directory
    owner: root
    group: www-data
    mode: '0750'

- name: Deploy scorer upload token
  copy:
    content: "{{ vault_scorer_upload_token | default('') }}"
    dest: /etc/pausatf/scorer-upload-token
    owner: root
    group: www-data
    mode: '0640'

- name: Deploy scorer salt
  copy:
    content: "{{ vault_scorer_salt | default('') }}"
    dest: /etc/pausatf/scorer-salt
    owner: root
    group: www-data
    mode: '0640'

- name: Deploy scorer_upload.php
  copy:
    src: scorer_upload.php
    dest: /var/www/html/teeters-php/scorer_upload.php
    owner: root
    group: root
    mode: '0644'

- name: Deploy teeters-php open_basedir configuration
  template:
    src: teeters-php.conf.j2
    dest: /etc/apache2/conf-available/teeters-php.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload Apache

- name: Enable teeters-php configuration
  file:
    src: /etc/apache2/conf-available/teeters-php.conf
    dest: /etc/apache2/conf-enabled/teeters-php.conf
    state: link
    force: true
  notify: Reload Apache

- name: Deploy legacy /data/ alias configuration
  template:
    src: legacy-data.conf.j2
    dest: /etc/apache2/conf-available/legacy-data.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload Apache

- name: Enable legacy /data/ alias
  file:
    src: /etc/apache2/conf-available/legacy-data.conf
    dest: /etc/apache2/conf-enabled/legacy-data.conf
    state: link
    force: true
  notify: Reload Apache

- name: Ensure Apache is started and enabled
  service:
    name: apache2
    state: started
    enabled: yes

- name: Verify Apache configuration
  command: apache2ctl configtest
  register: apache_configtest
  changed_when: false
  failed_when: "'Syntax OK' not in apache_configtest.stderr"
