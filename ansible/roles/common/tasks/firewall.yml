---
- name: Reset UFW to default
  community.general.ufw:
    state: reset
  when: ufw_reset | default(false)

- name: Set UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: "incoming", policy: "deny" }
    - { direction: "outgoing", policy: "allow" }

- name: Compute SSH allow networks
  ansible.builtin.set_fact:
    ssh_allow_networks_effective: >-
      {{
        (
          (allowed_ssh_networks | default([]))
          + (
              [ansible_controller_cidr]
              if (ansible_controller_cidr | default('') | length > 0)
              else []
            )
          + ['100.64.0.0/10']
        ) | unique
      }}

- name: Warn if no explicit SSH networks configured
  ansible.builtin.debug:
    msg: "WARNING: No allowed_ssh_networks defined. SSH limited to Tailscale (100.64.0.0/10) and ansible controller CIDR only."
  when: allowed_ssh_networks | default([]) | length == 0

- name: Allow SSH from configured networks
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ ssh_allow_networks_effective }}"

- name: Allow HTTP from anywhere
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
  when: not (ufw_restrict_web_to_cloudflare | default(false))

- name: Allow HTTPS from anywhere
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
  when: not (ufw_restrict_web_to_cloudflare | default(false))

# When restricting to Cloudflare IPs, first remove any existing broad
# allow rules that would otherwise survive alongside the new narrower rules.
- name: Delete broad HTTP allow rule (Cloudflare-only mode)
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    delete: true
  when: ufw_restrict_web_to_cloudflare | default(false)
  failed_when: false

- name: Delete broad HTTPS allow rule (Cloudflare-only mode)
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
    delete: true
  when: ufw_restrict_web_to_cloudflare | default(false)
  failed_when: false

- name: Allow HTTP from Cloudflare IPs only
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ cloudflare_ipv4_ranges + cloudflare_ipv6_ranges }}"
  when: ufw_restrict_web_to_cloudflare | default(false)

- name: Allow HTTPS from Cloudflare IPs only
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ cloudflare_ipv4_ranges + cloudflare_ipv6_ranges }}"
  when: ufw_restrict_web_to_cloudflare | default(false)

- name: Allow Cloudflare Tunnel (TCP 7844)
  community.general.ufw:
    rule: allow
    port: "7844"
    proto: tcp
  when: cloudflare_tunnel_enabled | default(false)

- name: Allow Cloudflare Tunnel (UDP 7844)
  community.general.ufw:
    rule: allow
    port: "7844"
    proto: udp
  when: cloudflare_tunnel_enabled | default(false)

- name: Protect loopback from ipset blocklists
  ansible.builtin.lineinfile:
    path: /etc/ufw/before.rules
    insertbefore: "# allow all on loopback"
    line: "-A ufw-before-input -i lo -j ACCEPT"
    state: present
  notify: Reload UFW

- name: Ensure loopback accepted in iptables now
  ansible.builtin.iptables:
    chain: INPUT
    in_interface: lo
    jump: ACCEPT
    action: insert
    rule_num: 1

- name: Enable UFW
  community.general.ufw:
    state: enabled
    logging: "on"
