---
- name: Reset UFW to default
  ufw:
    state: reset
  when: ufw_reset | default(false)

- name: Set UFW default policies
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }

- name: Compute SSH allow networks
  set_fact:
    ssh_allow_networks_effective: "{{ allowed_ssh_networks | default([]) }}"

- name: Allow SSH from configured networks
  ufw:
    rule: allow
    port: '22'
    proto: tcp
    src: "{{ item }}"
  loop: "{{ ssh_allow_networks_effective }}"
  when: ssh_allow_networks_effective | length > 0

- name: Allow SSH from anywhere when no networks are configured
  ufw:
    rule: allow
    port: '22'
    proto: tcp
  when: ssh_allow_networks_effective | length == 0

- name: Allow HTTP
  ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow HTTPS
  ufw:
    rule: allow
    port: '443'
    proto: tcp

- name: Enable UFW
  ufw:
    state: enabled
    logging: 'on'
