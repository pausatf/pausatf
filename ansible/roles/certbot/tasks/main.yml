---
# Certbot role — Let's Encrypt via Cloudflare DNS-01 challenge

- name: Assert certbot_domains is defined and non-empty
  ansible.builtin.assert:
    that:
      - certbot_domains is defined
      - certbot_domains | length > 0
    fail_msg: "certbot_domains must be defined and contain at least one domain"
  when: certbot_enabled | default(true)

- name: Install certbot and Cloudflare DNS plugin
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-dns-cloudflare
    state: present

- name: Ensure letsencrypt directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Ensure certbot renewal-hooks directory exists
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Cloudflare credentials for certbot
  ansible.builtin.template:
    src: cloudflare.ini.j2
    dest: /etc/letsencrypt/cloudflare.ini
    owner: root
    group: root
    mode: "0600"

- name: Deploy post-renewal hook to reload web server
  ansible.builtin.template:
    src: deploy-hook.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-webserver.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy independent certificate synchronization service
  ansible.builtin.template:
    src: certbot-deploy.service.j2
    dest: /etc/systemd/system/pausatf-certbot-deploy.service
    owner: root
    group: root
    mode: "0644"
  when: certbot_deploy_target_dir is defined

- name: Deploy independent certificate synchronization timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/pausatf-certbot-deploy.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Retry synchronization of the current Certbot lineage
      [Timer]
      OnBootSec=5min
      OnCalendar=*:0/15
      Persistent=true
      [Install]
      WantedBy=timers.target
  when: certbot_deploy_target_dir is defined

- name: Enable independent certificate synchronization retries
  ansible.builtin.systemd:
    name: pausatf-certbot-deploy.timer
    daemon_reload: true
    enabled: true
    state: started
  when:
    - certbot_enabled | default(true)
    - certbot_deploy_target_dir is defined

- name: Check if certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ certbot_lineage_name | default(certbot_domains[0]) }}/fullchain.pem"
  register: certbot_cert_exists

- name: Obtain SSL certificate via DNS-01 challenge
  ansible.builtin.command: >
    certbot certonly
    --dns-cloudflare
    --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini
    --cert-name {{ certbot_lineage_name | default(certbot_domains[0]) | quote }}
    {{ certbot_domains | map('regex_replace', '^', '-d ') | join(' ') }}
    --non-interactive
    --agree-tos
    -m "{{ certbot_email }}"
    --keep-until-expiring
  register: certbot_result
  environment:
    CERTBOT_STAGE_ONLY: "{{ '1' if certbot_deploy_stage_only | default(false) else '0' }}"
  changed_when: "'Certificate not yet due for renewal' not in certbot_result.stdout"
  when: (certbot_enabled | default(true)) and not certbot_cert_exists.stat.exists

- name: Ensure certbot systemd timer is enabled
  ansible.builtin.systemd:
    name: certbot.timer
    state: started
    enabled: true
  when: certbot_enabled | default(true)

- name: Synchronize initial or existing certificate into the origin certificate directory
  ansible.builtin.command: /etc/letsencrypt/renewal-hooks/deploy/reload-webserver.sh
  environment:
    RENEWED_LINEAGE: "/etc/letsencrypt/live/{{ certbot_lineage_name | default(certbot_domains[0]) }}"
    CERTBOT_STAGE_ONLY: "{{ '1' if certbot_deploy_stage_only | default(false) else '0' }}"
  changed_when: false
  when:
    - certbot_enabled | default(true)
    - certbot_deploy_target_dir is defined
