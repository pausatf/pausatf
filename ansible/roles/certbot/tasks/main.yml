---
# Certbot role — Let's Encrypt via Cloudflare DNS-01 challenge

- name: Install certbot and Cloudflare DNS plugin
  apt:
    name:
      - certbot
      - python3-certbot-dns-cloudflare
    state: present

- name: Ensure letsencrypt directory exists
  file:
    path: /etc/letsencrypt
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy Cloudflare credentials for certbot
  template:
    src: cloudflare.ini.j2
    dest: /etc/letsencrypt/cloudflare.ini
    owner: root
    group: root
    mode: '0600'

- name: Check if certificate already exists
  stat:
    path: "/etc/letsencrypt/live/{{ certbot_domains[0] }}/fullchain.pem"
  register: certbot_cert_exists

- name: Obtain SSL certificate via DNS-01 challenge
  command: >
    certbot certonly
    --dns-cloudflare
    --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini
    {{ certbot_domains | map('regex_replace', '^', '-d ') | join(' ') }}
    --non-interactive
    --agree-tos
    -m "{{ certbot_email }}"
    --keep-until-expiring
  register: certbot_result
  changed_when: "'Certificate not yet due for renewal' not in certbot_result.stdout"
  when: (certbot_enabled | default(true)) and not certbot_cert_exists.stat.exists

- name: Ensure certbot systemd timer is enabled
  systemd:
    name: certbot.timer
    state: started
    enabled: yes
  when: certbot_enabled | default(true)

- name: Deploy post-renewal hook to reload web server
  copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-webserver.sh
    content: |
      #!/bin/bash
      systemctl reload {{ 'apache2' if web_server | default('apache') == 'apache' else 'lsws' }}
    owner: root
    group: root
    mode: '0755'
