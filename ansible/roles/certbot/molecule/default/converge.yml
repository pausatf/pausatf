- name: Converge
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    # certbot.timer requires systemd — skip issuance and timer tasks in Docker
    - name: Mask certbot systemd tasks that require a real init system
      set_fact:
        _molecule_docker: "{{ ansible_virtualization_type == 'docker' }}"

  roles:
    - role: certbot
