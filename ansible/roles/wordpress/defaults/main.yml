---
# WordPress default variables
wordpress_version: "latest"
wordpress_install_dir: "/var/www/html"
wordpress_db_name: "wordpress"
wordpress_db_user: "wpuser"
wordpress_db_host: "localhost"
wordpress_table_prefix: "wp_"
wordpress_memory_limit: "256M"
wordpress_max_memory_limit: "512M"

# WordPress site configuration
wordpress_site_url: "{{ inventory_hostname }}"
wordpress_admin_email: "admin@{{ inventory_hostname }}"

# PHP configuration
php_version: "8.3"
php_upload_max_filesize: "64M"
php_post_max_size: "64M"
php_max_execution_time: "300"
php_memory_limit: "256M"

# Nginx configuration
nginx_client_max_body_size: "100M"

# WordPress user management
# List of user IDs or logins to remove (e.g. breach-created accounts)
wp_users_remove: []
# Security: Must be provided via Ansible vault — empty defaults cause fast-fail assertion.
wordpress_db_password: "" # Must be provided via vault (vault_wp_main_db_password)
wordpress_auth_key: "" # Must be provided via vault
wordpress_secure_auth_key: "" # Must be provided via vault
wordpress_logged_in_key: "" # Must be provided via vault
wordpress_nonce_key: "" # Must be provided via vault
wordpress_auth_salt: "" # Must be provided via vault
wordpress_secure_auth_salt: "" # Must be provided via vault
wordpress_logged_in_salt: "" # Must be provided via vault
wordpress_nonce_salt: "" # Must be provided via vault
