---
# WordPress application management only (no webserver here)
# - uses WP-CLI to manage core, plugins, and themes
# - honors per-install settings in group_vars

- name: Create pausatf config directory
  ansible.builtin.file:
    path: /etc/pausatf
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: wp_cron

- name: Set active-web marker on production server
  ansible.builtin.copy:
    content: "{{ inventory_hostname }}\n"
    dest: /etc/pausatf/is-active-web
    owner: root
    group: root
    mode: "0644"
  when: is_active_web | default(false)
  tags: wp_cron

- name: Remove active-web marker on non-production servers
  ansible.builtin.file:
    path: /etc/pausatf/is-active-web
    state: absent
  when: not (is_active_web | default(false))
  tags: wp_cron

- name: Deploy wp-cron guard script
  ansible.builtin.copy:
    src: wp-cron-if-active.sh
    dest: /usr/local/sbin/wp-cron-if-active.sh
    owner: root
    group: root
    mode: "0750"
  tags: wp_cron

- name: Configure wp-cron via guard script (replaces direct wp-cron.php call)
  ansible.builtin.cron:
    name: "WordPress cron for {{ item.domain | default('www.pausatf.org') }}"
    minute: "*"
    job: "/usr/local/sbin/wp-cron-if-active.sh"
    user: root
  loop: "{{ wordpress_installs }}"
  tags: wp_cron

- name: Ensure mu-plugins directory exists
  ansible.builtin.file:
    path: "{{ item.path | default('/var/www/html') }}/wp-content/mu-plugins"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop: "{{ wordpress_installs }}"
  tags: mu_plugins

- name: Deploy security mu-plugins
  ansible.builtin.copy:
    src: "mu-plugins/{{ item.1 }}"
    dest: "{{ item.0.path | default('/var/www/html') }}/wp-content/mu-plugins/{{ item.1 }}"
    owner: www-data
    group: www-data
    mode: "0644"
  loop: "{{ wordpress_installs | product(['disable-user-enum.php', 'noindex-non-prod.php']) | list }}"
  tags: mu_plugins

- name: Deploy Cloudflare auto-purge mu-plugin
  ansible.builtin.copy:
    src: cf-auto-purge.php
    dest: "{{ item.path | default('/var/www/html') }}/wp-content/mu-plugins/cf-auto-purge.php"
    owner: www-data
    group: www-data
    mode: "0644"
  loop: "{{ wordpress_installs }}"
  tags: [wordpress, cloudflare]

- name: Remove Cloudflare plugin email (force Bearer token auth)
  ansible.builtin.command:
    cmd: wp option delete cloudflare_api_email --allow-root
    chdir: "{{ item.path | default('/var/www/html') }}"
  register: cf_email_delete
  changed_when: "'Deleted' in cf_email_delete.stdout"
  failed_when: false
  loop: "{{ wordpress_installs }}"
  tags: [wordpress, cloudflare]

- name: Set WP_ENVIRONMENT_TYPE for non-production
  ansible.builtin.lineinfile:
    path: "{{ item.path | default('/var/www/html') }}/wp-config.php"
    regexp: "WP_ENVIRONMENT_TYPE"
    line: "define( 'WP_ENVIRONMENT_TYPE', '{{ wp_environment_type | default('production') }}' );"
    insertbefore: "That's all, stop editing"
  loop: "{{ wordpress_installs }}"
  when: item.manage_wp_config | default(false)
  tags: mu_plugins

- name: Protect debug.log from web access
  ansible.builtin.blockinfile:
    path: "{{ item.path | default('/var/www/html') }}/.htaccess"
    marker: "# {mark} ANSIBLE MANAGED - debug.log protection"
    block: |
      <Files debug.log>
          Require all denied
      </Files>
    insertafter: "# END WordPress"
  loop: "{{ wordpress_installs }}"
  tags: security

- name: Install WordPress plugins from wp_main_plugins
  ansible.builtin.command:
    cmd: >
      wp plugin install {{ item.slug }}
      --version={{ item.version | default('latest') }}
      --path={{ (wordpress_installs[0].path | default('/var/www/html')) }}
      --allow-root
  register: _plugin_install
  changed_when: "'Installing' in _plugin_install.stdout or 'Updating' in _plugin_install.stdout"
  failed_when: _plugin_install.rc != 0 and 'already installed' not in _plugin_install.stderr
  loop: "{{ wp_main_plugins | default([]) | selectattr('slug', 'defined') | list }}"
  when:
    - wp_main_plugins is defined
    - item.status | default('active') != 'inactive'
  tags: wp_plugins

- name: Activate WordPress plugins
  ansible.builtin.command:
    cmd: >
      wp plugin activate {{ item.slug }}
      --path={{ (wordpress_installs[0].path | default('/var/www/html')) }}
      --allow-root
  register: _plugin_activate
  changed_when: "'Plugin' in _plugin_activate.stdout and 'activated' in _plugin_activate.stdout"
  failed_when: false
  loop: "{{ wp_main_plugins | default([]) | selectattr('slug', 'defined') | list }}"
  when:
    - wp_main_plugins is defined
    - item.status | default('active') == 'active'
  tags: wp_plugins

- name: Deactivate inactive plugins
  ansible.builtin.command:
    cmd: >
      wp plugin deactivate {{ item.slug }}
      --path={{ (wordpress_installs[0].path | default('/var/www/html')) }}
      --allow-root
  register: _plugin_deactivate
  changed_when: "'deactivated' in _plugin_deactivate.stdout"
  failed_when: false
  loop: "{{ wp_main_plugins | default([]) | selectattr('slug', 'defined') | list }}"
  when:
    - wp_main_plugins is defined
    - item.status | default('active') == 'inactive'
  tags: wp_plugins

- name: Remove default index.html that conflicts with WordPress
  ansible.builtin.file:
    path: "{{ item.path | default('/var/www/html') }}/index.html"
    state: absent
  loop: "{{ wordpress_installs }}"

- name: Assert WordPress credentials are configured
  ansible.builtin.assert:
    that:
      - wordpress_installs is defined
      - wordpress_installs | length > 0
      - not (wordpress_installs[0].manage_wp_config | default(false)) or (wordpress_installs[0].db_password |
        default('') | length > 0)
    fail_msg: "wordpress_installs[].db_password must be set when manage_wp_config=true"
  when: wordpress_enabled | default(true)

- name: Assert WordPress auth keys are wired through wordpress_installs
  ansible.builtin.assert:
    that:
      - wordpress_installs[0].auth_key | default('') | length > 0
      - wordpress_installs[0].secure_auth_key | default('') | length > 0
      - wordpress_installs[0].logged_in_key | default('') | length > 0
      - wordpress_installs[0].nonce_key | default('') | length > 0
    fail_msg: "wordpress_installs[].auth keys must be wired from vault variables"
  when:
    - wordpress_installs is defined
    - wordpress_installs | length > 0
    - wordpress_installs[0].manage_wp_config | default(false)

- name: Ensure WP-CLI is installed
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
    dest: /usr/local/bin/wp
    mode: "0755"
  when: wpcli_enabled | default(true)

- name: Iterate configured WordPress installs
  ansible.builtin.include_tasks: manage-install.yml
  loop: "{{ wordpress_installs | default([]) }}"
  loop_control:
    loop_var: wp_site

- name: Schedule WordPress cron via system cron
  ansible.builtin.cron:
    name: "WordPress cron for {{ item.domain }}"
    job: "wget -q -O - https://{{ item.domain }}/wp-cron.php?doing_wp_cron > /dev/null 2>&1"
    user: root
  loop: "{{ wordpress_installs | default([]) }}"
  when: item.wp_cron_system | default(true)

- name: Deploy WP cron health check script
  ansible.builtin.template:
    src: check-wp-cron-health.sh.j2
    dest: /usr/local/sbin/check-wp-cron-health.sh
    owner: root
    group: root
    mode: "0750"
  tags: wp_cron

- name: Create WP cron health check log file
  ansible.builtin.file:
    path: /var/log/wp-cron-health.log
    state: touch
    owner: root
    group: root
    mode: "0644"
  changed_when: false
  tags: wp_cron

- name: Schedule WP cron health check every 30 minutes
  ansible.builtin.cron:
    name: "WP cron health check"
    minute: "*/30"
    job: "/usr/local/sbin/check-wp-cron-health.sh"
    user: root
  tags: wp_cron

- name: Configure Jetpack performance features
  ansible.builtin.include_tasks: jetpack.yml
  tags: [wordpress, jetpack]

- name: Apply and verify PHP compatibility patches
  ansible.builtin.include_tasks: patches.yml
  tags: wp_patches

- name: Ensure legacy data year directory exists for current year
  ansible.builtin.file:
    path: "/var/www/legacy/public_html/data/{{ ansible_date_time.year }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Find existing legacy data year directories
  ansible.builtin.find:
    paths: /var/www/legacy/public_html/data
    file_type: directory
    patterns: "20[0-9][0-9]"
  register: legacy_year_dirs

- name: Deploy legacy data directory .htaccess
  ansible.builtin.template:
    src: legacy-data-htaccess.j2
    dest: "{{ item.path }}/.htaccess"
    owner: www-data
    group: www-data
    mode: "0644"
  loop: "{{ legacy_year_dirs.files }}"
  loop_control:
    label: "{{ item.path }}"
