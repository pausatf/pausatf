# Per-site management via WP-CLI
# expects loop var wp_site

- name: Ensure WordPress path exists
  file:
    path: "{{ wp_site.path }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Deploy WordPress .htaccess
  # This task is authoritative: Ansible manages .htaccess for all WordPress sites.
  # Manual changes will be overwritten on the next playbook run.
  template:
    src: htaccess.j2
    dest: "{{ wp_site.path }}/.htaccess"
    owner: www-data
    group: www-data
    mode: '0644'
    force: true

- name: Check if WordPress is already installed
  command: "{{ wpcli_path | default('/usr/local/bin/wp') }} core is-installed --path={{ wp_site.path }} --allow-root"
  register: wp_installed
  changed_when: false
  failed_when: false

- name: Download WordPress core (if not installed)
  command: "{{ wpcli_path | default('/usr/local/bin/wp') }} core download --path={{ wp_site.path }} --version={{ wp_site.wp_version | default('latest') }} --skip-content --allow-root"
  when: wp_installed.rc != 0
  failed_when: false

- name: Verify WordPress checksums
  command: "{{ wpcli_path | default('/usr/local/bin/wp') }} core verify-checksums --path={{ wp_site.path }} --allow-root"
  register: wp_checksums
  changed_when: false
  failed_when: false

- name: Update core to requested version (if installed)
  command: "{{ wpcli_path | default('/usr/local/bin/wp') }} core update {{ (wp_site.wp_version is defined and wp_site.wp_version != 'latest') | ternary('--version=' + wp_site.wp_version, '') }} --path={{ wp_site.path }} --allow-root"  # yamllint disable-line rule:line-length
  when: wp_installed.rc == 0
  register: wp_core_update
  changed_when: "'Updating' in wp_core_update.stdout or 'Success' in wp_core_update.stdout"

- name: Update database (safe to run if already current)
  command: "{{ wpcli_path | default('/usr/local/bin/wp') }} core update-db --path={{ wp_site.path }} --allow-root"
  when: wp_installed.rc == 0
  register: wp_db_update
  changed_when: "'Success' in wp_db_update.stdout"

- name: Configure basic salts and disallow file edit (if using wp-config template)
  template:
    src: wp-config.php.j2
    dest: "{{ wp_site.path }}/wp-config.php"
    owner: www-data
    group: www-data
    mode: '0640'
  when: wp_site.manage_wp_config | default(false)

- name: Update all plugins except excluded
  command: "{{ wpcli_path | default('/usr/local/bin/wp') }} plugin update --all --path={{ wp_site.path }} --allow-root --quiet"
  when: wpcli_update_plugins | default(true)
  register: plugin_update_result
  # wp-cli exits non-zero when no updates are available; treat that as success.
  failed_when: false
  changed_when: plugin_update_result.rc == 0 and 'updated' in (plugin_update_result.stdout | lower)

- name: Update all themes except excluded
  command: "{{ wpcli_path | default('/usr/local/bin/wp') }} theme update --all --path={{ wp_site.path }} --allow-root --quiet"
  when: wpcli_update_themes | default(true)
  register: theme_update_result
  # wp-cli exits non-zero when no updates are available; treat that as success.
  failed_when: false
  changed_when: theme_update_result.rc == 0 and 'updated' in (theme_update_result.stdout | lower)

- name: Check if LiteSpeed Cache plugin is installed
  command: "{{ wpcli_path | default('/usr/local/bin/wp') }} plugin is-installed litespeed-cache --path={{ wp_site.path }} --allow-root"
  register: lscache_installed
  changed_when: false
  failed_when: false
  when: web_server | default('apache') == 'openlitespeed'

- name: Install and activate LiteSpeed Cache plugin (stage/dev)
  command: "{{ wpcli_path | default('/usr/local/bin/wp') }} plugin install litespeed-cache --activate --path={{ wp_site.path }} --allow-root"
  when:
    - web_server | default('apache') == 'openlitespeed'
    - lscache_installed.rc != 0

- name: Check if redis-cache plugin is installed
  command: "{{ wpcli_path | default('/usr/local/bin/wp') }} plugin is-installed redis-cache --path={{ wp_site.path }} --allow-root"
  register: redis_cache_installed
  changed_when: false
  failed_when: false
  when: redis_enabled | default(false)

- name: Install redis-cache plugin
  command: "{{ wpcli_path | default('/usr/local/bin/wp') }} plugin install redis-cache --path={{ wp_site.path }} --allow-root"
  when:
    - redis_enabled | default(false)
    - redis_cache_installed.rc != 0

- name: Activate redis-cache plugin
  command: "{{ wpcli_path | default('/usr/local/bin/wp') }} plugin activate redis-cache --path={{ wp_site.path }} --allow-root"
  register: redis_cache_activate
  changed_when: "'activated' in redis_cache_activate.stdout | lower"
  failed_when: false
  when: redis_enabled | default(false)

- name: Enable Redis object cache drop-in
  command: "{{ wpcli_path | default('/usr/local/bin/wp') }} redis enable --path={{ wp_site.path }} --allow-root"
  register: redis_enable_result
  changed_when: "'enabled' in redis_enable_result.stdout | lower"
  failed_when: false
  when: redis_enabled | default(false)

- name: Set WordPress file and directory permissions
  file:
    path: "{{ wp_site.path }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
    recurse: yes
  changed_when: false

- name: Ensure uploads directory exists
  file:
    path: "{{ wp_site.path }}/wp-content/uploads"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Block PHP execution in uploads directory
  copy:
    dest: "{{ wp_site.path }}/wp-content/uploads/.htaccess"
    owner: www-data
    group: www-data
    mode: '0644'
    content: |
      # Block PHP execution in uploads — managed by Ansible
      <FilesMatch "\.php$">
          Require all denied
      </FilesMatch>

- name: Deploy TheSource parent theme
  copy:
    src: TheSource/
    dest: "{{ wp_site.path }}/wp-content/themes/TheSource/"
    owner: www-data
    group: www-data
    mode: '0644'
    directory_mode: '0755'
  when: wp_site.active_theme | default('') == 'TheSource-child'

- name: Deploy TheSource child theme
  copy:
    src: TheSource-child/
    dest: "{{ wp_site.path }}/wp-content/themes/TheSource-child/"
    owner: www-data
    group: www-data
    mode: '0644'
    directory_mode: '0755'
  when: wp_site.active_theme | default('') == 'TheSource-child'

- name: Enforce WordPress user security (remove unauthorized accounts, audit admins)
  include_tasks: user-security.yml
  when: wp_installed.rc == 0
