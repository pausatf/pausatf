---
# Per-site management via WP-CLI
# expects loop var wp_site

- name: Ensure WordPress path exists
  ansible.builtin.file:
    path: "{{ wp_site.path }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Deploy WordPress .htaccess
  # This task is authoritative: Ansible manages .htaccess for all WordPress sites.
  # Manual changes will be overwritten on the next playbook run.
  ansible.builtin.template:
    src: htaccess.j2
    dest: "{{ wp_site.path }}/.htaccess"
    owner: www-data
    group: www-data
    mode: "0644"
    force: true

- name: Check if WordPress is already installed
  ansible.builtin.command: "{{ wpcli_path | default('/usr/local/bin/wp') }} core is-installed --path={{ wp_site.path }} --allow-root"
  register: wp_installed
  changed_when: false
  failed_when: false

- name: Download WordPress core (if not installed)
  ansible.builtin.command: "{{ wpcli_path | default('/usr/local/bin/wp') }} core download --path={{ wp_site.path }} --version={{
    wp_site.wp_version | default('latest') }} --skip-content --allow-root"
  register: wp_download
  when: wp_installed.rc != 0
  failed_when: wp_download.rc != 0 and 'already' not in (wp_download.stderr | default(''))

- name: Verify WordPress checksums
  ansible.builtin.command: "{{ wpcli_path | default('/usr/local/bin/wp') }} core verify-checksums --path={{ wp_site.path }}
    --allow-root"
  register: wp_checksums
  changed_when: false
  failed_when: false

- name: Update core to requested version (if installed)
  ansible.builtin.command: "{{ wpcli_path | default('/usr/local/bin/wp') }} core update {{ (wp_site.wp_version is defined
    and wp_site.wp_version != 'latest') | ternary('--version=' + wp_site.wp_version, '') }} --path={{ wp_site.path }} --allow-root"
  when: wp_installed.rc == 0
  register: wp_core_update
  changed_when: "'Updating' in wp_core_update.stdout or 'Success' in wp_core_update.stdout"

- name: Update database (safe to run if already current)
  ansible.builtin.command: "{{ wpcli_path | default('/usr/local/bin/wp') }} core update-db --path={{ wp_site.path }} --allow-root"
  when: wp_installed.rc == 0
  register: wp_db_update
  changed_when: "'Success' in wp_db_update.stdout"

- name: Configure basic salts and disallow file edit (if using wp-config template)
  ansible.builtin.template:
    src: wp-config.php.j2
    dest: "{{ wp_site.path }}/wp-config.php"
    owner: www-data
    group: www-data
    mode: "0640"
  when: wp_site.manage_wp_config | default(false)

- name: Check pending plugin updates
  ansible.builtin.command: "{{ wpcli_path | default('/usr/local/bin/wp') }} plugin list --update=available --format=count
    --path={{ wp_site.path }} --allow-root"
  register: plugin_updates
  changed_when: false
  failed_when: false
  when: wpcli_update_plugins | default(true)

- name: Update all plugins except excluded
  ansible.builtin.command: "{{ wpcli_path | default('/usr/local/bin/wp') }} plugin update --all --path={{ wp_site.path }}
    --allow-root --quiet"
  when:
    - wpcli_update_plugins | default(true)
    - plugin_updates.stdout | default('0') | int > 0
  register: plugin_update_result
  # wp-cli exits non-zero when no updates are available; treat that as success.
  failed_when: false
  changed_when: plugin_update_result.rc == 0 and 'updated' in (plugin_update_result.stdout | lower)

- name: Update all themes except excluded
  ansible.builtin.command: "{{ wpcli_path | default('/usr/local/bin/wp') }} theme update --all --path={{ wp_site.path }} --allow-root
    --quiet"
  when: wpcli_update_themes | default(true)
  register: theme_update_result
  # wp-cli exits non-zero when no updates are available; treat that as success.
  failed_when: false
  changed_when: theme_update_result.rc == 0 and 'updated' in (theme_update_result.stdout | lower)

- name: Check if LiteSpeed Cache plugin is installed
  ansible.builtin.command: "{{ wpcli_path | default('/usr/local/bin/wp') }} plugin is-installed litespeed-cache --path={{
    wp_site.path }} --allow-root"
  register: lscache_installed
  changed_when: false
  failed_when: false
  when: web_server | default('apache') == 'openlitespeed'

- name: Install and activate LiteSpeed Cache plugin (stage/dev)
  ansible.builtin.command: "{{ wpcli_path | default('/usr/local/bin/wp') }} plugin install litespeed-cache --activate --path={{
    wp_site.path }} --allow-root"
  when:
    - web_server | default('apache') == 'openlitespeed'
    - lscache_installed is defined and lscache_installed.rc != 0

- name: Check if redis-cache plugin is installed
  ansible.builtin.command: "{{ wpcli_path | default('/usr/local/bin/wp') }} plugin is-installed redis-cache --path={{ wp_site.path
    }} --allow-root"
  register: redis_cache_installed
  changed_when: false
  failed_when: false
  when:
    - redis_enabled | default(false)
    - wp_installed.rc == 0

- name: Install redis-cache plugin
  ansible.builtin.command: "{{ wpcli_path | default('/usr/local/bin/wp') }} plugin install redis-cache --path={{ wp_site.path
    }} --allow-root"
  when:
    - redis_enabled | default(false)
    - wp_installed.rc == 0
    - redis_cache_installed is defined and redis_cache_installed.rc != 0

- name: Activate redis-cache plugin
  ansible.builtin.command: "{{ wpcli_path | default('/usr/local/bin/wp') }} plugin activate redis-cache --path={{ wp_site.path
    }} --allow-root"
  register: redis_cache_activate
  changed_when: "'activated' in redis_cache_activate.stdout | lower"
  failed_when: false
  when:
    - redis_enabled | default(false)
    - wp_installed.rc == 0

- name: Enable Redis object cache drop-in
  ansible.builtin.command: "{{ wpcli_path | default('/usr/local/bin/wp') }} redis enable --path={{ wp_site.path }} --allow-root"
  register: redis_enable_result
  changed_when: "'enabled' in redis_enable_result.stdout | lower"
  failed_when: false
  when: redis_enabled | default(false)

- name: Set WordPress directory ownership
  ansible.builtin.file:
    path: "{{ wp_site.path }}"
    state: directory
    owner: www-data
    group: www-data
    recurse: true
  changed_when: false

- name: Set WordPress directory permissions
  ansible.builtin.command: find {{ wp_site.path }} -type d -not -perm 0755 -exec chmod 755 {} +
  register: dir_perms
  changed_when: dir_perms.rc == 0 and dir_perms.stdout != ''

- name: Set WordPress file permissions
  ansible.builtin.command: find {{ wp_site.path }} -type f -not -perm 0644 -exec chmod 644 {} +
  register: file_perms
  changed_when: file_perms.rc == 0 and file_perms.stdout != ''

- name: Ensure uploads directory exists
  ansible.builtin.file:
    path: "{{ wp_site.path }}/wp-content/uploads"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Block PHP execution in uploads directory
  ansible.builtin.copy:
    dest: "{{ wp_site.path }}/wp-content/uploads/.htaccess"
    owner: www-data
    group: www-data
    mode: "0644"
    content: |
      # Block PHP execution in uploads — managed by Ansible
      <FilesMatch "\.php$">
          Require all denied
      </FilesMatch>

- name: Deploy TheSource parent theme
  ansible.builtin.copy:
    src: TheSource/
    dest: "{{ wp_site.path }}/wp-content/themes/TheSource/"
    owner: www-data
    group: www-data
    mode: "0644"
    directory_mode: "0755"
  when: wp_site.active_theme | default('') == 'TheSource-child'

- name: Deploy TheSource child theme
  ansible.builtin.copy:
    src: TheSource-child/
    dest: "{{ wp_site.path }}/wp-content/themes/TheSource-child/"
    owner: www-data
    group: www-data
    mode: "0644"
    directory_mode: "0755"
  when: wp_site.active_theme | default('') == 'TheSource-child'

- name: Install GeneratePress parent theme via WP-CLI
  ansible.builtin.command: >
    {{ wpcli_path | default('/usr/local/bin/wp') }}
    theme install generatepress
    --path={{ wp_site.path }}
    --allow-root
  register: gp_install
  changed_when: "'installed successfully' in gp_install.stdout | lower"
  failed_when: gp_install.rc != 0 and 'already installed' not in (gp_install.stderr | default(''))
  when:
    - wp_installed.rc == 0
    - wp_site.active_theme | default('') == 'pausatf-generatepress-child'

- name: Deploy GeneratePress child theme
  ansible.builtin.copy:
    src: pausatf-generatepress-child/
    dest: "{{ wp_site.path }}/wp-content/themes/pausatf-generatepress-child/"
    owner: www-data
    group: www-data
    mode: "0644"
    directory_mode: "0755"
  when: wp_site.active_theme | default('') == 'pausatf-generatepress-child'

- name: Activate GeneratePress child theme
  ansible.builtin.command: >
    {{ wpcli_path | default('/usr/local/bin/wp') }}
    theme activate pausatf-generatepress-child
    --path={{ wp_site.path }}
    --allow-root
  register: gp_activate
  changed_when: "'Success' in gp_activate.stdout"
  when:
    - wp_installed.rc == 0
    - wp_site.active_theme | default('') == 'pausatf-generatepress-child'

- name: Ensure fallback theme is installed
  ansible.builtin.command: "{{ wpcli_path | default('/usr/local/bin/wp') }} theme install twentytwentyfive --path={{ wp_site.path
    }} --allow-root"
  register: fallback_theme
  changed_when: "'installed successfully' in fallback_theme.stdout | lower"
  failed_when: fallback_theme.rc != 0 and 'already installed' not in (fallback_theme.stderr | default(''))
  when: wp_installed.rc == 0

- name: Check if any theme is active
  ansible.builtin.command: "{{ wpcli_path | default('/usr/local/bin/wp') }} theme list --status=active --field=name --path={{
    wp_site.path }} --allow-root"
  register: active_theme_check
  changed_when: false
  failed_when: false
  when: wp_installed.rc == 0

- name: Activate fallback theme if none active
  ansible.builtin.command: "{{ wpcli_path | default('/usr/local/bin/wp') }} theme activate twentytwentyfive --path={{ wp_site.path
    }} --allow-root"
  when:
    - wp_installed.rc == 0
    - active_theme_check.stdout | default('') | trim == ''

- name: Enforce WordPress user security (remove unauthorized accounts, audit admins)
  ansible.builtin.include_tasks: user-security.yml
  when: wp_installed.rc == 0
