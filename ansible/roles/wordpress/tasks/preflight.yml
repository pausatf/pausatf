---
- name: Assert required WordPress variables are defined
  ansible.builtin.assert:
    that:
      - wp_site is defined
      - wp_site.path is defined
      - wp_site.path | length > 0
      - wp_site.path is match('^/([a-zA-Z0-9_\-/]+)$')
    fail_msg: "wp_site and wp_site.path must be defined"
    quiet: true

- name: Assert database credentials are available
  ansible.builtin.assert:
    that:
      - wordpress_db_password | default('') | length > 0
    fail_msg: "wordpress_db_password must be set (use Ansible vault)"
    quiet: true
  when: wp_site.manage_wp_config | default(false)
