---
# WordPress user security enforcement
# - Removes accounts listed in wp_users_remove (breach-created / unauthorized)
# - Audits administrator accounts against the wp_users authoritative list

- name: Remove unauthorized WordPress users
  command: >
    {{ wpcli_path | default('/usr/local/bin/wp') }} user delete {{ item.id }}
    --reassign=1 --yes --path={{ wp_site.path }} --allow-root
  loop: "{{ wp_users_remove | default([]) }}"
  loop_control:
    label: "{{ item.username }} (ID {{ item.id }})"
  register: wp_user_delete
  changed_when: "'Deleted user' in wp_user_delete.stdout or wp_user_delete.rc == 0"
  failed_when: false

- name: Get current WordPress administrator list
  command: >
    {{ wpcli_path | default('/usr/local/bin/wp') }} user list
    --role=administrator --field=user_login --path={{ wp_site.path }} --allow-root
  register: wp_current_admins
  changed_when: false
  failed_when: false

- name: Build authorized administrator logins
  set_fact:
    wp_authorized_admins: >-
      {{ wp_users | default([]) | selectattr('roles', 'search', 'administrator') | map(attribute='username') | list }}

- name: Identify unauthorized administrator accounts
  set_fact:
    wp_unauthorized_admins: >-
      {{ wp_current_admins.stdout_lines | default([]) | difference(wp_authorized_admins) }}
  when: wp_current_admins.rc == 0

- name: Fail if unexpected administrator accounts exist
  fail:
    msg: >
      Unauthorized administrator account(s) detected: {{ wp_unauthorized_admins | join(', ') }}.
      Investigate immediately and add to wp_users_remove if confirmed illegitimate.
  when:
    - wp_current_admins.rc == 0
    - wp_unauthorized_admins | default([]) | length > 0
