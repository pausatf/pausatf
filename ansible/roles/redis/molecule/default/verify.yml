---
- name: Verify redis
  hosts: all
  become: true
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert redis-server is running
      ansible.builtin.assert:
        that:
          - "'redis-server.service' in ansible_facts.services"
          - "ansible_facts.services['redis-server.service'].state == 'running'"
        fail_msg: "redis-server is not running"

    - name: Assert redis is listening on port 6379
      ansible.builtin.wait_for:
        port: 6379
        timeout: 5
