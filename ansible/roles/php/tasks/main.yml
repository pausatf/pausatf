---
# PHP role - PHP configuration for PAUSATF WordPress

- name: Add Ondrej PHP repository
  apt_repository:
    repo: "ppa:ondrej/php"
    state: present
    update_cache: yes

- name: Install PHP {{ php_version }} packages
  apt:
    name: "{{ _php_packages }}"
    state: present
  notify: Restart Apache
  vars:
    _php_module_packages: "{{ php_modules | map('regex_replace', '^(redis)$', 'php-redis') | map('regex_replace', '^(?!php-redis$)(.*)$', 'php' + (php_version | string) + '-\\1') | list }}"
    _php_extra_packages: "{{ ['libapache2-mod-php' + (php_version | string)] }}"
    _php_legacy_packages: "{{ ['php' + (php_version | string) + '-json'] if php_version is version('8.0', '<') else [] }}"
    _php_packages: "{{ _php_module_packages + _php_extra_packages + _php_legacy_packages }}"

- name: Deploy PHP {{ php_version }} configuration
  template:
    src: php.ini.j2
    dest: "/etc/php/{{ php_version }}/apache2/php.ini"
    owner: root
    group: root
    mode: '0644'
    backup: yes
  notify: Restart Apache

- name: Deploy CLI PHP configuration
  template:
    src: php-cli.ini.j2
    dest: "/etc/php/{{ php_version }}/cli/php.ini"
    owner: root
    group: root
    mode: '0644'

- name: Deploy PHP security hardening
  template:
    src: security.ini.j2
    dest: "/etc/php/{{ php_version }}/apache2/conf.d/99-security.ini"
    owner: root
    group: root
    mode: '0644'
  notify: Restart Apache

- name: Deploy PHP apache2 security hardening baseline ini
  copy:
    dest: "/etc/php/{{ php_version }}/apache2/conf.d/99-security-hardening.ini"
    owner: root
    group: root
    mode: '0644'
    content: |
      ; Security hardening baseline (web/apache2 context)
      ; Managed by Ansible - Do not edit manually
      expose_php = Off
      session.cookie_secure = On
      session.cookie_httponly = On
      session.use_strict_mode = On
      session.cookie_samesite = Lax
      allow_url_include = Off
      disable_functions = exec,passthru,shell_exec,system,proc_open,popen
  notify: Restart Apache

- name: Deploy PHP CLI security hardening baseline ini (no disable_functions)
  copy:
    dest: "/etc/php/{{ php_version }}/cli/conf.d/99-security-hardening.ini"
    owner: root
    group: root
    mode: '0644'
    content: |
      ; Security hardening baseline (CLI context)
      ; Managed by Ansible - Do not edit manually
      ; disable_functions intentionally omitted: CLI runs as root via SSH and
      ; wp-cli requires proc_open/popen/exec. Web restrictions live in
      ; /etc/php/{{ php_version }}/apache2/conf.d/99-security-hardening.ini
      expose_php = Off
      allow_url_include = Off

- name: Deploy OPcache configuration
  template:
    src: opcache.ini.j2
    dest: "/etc/php/{{ php_version }}/mods-available/opcache.ini"
    owner: root
    group: root
    mode: '0644'
  notify: Restart Apache

- name: Check if OPcache is enabled
  stat:
    path: "/etc/php/{{ php_version }}/apache2/conf.d/10-opcache.ini"
  register: opcache_enabled
  changed_when: false

- name: Enable OPcache module
  command: "phpenmod -v {{ php_version }} opcache"
  when: not opcache_enabled.stat.exists
  changed_when: true

- name: Set default PHP CLI version
  alternatives:
    name: php
    path: "/usr/bin/php{{ php_version }}"
  ignore_errors: yes

- name: Create PHP session directory
  file:
    path: /var/lib/php/sessions
    state: directory
    owner: www-data
    group: www-data
    mode: '0770'
