# PAUSATF plugin role — deploy and activate pausatf-results-manager
# Clones from GitHub, sets ownership, activates via WP-CLI

- name: Install git
  ansible.builtin.apt:
    name: git
    state: present
  tags:
    - pausatf_plugin

- name: Check if plugin directory exists
  ansible.builtin.stat:
    path: "{{ pausatf_plugin_path }}/.git"
  register: _plugin_git_dir
  tags:
    - pausatf_plugin

- name: Clone pausatf-results-manager plugin
  ansible.builtin.git:
    repo: "{{ pausatf_plugin_repo }}"
    dest: "{{ pausatf_plugin_path }}"
    version: "{{ pausatf_plugin_version }}"
    force: false
  when: not _plugin_git_dir.stat.exists
  notify: Clear WordPress object cache
  tags:
    - pausatf_plugin

- name: Update pausatf-results-manager plugin to target version
  ansible.builtin.git:
    repo: "{{ pausatf_plugin_repo }}"
    dest: "{{ pausatf_plugin_path }}"
    version: "{{ pausatf_plugin_version }}"
    update: true
  when: _plugin_git_dir.stat.exists
  register: _plugin_update
  notify: Clear WordPress object cache
  tags:
    - pausatf_plugin

- name: Set plugin directory ownership
  ansible.builtin.file:
    path: "{{ pausatf_plugin_path }}"
    owner: "{{ pausatf_plugin_owner }}"
    group: "{{ pausatf_plugin_group }}"
    recurse: true
    state: directory
  tags:
    - pausatf_plugin

- name: Check if plugin is active
  ansible.builtin.command: >-
    wp plugin is-active pausatf-results-manager
    --path={{ pausatf_wp_docroot }}
    --allow-root
  register: _plugin_active
  changed_when: false
  failed_when: false
  tags:
    - pausatf_plugin

- name: Activate pausatf-results-manager plugin
  ansible.builtin.command: >-
    wp plugin activate pausatf-results-manager
    --path={{ pausatf_wp_docroot }}
    --allow-root
  register: _plugin_activate
  changed_when: "'activated' in _plugin_activate.stdout"
  when: _plugin_active.rc != 0
  tags:
    - pausatf_plugin
