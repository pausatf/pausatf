---
# Install and configure OpenLiteSpeed for WordPress

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download LiteSpeed repository key
  get_url:
    url: https://repo.litespeed.sh/ls.key
    dest: /etc/apt/keyrings/litespeed.gpg
    mode: "0644"

- name: Add LiteSpeed repository
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/litespeed.gpg] http://rpms.litespeedtech.com/debian/ stable main"
    state: present
    filename: litespeed

- name: Update apt cache
  apt:
    update_cache: true

- name: Install OpenLiteSpeed
  apt:
    name: openlitespeed
    state: present

- name: Ensure lsws service enabled and started
  systemd:
    name: lshttpd
    state: started
    enabled: true

- name: Set OLS admin password (idempotent)
  shell: |
    /usr/local/lsws/admin/misc/admpass.sh << EOF
    admin
    {{ ols_admin_password }}
    {{ ols_admin_password }}
    EOF
  args:
    creates: /usr/local/lsws/admin/conf/htpasswd
  no_log: true

- name: Create vhost directory
  file:
    path: /usr/local/lsws/conf/vhosts/wordpress
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy OLS main config
  template:
    src: httpd_config.conf.j2
    dest: /usr/local/lsws/conf/httpd_config.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart ols

- name: Deploy OLS vhost config
  template:
    src: vhconf.conf.j2
    dest: /usr/local/lsws/conf/vhosts/wordpress/vhconf.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart ols

- name: Ensure document root exists
  file:
    path: "{{ wordpress_installs[0].path | default('/var/www/html') }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"

- name: Open firewall for HTTP/HTTPS (if UFW enabled)
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  with_items:
    - "80"
    - "443"
  when: ufw_enabled | default(false)
