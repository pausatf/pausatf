name: PAUSATF CodeQL Configuration

paths-ignore:
  - content/**
  # Vendored parent theme code (do not modify directly; child theme is customized instead).
  - themes/thesource/**
  # Deployed mirror of the vendored parent theme used by Ansible.
  - ansible/roles/wordpress/files/TheSource/**
  # Repo visibility policy is managed outside CodeQL; this IaC rule is not actionable here.
  - modules/github/repository/**
