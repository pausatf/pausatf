version: 2
updates:
  # JavaScript assets are vendored/static in this repo and currently have no npm/yarn/pnpm manifests.
  # Add an npm ecosystem block when a package manager manifest is introduced.
  # GitHub Actions: workflows, plus the composite actions under
  # .github/actions, which "/" alone does not scan.
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
      actions:
        patterns:
          - "actions/*"
          - "hashicorp/*"

  # Terraform: roots, modules and stacks. /terraform itself holds no .tf files.
  - package-ecosystem: "terraform"
    cooldown:
      default-days: 7
    directories:
      - "/terraform/environments/*"
      - "/terraform/modules/**"
      - "/terraform/stacks/*"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "terraform"
    groups:
      terraform:
        patterns:
          - "*"

  # Python (docs build)
  - package-ecosystem: "pip"
    cooldown:
      default-days: 7
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "python"
    groups:
      pip:
        update-types:
          - "minor"
          - "patch"

  # PHP (membership plugin)
  - package-ecosystem: "composer"
    cooldown:
      default-days: 7
    directory: "/wordpress/plugins/pausatf-membership"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "php"
    groups:
      composer:
        update-types:
          - "minor"
          - "patch"

  # Docker Compose (compose stack)
  - package-ecosystem: "docker-compose"
    cooldown:
      default-days: 7
    directory: "/scripts/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        update-types:
          - "minor"
          - "patch"

  # Docker (nginx image)
  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/scripts/docker/nginx"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        update-types:
          - "minor"
          - "patch"

  # Docker (wordpress image)
  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/scripts/docker/wordpress"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        update-types:
          - "minor"
          - "patch"
