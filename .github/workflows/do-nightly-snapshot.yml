name: Nightly DO Snapshot (prod)

on:
  schedule:
    - cron: '0 10 * * *'  # 2 AM Pacific approx
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # No environment gate — uses DO_TOKEN and DO_PROD_DROPLET_ID repo secrets.
    # If those secrets are missing, doctl will fail with "token required".
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v4

      - name: Check required secrets
        id: check
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
          DROPLET_ID: ${{ secrets.DO_PROD_DROPLET_ID }}
        run: |
          set -euo pipefail
          if [ -z "$DO_TOKEN" ] || [ -z "$DROPLET_ID" ]; then
            echo "::warning::DO_TOKEN or DO_PROD_DROPLET_ID secret not configured. Skipping snapshot."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install doctl
        if: steps.check.outputs.skip != 'true'
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f  # v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Snapshot prod droplet
        id: snapshot
        if: steps.check.outputs.skip != 'true'
        env:
          DROPLET_ID: ${{ secrets.DO_PROD_DROPLET_ID }}
        run: |
          set -euo pipefail
          snapshot_name="prod-nightly-$(date -u +%Y%m%d-%H%M%S)"
          doctl compute droplet-action snapshot "$DROPLET_ID" \
            --snapshot-name "$snapshot_name" --wait
          echo "name=$snapshot_name" >> "$GITHUB_OUTPUT"

      - name: Prune old snapshots (keep last 7)
        if: steps.check.outputs.skip != 'true'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
          DROPLET_ID: ${{ secrets.DO_PROD_DROPLET_ID }}
          SNAPSHOT_NAME: ${{ steps.snapshot.outputs.name }}
        run: |
          set -euo pipefail
          doctl compute snapshot list --resource droplet --output json > snapshots.json
          python3 scripts/snapshot-retention.py --droplet-id "$DROPLET_ID" \
            --completed-name "$SNAPSHOT_NAME" < snapshots.json > prune.txt
          while IFS= read -r snap_id; do
            [ -n "$snap_id" ] || continue
            doctl compute snapshot delete "$snap_id" --force
          done < prune.txt
