name: Nightly DO Snapshot (prod)

on:
  schedule:
    - cron: '0 10 * * *'  # 2 AM Pacific approx
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # No environment gate; DO_TOKEN is required and the droplet ID is verified or resolved by name.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check required token
        id: check
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DO_TOKEN" ]; then
            echo "::warning::DO_TOKEN secret not configured. Skipping snapshot."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install doctl
        if: steps.check.outputs.skip != 'true'
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f  # v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Resolve prod droplet
        id: droplet
        if: steps.check.outputs.skip != 'true'
        env:
          DROPLET_ID: ${{ secrets.DO_PROD_DROPLET_ID }}
          DROPLET_NAME: pausatf-prod
        run: |
          set -euo pipefail
          if [ -n "$DROPLET_ID" ]; then
            resolved_name="$(doctl compute droplet get "$DROPLET_ID" --format Name --no-header 2>/dev/null || true)"
            if [ "$resolved_name" = "$DROPLET_NAME" ]; then
              echo "id=$DROPLET_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::DO_PROD_DROPLET_ID does not resolve to $DROPLET_NAME; looking up by name."
          fi
          resolved_id="$(doctl compute droplet list --format ID,Name --no-header | awk -v name="$DROPLET_NAME" '$2 == name { print $1; exit }')"
          if [ -z "$resolved_id" ]; then
            echo "::warning::Could not resolve $DROPLET_NAME. Skipping snapshot."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "id=$resolved_id" >> "$GITHUB_OUTPUT"

      - name: Snapshot prod droplet
        id: snapshot
        if: steps.check.outputs.skip != 'true' && steps.droplet.outputs.skip != 'true'
        env:
          DROPLET_ID: ${{ steps.droplet.outputs.id }}
        run: |
          set -euo pipefail
          snapshot_name="prod-nightly-$(date -u +%Y%m%d-%H%M%S)"
          doctl compute droplet-action snapshot "$DROPLET_ID" --snapshot-name "$snapshot_name" --wait
          echo "name=$snapshot_name" >> "$GITHUB_OUTPUT"

      - name: Prune old snapshots (keep last 7)
        if: steps.check.outputs.skip != 'true' && steps.droplet.outputs.skip != 'true'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
          DROPLET_ID: ${{ steps.droplet.outputs.id }}
          SNAPSHOT_NAME: ${{ steps.snapshot.outputs.name }}
        run: |
          set -euo pipefail
          doctl compute snapshot list --resource droplet --output json > snapshots.json
          python3 scripts/snapshot-retention.py --droplet-id "$DROPLET_ID" \
            --completed-name "$SNAPSHOT_NAME" < snapshots.json > prune.txt
          while IFS= read -r snap_id; do
            [ -n "$snap_id" ] || continue
            doctl compute snapshot delete "$snap_id" --force
          done < prune.txt
