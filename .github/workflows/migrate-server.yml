name: Migrate Server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to migrate'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      new_server_ip:
        description: 'IP address of the new DigitalOcean droplet'
        required: true
        type: string
      dry_run:
        description: 'Plan only — configure new server but skip data migration and DNS cutover'
        required: false
        type: boolean
        default: false
      skip_data_migration:
        description: 'Skip database dump and file sync (use when new server already has data)'
        required: false
        type: boolean
        default: false
      confirm_production:
        description: 'Type MIGRATE PRODUCTION to confirm production migration (ignored for dev/staging)'
        required: false
        type: string
        default: ''

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'production' && 'production' || inputs.environment == 'staging' && 'staging' || 'development' }}
    permissions:
      contents: read
    outputs:
      old_server_ip: ${{ steps.get-old-ip.outputs.old_server_ip }}
      old_droplet_id: ${{ steps.get-old-ip.outputs.old_droplet_id }}

    steps:
      - name: Validate new_server_ip
        run: |
          if ! echo "${{ inputs.new_server_ip }}" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
            echo "ERROR: new_server_ip '${{ inputs.new_server_ip }}' is not a valid IPv4 address" >&2
            exit 1
          fi
          echo "new_server_ip is valid: ${{ inputs.new_server_ip }}"

      - name: Confirm production migration
        if: inputs.environment == 'production'
        run: |
          if [ "${{ inputs.confirm_production }}" != "MIGRATE PRODUCTION" ]; then
            echo "ERROR: must set confirm_production to 'MIGRATE PRODUCTION' for production migrations" >&2
            exit 1
          fi

      - name: Install doctl
        uses: digitalocean/action-doctl@5727c67aa3c2c34ae9462d5a0ecfea8a1b31e5ce  # v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ inputs.environment == 'production' && secrets.PROD_SSH_PRIVATE_KEY || secrets.DEV_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf "%s" "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Look up old server and snapshot
        id: get-old-ip
        env:
          OLD_HOST: ${{ inputs.environment == 'production' && 'ftp.pausatf.org' || inputs.environment == 'staging' && 'stage.pausatf.org' || 'dev.pausatf.org' }}
        run: |
          set -euo pipefail
          # Resolve old host to IP
          OLD_IP=$(dig +short "$OLD_HOST" | tail -1)
          if [ -z "$OLD_IP" ]; then
            echo "ERROR: could not resolve $OLD_HOST" >&2
            exit 1
          fi
          echo "old_server_ip=$OLD_IP" >> "$GITHUB_OUTPUT"

          # Find droplet by public IP
          DROPLET_ID=$(doctl compute droplet list \
            --format Name,ID,PublicIPv4 --no-header \
            | awk -v ip="$OLD_IP" '$3 == ip {print $2}' | head -1)
          if [ -z "$DROPLET_ID" ]; then
            echo "WARNING: no droplet found with IP $OLD_IP — skipping snapshot" >&2
            echo "old_droplet_id=" >> "$GITHUB_OUTPUT"
          else
            echo "old_droplet_id=$DROPLET_ID" >> "$GITHUB_OUTPUT"
            TS=$(date -u +%Y%m%d%H%M%S)
            echo "Taking snapshot of droplet $DROPLET_ID (pre-migration-${{ inputs.environment }}-$TS)..."
            doctl compute droplet-action snapshot "$DROPLET_ID" \
              --snapshot-name "pre-migration-${{ inputs.environment }}-$TS" \
              --wait
            echo "Snapshot complete"
          fi

      - name: Verify new server is reachable via SSH
        env:
          ANSIBLE_USER: ${{ inputs.environment == 'production' && 'github-deploy' || 'root' }}
        run: |
          ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            "$ANSIBLE_USER@${{ inputs.new_server_ip }}" "echo OK"

  configure-new-server:
    runs-on: ubuntu-latest
    needs: preflight
    environment: ${{ inputs.environment == 'production' && 'production' || inputs.environment == 'staging' && 'staging' || 'development' }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5
        with:
          python-version: '3.12'

      - name: Install Ansible deps
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.17.5 cloudflare requests

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ inputs.environment == 'production' && secrets.PROD_SSH_PRIVATE_KEY || secrets.DEV_SSH_PRIVATE_KEY }}
          OLD_HOST: ${{ inputs.environment == 'production' && 'ftp.pausatf.org' || inputs.environment == 'staging' && 'stage.pausatf.org' || 'dev.pausatf.org' }}
        run: |
          install -m 700 -d ~/.ssh
          printf "%s" "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$OLD_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H "${{ inputs.new_server_ip }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Decrypt vault file
        if: ${{ secrets.ANSIBLE_VAULT_PASSWORD != '' }}
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: printf "%s" "$ANSIBLE_VAULT_PASSWORD" > vault.pass

      - name: Run playbook against new server
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'false'
          ANSIBLE_USER: ${{ inputs.environment == 'production' && 'github-deploy' || 'root' }}
          ENV_GROUP: ${{ inputs.environment == 'production' && 'production' || inputs.environment == 'staging' && 'staging' || 'development' }}
        run: |
          ansible-playbook -i inventory/hosts.yml site.yml \
            -l "$ENV_GROUP" \
            -e "ansible_host=${{ inputs.new_server_ip }}" \
            -e "ansible_user=$ANSIBLE_USER" \
            ${{ secrets.ANSIBLE_VAULT_PASSWORD != '' && '--vault-password-file ../vault.pass' || '' }}

      - name: Report
        run: echo "New server configured at ${{ inputs.new_server_ip }}"

  migrate-data:
    runs-on: ubuntu-latest
    needs: configure-new-server
    if: inputs.dry_run == false && inputs.skip_data_migration == false
    environment: ${{ inputs.environment == 'production' && 'production' || inputs.environment == 'staging' && 'staging' || 'development' }}
    permissions:
      contents: read

    steps:
      - name: Setup SSH key
        env:
          SSH_KEY: ${{ inputs.environment == 'production' && secrets.PROD_SSH_PRIVATE_KEY || secrets.DEV_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf "%s" "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add old server to known_hosts
        env:
          OLD_HOST: ${{ inputs.environment == 'production' && 'ftp.pausatf.org' || inputs.environment == 'staging' && 'stage.pausatf.org' || 'dev.pausatf.org' }}
        run: |
          ssh-keyscan -H "$OLD_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H "${{ inputs.new_server_ip }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Dump database old → new
        env:
          OLD_HOST: ${{ inputs.environment == 'production' && 'ftp.pausatf.org' || inputs.environment == 'staging' && 'stage.pausatf.org' || 'dev.pausatf.org' }}
          ANSIBLE_USER: ${{ inputs.environment == 'production' && 'github-deploy' || 'root' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$ANSIBLE_USER@$OLD_HOST" \
            "mysqldump --defaults-extra-file=/etc/mysql/debian.cnf --all-databases --single-transaction --quick" \
            | ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no "$ANSIBLE_USER@${{ inputs.new_server_ip }}" \
            "mysql -u root"

      - name: Sync wp-content/uploads
        env:
          OLD_HOST: ${{ inputs.environment == 'production' && 'ftp.pausatf.org' || inputs.environment == 'staging' && 'stage.pausatf.org' || 'dev.pausatf.org' }}
          ANSIBLE_USER: ${{ inputs.environment == 'production' && 'github-deploy' || 'root' }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            "$ANSIBLE_USER@$OLD_HOST:/var/www/html/wp-content/uploads/" \
            "$ANSIBLE_USER@${{ inputs.new_server_ip }}:/var/www/html/wp-content/uploads/"

      - name: Report
        run: echo "Data migration complete"

  smoke-test:
    runs-on: ubuntu-latest
    needs: configure-new-server
    if: needs.configure-new-server.result == 'success'

    steps:
      - name: Smoke test via new IP with Host header
        env:
          HOST_HEADER: ${{ inputs.environment == 'production' && 'www.pausatf.org' || inputs.environment == 'staging' && 'stage.pausatf.org' || 'dev.pausatf.org' }}
        run: |
          curl -fsS --max-time 30 \
            -H "Host: $HOST_HEADER" \
            "http://${{ inputs.new_server_ip }}/" \
            -o /dev/null

      - name: Check WordPress is responding
        env:
          HOST_HEADER: ${{ inputs.environment == 'production' && 'www.pausatf.org' || inputs.environment == 'staging' && 'stage.pausatf.org' || 'dev.pausatf.org' }}
        run: |
          STATUS=$(curl -so /dev/null -w "%{http_code}" --max-time 30 \
            -H "Host: $HOST_HEADER" \
            "http://${{ inputs.new_server_ip }}/")
          if [[ "$STATUS" != "200" && "$STATUS" != "301" && "$STATUS" != "302" ]]; then
            echo "Unexpected HTTP status: $STATUS" >&2
            exit 1
          fi
          echo "HTTP $STATUS — OK"

  dns-cutover:
    runs-on: ubuntu-latest
    needs: smoke-test
    if: inputs.dry_run == false && needs.smoke-test.result == 'success'
    environment: ${{ inputs.environment == 'production' && 'production' || inputs.environment == 'staging' && 'staging' || 'development' }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Update Cloudflare A record
        env:
          RECORD_NAME: ${{ inputs.environment == 'production' && 'pausatf.org' || inputs.environment == 'staging' && 'stage.pausatf.org' || 'dev.pausatf.org' }}
        run: |
          set -euo pipefail
          ZONE_ID=$(curl -sS -X GET \
            "https://api.cloudflare.com/client/v4/zones?name=pausatf.org" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")

          RECORD_ID=$(curl -sS -X GET \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=$RECORD_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")

          curl -sS -X PATCH \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"content\": \"${{ inputs.new_server_ip }}\"}"

          echo "DNS updated: $RECORD_NAME → ${{ inputs.new_server_ip }}"

      # Production has two A records: apex and www
      - name: Update www A record (production only)
        if: inputs.environment == 'production'
        run: |
          set -euo pipefail
          ZONE_ID=$(curl -sS -X GET \
            "https://api.cloudflare.com/client/v4/zones?name=pausatf.org" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")

          RECORD_ID=$(curl -sS -X GET \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=www.pausatf.org" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")

          curl -sS -X PATCH \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"content\": \"${{ inputs.new_server_ip }}\"}"

          echo "DNS updated: www.pausatf.org → ${{ inputs.new_server_ip }}"

  verify:
    runs-on: ubuntu-latest
    needs: dns-cutover
    if: inputs.dry_run == false && needs.dns-cutover.result == 'success'

    steps:
      - name: Wait for DNS propagation
        run: sleep 30

      - name: Final healthcheck via hostname
        env:
          HEALTHCHECK_URL: ${{ inputs.environment == 'production' && 'https://www.pausatf.org' || inputs.environment == 'staging' && 'https://stage.pausatf.org' || 'https://dev.pausatf.org' }}
        run: curl -fsS "$HEALTHCHECK_URL" || exit 1

      - name: Report
        run: echo "Migration complete"

  rollback-on-failure:
    runs-on: ubuntu-latest
    needs:
      - preflight
      - dns-cutover
      - verify
    if: failure() && inputs.dry_run == false
    environment: ${{ inputs.environment == 'production' && 'production' || inputs.environment == 'staging' && 'staging' || 'development' }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Revert Cloudflare A record to old server
        env:
          OLD_IP: ${{ needs.preflight.outputs.old_server_ip }}
          RECORD_NAME: ${{ inputs.environment == 'production' && 'pausatf.org' || inputs.environment == 'staging' && 'stage.pausatf.org' || 'dev.pausatf.org' }}
        run: |
          set -euo pipefail
          if [ -z "$OLD_IP" ]; then
            echo "ERROR: old_server_ip not available from preflight — cannot auto-rollback" >&2
            exit 1
          fi

          ZONE_ID=$(curl -sS -X GET \
            "https://api.cloudflare.com/client/v4/zones?name=pausatf.org" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")

          RECORD_ID=$(curl -sS -X GET \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=$RECORD_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")

          curl -sS -X PATCH \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"content\": \"$OLD_IP\"}"

          echo "ROLLBACK COMPLETE: DNS reverted to $OLD_IP"

      - name: Revert www A record (production only)
        if: inputs.environment == 'production'
        env:
          OLD_IP: ${{ needs.preflight.outputs.old_server_ip }}
        run: |
          set -euo pipefail
          ZONE_ID=$(curl -sS -X GET \
            "https://api.cloudflare.com/client/v4/zones?name=pausatf.org" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")

          RECORD_ID=$(curl -sS -X GET \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A&name=www.pausatf.org" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['result'][0]['id'])")

          curl -sS -X PATCH \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"content\": \"$OLD_IP\"}"

          echo "ROLLBACK COMPLETE: www.pausatf.org reverted to $OLD_IP"
