name: Markdown Lint

on:
  pull_request:
    paths:
      - '**.md'
      - '.github/workflows/markdown-lint.yml'
      - '.markdownlint.json'
      - '.markdown-link-check.json'
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '.github/workflows/markdown-lint.yml'
      - '.markdownlint.json'
      - '.markdown-link-check.json'

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, 'chore(deps):')"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Run markdownlint
        uses: nosborn/github-action-markdown-cli@9bfd0452ce630f6469986587db7f0feab5b22273  # v3.5.0
        with:
          files: .
          config_file: .markdownlint.json
          ignore_files: node_modules/

  link-check:
    name: Markdown Link Check
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, 'chore(deps):')"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Check links
        uses: gaurav-nelson/github-action-markdown-link-check@499c1e7f3637c131334fa8e937c45144f79d72d2  # v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: '.markdown-link-check.json'
