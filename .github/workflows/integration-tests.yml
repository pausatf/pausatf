name: Integration Tests

on:
  schedule:
    - cron: '0 7 * * 1'  # Monday 07:00 UTC, after DO snapshot
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'production'
        type: choice
        options: [production, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    name: Infrastructure Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          pip install --quiet \
            pytest \
            pytest-cov \
            pytest-timeout \
            paramiko \
            dnspython \
            requests

      # HTTP and DNS checks only. CI has no shell access to production; the
      # SSH-based classes in test_infrastructure.py are for local runs.
      - name: Run integration tests
        env:
          TEST_DOMAIN: www.pausatf.org
        run: |
          pytest docs/tests/integration/test_infrastructure.py \
            -k "TestWebsite or TestDNS" \
            -v \
            --timeout=60 \
            --tb=short
