name: Integration Tests

on:
  schedule:
    - cron: '0 7 * * 1'  # Monday 07:00 UTC, after DO snapshot
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'production'
        type: choice
        options: [production, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    name: Infrastructure Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          pip install --quiet \
            pytest \
            pytest-cov \
            pytest-timeout \
            paramiko \
            dnspython \
            requests

      - name: Connect to production through Cloudflare Access
        id: ssh
        uses: ./.github/actions/cloudflare-access-ssh
        with:
          host: ${{ vars.PROD_SSH_HOST }}
          user: github-deploy
          ssh-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          known-hosts: ${{ vars.PROD_SSH_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          alias: pausatf-prod

      # Only the production suite: test_dev_*.py target the dev droplet.
      - name: Run integration tests
        env:
          PROD_HOST: pausatf-prod
          TEST_DOMAIN: www.pausatf.org
          TEST_SSH_CONFIG: ${{ steps.ssh.outputs.config-file }}
        run: |
          pytest docs/tests/integration/test_infrastructure.py \
            -v \
            --timeout=60 \
            -m "not slow" \
            --tb=short \
            --cov=docs/tests \
            --cov-report=term-missing
