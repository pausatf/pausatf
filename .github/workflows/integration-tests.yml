name: Integration Tests

on:
  schedule:
    - cron: '0 7 * * 1'  # Monday 07:00 UTC, after DO snapshot
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'production'
        type: choice
        options: [production, staging]

permissions:
  contents: read

jobs:
  integration:
    name: Infrastructure Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          pip install --quiet \
            pytest \
            pytest-cov \
            pytest-timeout \
            paramiko \
            dnspython \
            requests

      - name: Write SSH key
        id: ssh
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ vars.PROD_HOST }}
        run: |
          if [ -z "${PROD_SSH_PRIVATE_KEY:-}" ] || [ -z "${PROD_HOST:-}" ]; then
            echo "SSH credentials not configured — skipping integration tests"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        if: steps.ssh.outputs.skip == 'false'
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          TEST_DOMAIN: www.pausatf.org
          TEST_SSH_KEY: ~/.ssh/id_rsa
          TEST_SSH_USER: github-deploy
        run: |
          pytest docs/tests/integration/ \
            -v \
            --timeout=60 \
            -m "not slow" \
            --tb=short \
            --cov=docs/tests \
            --cov-report=term-missing

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_rsa
