name: PHP Quality

on:
  pull_request:
    paths:
      - 'themes/**.php'
      - 'themes/**/**.php'
      - 'wp-content/plugins/**.php'
      - 'wp-content/plugins/**/**.php'
      - 'phpcs.xml.dist'
      - '.github/workflows/php-quality.yml'
  push:
    branches: [main]
    paths:
      - 'themes/**.php'
      - 'themes/**/**.php'
      - 'wp-content/plugins/**.php'
      - 'wp-content/plugins/**/**.php'
      - 'phpcs.xml.dist'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-lint:
    name: PHP Syntax Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint PHP
        run: |
          shopt -s globstar nullglob
          for f in themes/**/*.php wp-content/plugins/**/*.php; do
            php -l "$f" || exit 1
          done

  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install PHPCS + WPCS
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require "squizlabs/php_codesniffer:^3" "wp-coding-standards/wpcs:^3" "phpcompatibility/php-compatibility:^9"
      - name: Run PHPCS
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mapfile -d '' changed_php < <(git diff --name-only -z "$BASE_SHA" "$GITHUB_SHA" -- '*.php')
          if ((${#changed_php[@]} == 0)); then
            echo 'No changed PHP files; skipping PHPCS.'
            exit 0
          fi
          ~/.composer/vendor/bin/phpcs -q --standard=phpcs.xml.dist --report=full "${changed_php[@]}"

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
