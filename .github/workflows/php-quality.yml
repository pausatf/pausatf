name: PHP Quality

on:
  pull_request:
    paths:
      - 'themes/**.php'
      - 'themes/**/**.php'
      - 'wp-content/plugins/**.php'
      - 'wp-content/plugins/**/**.php'
      - 'phpcs.xml.dist'
      - '.github/workflows/php-quality.yml'
  push:
    branches: [main]
    paths:
      - 'themes/**.php'
      - 'themes/**/**.php'
      - 'wp-content/plugins/**.php'
      - 'wp-content/plugins/**/**.php'
      - 'phpcs.xml.dist'

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Syntax Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint PHP
        run: |
          shopt -s globstar nullglob
          for f in themes/**/*.php wp-content/plugins/**/*.php; do
            php -l "$f" || exit 1
          done

  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install PHPCS + WPCS
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require "squizlabs/php_codesniffer:^3" "wp-coding-standards/wpcs:^3" "phpcompatibility/php-compatibility:^9"
          ~/.composer/vendor/bin/phpcs --config-set installed_paths ~/.composer/vendor/wp-coding-standards/wpcs,~/.composer/vendor/phpcompatibility/php-compatibility
      - name: Run PHPCS
        run: |
          ~/.composer/vendor/bin/phpcs -q --standard=phpcs.xml.dist --report=full

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
