name: Infra Staging (Terraform)

on:
  workflow_dispatch:

concurrency:
  group: terraform-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: terraform-plan
    permissions:
      contents: read

    defaults:
      run:
        working-directory: terraform/environments/staging

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.10.3

      - name: Terraform Init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_API_TOKEN }}
        run: terraform init

      - name: Terraform Plan
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_API_TOKEN }}
          TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: 67b87131144a68ad5ed43ebfd4e6d811
          TF_VAR_ssh_allowed_ips: ${{ secrets.TF_VAR_SSH_ALLOWED_IPS }}
        run: terraform plan -input=false -out=tfplan
