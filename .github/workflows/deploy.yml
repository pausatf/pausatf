name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment (production, staging, development)"
      ansible_limit:
        required: true
        type: string
        description: "Ansible --limit value"
      healthcheck_cmd:
        required: false
        type: string
        default: ""
        description: "Optional healthcheck command to run after deploy"
    secrets:
      SSH_PRIVATE_KEY:
        required: false
      ANSIBLE_VAULT_PASSWORD:
        required: true
      ANSIBLE_VAULT_FILE:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5
        with:
          python-version: '3.12'

      - name: Install Ansible deps
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.17.5 cloudflare requests
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$SSH_KEY" ]; then
            install -m 700 -d ~/.ssh
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
          fi

      - name: Decrypt vault file
        env:
          ANSIBLE_VAULT_FILE: ${{ secrets.ANSIBLE_VAULT_FILE }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          if [ -z "$ANSIBLE_VAULT_PASSWORD" ] || [ -z "$ANSIBLE_VAULT_FILE" ]; then
            echo "ERROR: ANSIBLE_VAULT_PASSWORD and ANSIBLE_VAULT_FILE secrets are required" >&2
            exit 1
          fi
          printf '%s' "$ANSIBLE_VAULT_FILE" | base64 -d > ansible/group_vars/vault.yml
          echo "$ANSIBLE_VAULT_PASSWORD" > vault.pass
          chmod 600 vault.pass ansible/group_vars/vault.yml

      - name: Run playbook
        working-directory: ansible
        env:
          ANSIBLE_LIMIT: ${{ inputs.ansible_limit }}
        run: |
          ansible-playbook -i inventory/hosts.yml site.yml \
            -l "$ANSIBLE_LIMIT" \
            --vault-password-file ../vault.pass

      - name: Healthcheck
        if: ${{ inputs.healthcheck_cmd != '' }}
        run: ${{ inputs.healthcheck_cmd }}
