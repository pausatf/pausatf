name: Sync Cloudflare IPs to DO Firewall
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pausatf-firewall-maintenance
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v4
      - name: Refresh existing web allowlists without opening tunnel-only ports
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
        run: python3 scripts/firewall-maintenance.py --cloudflare --apply
