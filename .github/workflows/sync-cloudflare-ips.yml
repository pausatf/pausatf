name: Sync Cloudflare IPs to DO Firewall

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current Cloudflare ranges
        id: cf
        run: |
          set -euo pipefail
          CF_HTTP=$( { curl -sSf https://www.cloudflare.com/ips-v4; echo; \
                       curl -sSf https://www.cloudflare.com/ips-v6; } \
            | grep -E '^[0-9a-fA-F:.]+/[0-9]+$' \
            | sed 's/^/,address:/' | tr -d '\n' )
          if [ -z "$CF_HTTP" ]; then
            echo "::error::Cloudflare returned no usable ranges; refusing to rewrite the firewall."
            exit 1
          fi
          echo "http=$CF_HTTP" >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Sync production firewall
        env:
          CF_HTTP: ${{ steps.cf.outputs.http }}
          PROD_FW_ID: "5fb8b83b-12bb-4256-8ffc-ccf275f55a7e"
        run: |
          set -euo pipefail
          FW=$(doctl compute firewall get "$PROD_FW_ID" -o json)

          NAME=$(printf '%s' "$FW" | jq -r '.[0].name')
          DROPLETS=$(printf '%s' "$FW" | jq -r '.[0].droplet_ids | join(",")')
          if [ -z "$DROPLETS" ]; then
            echo "::error::$PROD_FW_ID has no attached droplets; refusing to rewrite it."
            exit 1
          fi

          # doctl's firewall update is a full replace: anything not restated here is
          # dropped. Carry the rules this job does not own (ICMP, SSH) through verbatim
          # so syncing the Cloudflare allowlist can never take SSH away.
          KEEP=$(printf '%s' "$FW" | jq -r '
            .[0].inbound_rules
            | map(select((.protocol == "tcp" and (.ports == "80" or .ports == "443")) | not))
            | map("protocol:" + .protocol
                  + (if .ports != "0" then ",ports:" + .ports else "" end)
                  + ((.sources.addresses // []) | map(",address:" + .) | join("")))
            | join(" ")')

          OUTBOUND=$(printf '%s' "$FW" | jq -r '
            .[0].outbound_rules
            | map("protocol:" + .protocol
                  + (if .ports != "0" then ",ports:" + .ports else "" end)
                  + ((.destinations.addresses // []) | map(",address:" + .) | join("")))
            | join(" ")')

          doctl compute firewall update "$PROD_FW_ID" \
            --name "$NAME" \
            --droplet-ids "$DROPLETS" \
            --inbound-rules "$KEEP protocol:tcp,ports:80${CF_HTTP} protocol:tcp,ports:443${CF_HTTP}" \
            --outbound-rules "$OUTBOUND"

          echo "$NAME synced with $(printf '%s' "$CF_HTTP" | tr ',' '\n' | grep -c address:) Cloudflare ranges"
