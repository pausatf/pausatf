name: Terraform Validate

on:
  pull_request:
    paths:
      - 'terraform/**.tf'
      - '.github/workflows/terraform-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'terraform/**.tf'
      - '.github/workflows/terraform-validate.yml'

jobs:
  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, 'chore(deps):')"
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: latest

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, 'chore(deps):')"
    strategy:
      matrix:
        environment:
          - production
          - staging
          - github
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: latest

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: terraform/environments/${{ matrix.environment }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform/environments/${{ matrix.environment }}

  tfsec:
    name: TFSec Security Scan
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, 'chore(deps):')"
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@b842aa8571b0120b60891e9fcab20ab5ed5bf26e  # v1.0.3
        with:
          working_directory: terraform
          soft_fail: false
          format: sarif
          additional_args: --concise-output --out results.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@4f3212b61783c3c68e8309a0f18842c009e7c1c0  # v4
        if: always()
        with:
          sarif_file: results.sarif

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, 'chore(deps):')"
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init
        working-directory: terraform

      - name: Run TFLint
        run: tflint --recursive --format compact --minimum-failure-severity error
        working-directory: terraform
