name: Terraform Validate

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'terraform/**.tf'
      - '.github/workflows/terraform-validate.yml'

permissions:
  contents: read

jobs:
  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, 'chore(deps):')"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: '1.10.3'

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, 'chore(deps):')"
    strategy:
      matrix:
        environment:
          - production
          - staging
          - github
          - dev
          - cloudflare
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: '1.10.3'

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: terraform/environments/${{ matrix.environment }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform/environments/${{ matrix.environment }}

  tfsec:
    name: TFSec Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    if: "!contains(github.event.pull_request.title, 'chore(deps):')"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6  # v1.0.3
        with:
          working_directory: terraform
          soft_fail: false
          format: sarif
          additional_args: --concise-output --out results.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@c793b717bc78562f491db7b0e93a3a178b099162  # v3
        if: always()
        with:
          sarif_file: results.sarif

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, 'chore(deps):')"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@4cb9feea73331a35b422df102992a03a44a3bb33  # v6
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init
        working-directory: terraform

      - name: Run TFLint
        run: tflint --recursive --format compact --minimum-failure-severity error
        working-directory: terraform
