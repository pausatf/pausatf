name: Deploy to Production

on:
  push:
    branches:
      - main
    paths:
      - 'themes/thesource-child/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf "%s" "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ftp.pausatf.org >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy theme via rsync
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            themes/thesource-child/ \
            github-deploy@ftp.pausatf.org:/var/www/html/wp-content/themes/thesource-child/

      - name: Healthcheck
        run: |
          curl -fsS https://pausatf.org || exit 1
