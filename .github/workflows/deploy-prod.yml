name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging-validate:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Ansible deps
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.17.5 cloudflare requests
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$SSH_KEY" ]; then
            install -m 700 -d ~/.ssh
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
          fi

      - name: Decrypt vault file
        env:
          ANSIBLE_VAULT_FILE: ${{ secrets.ANSIBLE_VAULT_FILE }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          if [ -z "$ANSIBLE_VAULT_PASSWORD" ] || [ -z "$ANSIBLE_VAULT_FILE" ]; then
            echo "ERROR: ANSIBLE_VAULT_PASSWORD and ANSIBLE_VAULT_FILE secrets are required" >&2
            exit 1
          fi
          printf '%s' "$ANSIBLE_VAULT_FILE" | base64 -d > ansible/group_vars/vault.yml
          echo "$ANSIBLE_VAULT_PASSWORD" > vault.pass
          chmod 600 vault.pass ansible/group_vars/vault.yml

      - name: Dry-run playbook against staging
        working-directory: ansible
        env:
          STAGE_SERVER_IP: ${{ secrets.STAGE_SERVER_IP }}
        run: |
          if [ -z "$STAGE_SERVER_IP" ]; then
            echo "ERROR: STAGE_SERVER_IP secret is required" >&2
            exit 1
          fi

          export STAGE_SERVER_IP

          ansible-playbook -i inventory/hosts.yml site.yml \
            -l pausatf-stage \
            -e "ansible_ssh_private_key_file=$HOME/.ssh/deploy_key" \
            --check \
            --vault-password-file ../vault.pass

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f vault.pass ansible/group_vars/vault.yml ~/.ssh/deploy_key

  deploy:
    needs: staging-validate
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      ansible_limit: pausatf-prod
      host_env_name: PROD_SERVER_IP
      healthcheck_host: "github-deploy@REDACTED_PROD_NEW_IP"
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      TARGET_SERVER_IP: ${{ secrets.PROD_SERVER_IP }}
      ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      ANSIBLE_VAULT_FILE: ${{ secrets.ANSIBLE_VAULT_FILE }}
