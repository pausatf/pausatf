name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5
        with:
          python-version: '3.12'

      - name: Install Ansible deps
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.17.5 cloudflare requests
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/pausatf-prod
          chmod 600 ~/.ssh/pausatf-prod
          ssh-keygen -l -f ~/.ssh/pausatf-prod
          ssh-keyscan -H ftp.pausatf.org >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Decrypt vault file
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          if [ -n "$ANSIBLE_VAULT_PASSWORD" ]; then
            printf "%s" "$ANSIBLE_VAULT_PASSWORD" > vault.pass
          fi

      - name: Run playbook (production)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'false'
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          VAULT_ARGS=""
          if [ -n "$ANSIBLE_VAULT_PASSWORD" ]; then
            VAULT_ARGS="--vault-password-file ../vault.pass"
          fi
          # shellcheck disable=SC2086
          ansible-playbook -i inventory/hosts.yml site.yml -l production $VAULT_ARGS

      - name: Healthcheck
        run: curl -fsS https://www.pausatf.org || exit 1
