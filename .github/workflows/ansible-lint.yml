name: Ansible Lint

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'ansible/**.yml'
      - 'ansible/**.yaml'
      - 'ansible/roles/**'
      - 'ansible/playbooks/**'
      - '.github/workflows/ansible-lint.yml'

permissions:
  contents: read

jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5
        with:
          python-version: '3.11'

      - name: Install Ansible and ansible-lint
        run: |
          pip install ansible-core==2.17.5 ansible-lint==25.12.2
          ansible-galaxy collection install community.general community.mysql ansible.posix

      - name: Create dummy vault password for CI
        run: |
          echo '#!/bin/sh' > ansible/.vault_pass.sh
          echo 'echo ci-dummy-vault-password' >> ansible/.vault_pass.sh
          chmod +x ansible/.vault_pass.sh

      - name: Run ansible-lint
        run: ansible-lint --offline
        working-directory: ansible

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5
        with:
          python-version: '3.11'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          yamllint .
        working-directory: ansible

  syntax-check:
    name: Ansible Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: pip install ansible

      - name: Create dummy vault password for CI
        run: |
          echo '#!/bin/sh' > ansible/.vault_pass.sh
          echo 'echo ci-dummy-vault-password' >> ansible/.vault_pass.sh
          chmod +x ansible/.vault_pass.sh

      - name: Check playbook syntax
        run: |
          for playbook in playbooks/*.yml; do
            echo "Checking $playbook"
            ansible-playbook --syntax-check "$playbook"
          done
        working-directory: ansible

      - name: Syntax-check site.yml
        working-directory: ansible
        run: ansible-playbook --syntax-check site.yml
