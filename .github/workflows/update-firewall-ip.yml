name: Update SSH Firewall IP

on:
  workflow_dispatch:
    inputs:
      new_ip:
        description: 'Your current public IPv4 (find it at https://api.ipify.org)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Validate IP
        id: ip
        env:
          NEW_IP: ${{ inputs.new_ip }}
        run: |
          set -euo pipefail
          # This value lands in a firewall rule, so reject anything that is not a
          # bare dotted-quad before it reaches doctl.
          if ! printf '%s' "$NEW_IP" | grep -qE '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
            echo "::error::'$NEW_IP' is not a bare IPv4 address (no CIDR suffix, no ranges)."
            exit 1
          fi
          echo "ip=$NEW_IP" >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Update SSH allowlist on all firewalls
        env:
          MY_IP: ${{ steps.ip.outputs.ip }}
          PROD_FW_ID: "5fb8b83b-12bb-4256-8ffc-ccf275f55a7e"
          STAGE_FW_ID: "b17da40d-aac5-48d0-8553-160a77212e82"
          DEV_FW_ID: "96d0d607-9071-4a7c-8c61-10614453f98c"
        run: |
          set -euo pipefail

          # doctl's firewall update is a full replace. Only port 22 is rewritten here;
          # every other rule is read back off the firewall and restated unchanged so
          # that rotating an SSH IP cannot alter the HTTP/S exposure of any host.
          update_ssh() {
            local fw_id="$1"
            local fw name droplets keep outbound

            fw=$(doctl compute firewall get "$fw_id" -o json)
            name=$(printf '%s' "$fw" | jq -r '.[0].name')
            droplets=$(printf '%s' "$fw" | jq -r '.[0].droplet_ids | join(",")')
            if [ -z "$droplets" ]; then
              echo "::error::$fw_id has no attached droplets; refusing to rewrite it."
              return 1
            fi

            keep=$(printf '%s' "$fw" | jq -r '
              .[0].inbound_rules
              | map(select((.protocol == "tcp" and .ports == "22") | not))
              | map("protocol:" + .protocol
                    + (if .ports != "0" then ",ports:" + .ports else "" end)
                    + ((.sources.addresses // []) | map(",address:" + .) | join("")))
              | join(" ")')

            outbound=$(printf '%s' "$fw" | jq -r '
              .[0].outbound_rules
              | map("protocol:" + .protocol
                    + (if .ports != "0" then ",ports:" + .ports else "" end)
                    + ((.destinations.addresses // []) | map(",address:" + .) | join("")))
              | join(" ")')

            doctl compute firewall update "$fw_id" \
              --name "$name" \
              --droplet-ids "$droplets" \
              --inbound-rules "$keep protocol:tcp,ports:22,address:100.64.0.0/10,address:${MY_IP}/32" \
              --outbound-rules "$outbound"

            echo "$name: SSH now allowed from Tailscale (100.64.0.0/10) and $MY_IP"
          }

          update_ssh "$PROD_FW_ID"
          update_ssh "$STAGE_FW_ID"
          update_ssh "$DEV_FW_ID"
