name: Update SSH Firewall IP
on:
  workflow_dispatch:
    inputs:
      new_ip:
        description: 'Public host IPv4 or IPv6 address to add to existing SSH rules'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pausatf-firewall-maintenance
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Validate and add SSH access while preserving existing rules
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DO_TOKEN }}
          NEW_IP: ${{ inputs.new_ip }}
        run: python3 scripts/firewall-maintenance.py --ssh-ip "$NEW_IP" --apply
