name: WordPress Plugin Audit

on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 09:00 UTC
  workflow_dispatch:
    inputs:
      probe_auth_mail:
        description: "Run auth/mail diagnostics on production instead of plugin update audit"
        required: false
        default: false
        type: boolean
      disable_jetpack_protect:
        description: "Emergency: disable Jetpack Protect module before login probe"
        required: false
        default: false
        type: boolean
      skip_synthetic_login:
        description: "Diagnostics only: skip synthetic login transaction"
        required: false
        default: false
        type: boolean
      install_login_hotfix:
        description: "Emergency: install MU plugin to disable Jetpack math login fallback"
        required: false
        default: false
        type: boolean
      probe_widget_logic:
        description: "Probe widget_logic data in current/backup databases on production"
        required: false
        default: false
        type: boolean
      apply_widget_logic_recovery:
        description: "Apply targeted widget_logic option recovery from detected source DB"
        required: false
        default: false
        type: boolean
      widget_source_db:
        description: "Optional source DB override for widget_logic recovery (e.g. wordpress_old)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Check for plugin updates
    runs-on: ubuntu-latest
    steps:
      - name: Probe widget logic recovery sources
        if: ${{ inputs.probe_widget_logic == true }}
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ vars.PROD_HOST }}
          APPLY_WIDGET_LOGIC_RECOVERY: ${{ inputs.apply_widget_logic_recovery }}
          WIDGET_SOURCE_DB: ${{ inputs.widget_source_db }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_SSH_PRIVATE_KEY:-}" ]; then
            echo "PROD_SSH_PRIVATE_KEY not set" >&2
            exit 1
          fi

          TARGET_HOST="${PROD_HOST:-REDACTED_PROD_NEW_IP}"
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          REMOTE_SHELL="bash -s"
          if ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa \
            github-deploy@"$TARGET_HOST" "sudo -n true" >/dev/null 2>&1; then
            REMOTE_SHELL="sudo -E -n bash -s"
          fi

          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa \
            github-deploy@"$TARGET_HOST" \
            "APPLY_WIDGET_LOGIC_RECOVERY='${APPLY_WIDGET_LOGIC_RECOVERY:-false}' WIDGET_SOURCE_DB='${WIDGET_SOURCE_DB:-}' $REMOTE_SHELL" <<'REMOTE'
          set -euo pipefail

          WP_PATH="/var/www/html"
          APPLY_WIDGET_LOGIC_RECOVERY="$(printf '%s' "${APPLY_WIDGET_LOGIC_RECOVERY:-false}" | tr '[:upper:]' '[:lower:]')"
          WIDGET_SOURCE_DB="${WIDGET_SOURCE_DB:-}"

          wpdb_query() {
            sudo -u www-data wp db query "$1" --skip-column-names --path="$WP_PATH" --allow-root 2>/dev/null
          }

          DB_NAME="$(sudo -u www-data wp config get DB_NAME --path="$WP_PATH" --allow-root 2>/dev/null | head -n1)"
          TABLE_PREFIX="$(sudo -u www-data wp config get table_prefix --type=variable --path="$WP_PATH" --allow-root 2>/dev/null | head -n1)"
          CURRENT_OPTIONS_TABLE="${TABLE_PREFIX}options"

          echo "HOST=$(hostname -f 2>/dev/null || hostname)"
          echo "UTC_NOW=$(date -u --iso-8601=seconds)"
          echo "current_db=$DB_NAME"
          echo "current_options_table=$CURRENT_OPTIONS_TABLE"
          if [ -n "$WIDGET_SOURCE_DB" ]; then
            echo "widget_source_db_override=$WIDGET_SOURCE_DB"
          fi

          CUR_OPT_COUNT="$(wpdb_query "SELECT COUNT(*) FROM \`${DB_NAME}\`.\`${CURRENT_OPTIONS_TABLE}\` WHERE option_name LIKE 'widget_%' AND option_value LIKE '%widget_logic%';" | head -n1 || echo 0)"
          CUR_OPT_COUNT="${CUR_OPT_COUNT:-0}"
          echo "current_widget_logic_option_count=${CUR_OPT_COUNT}"

          echo "=== Current widget_logic instance summary ==="
          sudo -u www-data wp eval '
          global $wpdb;
          $rows      = $wpdb->get_results( "SELECT option_name, option_value FROM {$wpdb->options} WHERE option_name LIKE \"widget_%\"", ARRAY_A );
          $total     = 0;
          $non_empty = 0;
          foreach ( $rows as $row ) {
            $value = maybe_unserialize( $row["option_value"] );
            if ( ! is_array( $value ) ) {
              continue;
            }
            foreach ( $value as $instance_id => $instance ) {
              if ( ! is_array( $instance ) || ! array_key_exists( "widget_logic", $instance ) ) {
                continue;
              }
              $total++;
              $expr = trim( (string) $instance["widget_logic"] );
              if ( $expr !== "" ) {
                $non_empty++;
                $expr = preg_replace( "/\\s+/", " ", $expr );
                echo "widget_logic_non_empty option=" . $row["option_name"] . " instance=" . $instance_id . " expr=" . substr( $expr, 0, 180 ) . PHP_EOL;
              } else {
                echo "widget_logic_empty option=" . $row["option_name"] . " instance=" . $instance_id . PHP_EOL;
              }
            }
          }
          echo "widget_logic_instances_total=" . $total . PHP_EOL;
          echo "widget_logic_instances_non_empty=" . $non_empty . PHP_EOL;
          ' --path="$WP_PATH" | sed -n '1,220p'

          CANDIDATE_FILE="$(mktemp)"
          trap 'rm -f "$CANDIDATE_FILE"' EXIT

          echo "=== Databases with widget_logic-bearing options ==="
          mapfile -t DBS < <(wpdb_query "SHOW DATABASES;" | grep -Ev '^(information_schema|performance_schema|mysql|sys)$' || true)
          for db in "${DBS[@]}"; do
            mapfile -t OPTION_TABLES < <(wpdb_query "SHOW TABLES FROM \`${db}\` LIKE '%\\_options';" || true)
            for tbl in "${OPTION_TABLES[@]}"; do
              cnt="$(wpdb_query "SELECT COUNT(*) FROM \`${db}\`.\`${tbl}\` WHERE option_name LIKE 'widget_%' AND option_value LIKE '%widget_logic%';" | head -n1 || echo 0)"
              cnt="${cnt:-0}"
              if [ "$cnt" -gt 0 ] 2>/dev/null; then
                printf '%s\t%s\t%s\n' "$db" "$tbl" "$cnt" >> "$CANDIDATE_FILE"
                echo "candidate_db=$db options_table=$tbl widget_logic_option_count=$cnt"
              fi
            done
          done

          if [ ! -s "$CANDIDATE_FILE" ]; then
            echo "no_widget_logic_candidates_found=true"
            exit 0
          fi

          echo "=== Candidate detail preview (top 5 by count) ==="
          sort -t $'\t' -k3,3nr "$CANDIDATE_FILE" | head -n 5 | while IFS=$'\t' read -r db tbl cnt; do
            echo "-- $db.$tbl count=$cnt --"
            wpdb_query "SELECT option_name, LENGTH(option_value) FROM \`${db}\`.\`${tbl}\` WHERE option_name LIKE 'widget_%' AND option_value LIKE '%widget_logic%' ORDER BY option_name LIMIT 20;" | sed 's/^/  /'
          done

          if [ "${APPLY_WIDGET_LOGIC_RECOVERY}" != "true" ]; then
            echo "widget_logic_recovery_applied=false"
            exit 0
          fi

          SOURCE_LINE=""
          if [ -n "$WIDGET_SOURCE_DB" ]; then
            SOURCE_LINE="$(awk -F $'\t' -v db="$WIDGET_SOURCE_DB" '$1==db {print $0}' "$CANDIDATE_FILE" | sort -t $'\t' -k3,3nr | head -n1)"
            if [ -z "$SOURCE_LINE" ]; then
              echo "ERROR: widget_source_db override not found or has no widget_logic data ($WIDGET_SOURCE_DB)" >&2
              exit 1
            fi
          else
            SOURCE_LINE="$(sort -t $'\t' -k3,3nr "$CANDIDATE_FILE" | head -n1)"
            BEST_COUNT="$(printf '%s\n' "$SOURCE_LINE" | cut -f3)"
            TOP_TIES="$(awk -F $'\t' -v c="$BEST_COUNT" '$3==c {n++} END {print n+0}' "$CANDIDATE_FILE")"
            if [ "${TOP_TIES:-0}" -gt 1 ]; then
              echo "ERROR: multiple top candidates found; rerun with widget_source_db override" >&2
              sort -t $'\t' -k3,3nr "$CANDIDATE_FILE" | head -n 10
              exit 1
            fi
          fi

          SRC_DB="$(printf '%s\n' "$SOURCE_LINE" | cut -f1)"
          SRC_TABLE="$(printf '%s\n' "$SOURCE_LINE" | cut -f2)"
          SRC_COUNT="$(printf '%s\n' "$SOURCE_LINE" | cut -f3)"
          SRC_COUNT="${SRC_COUNT:-0}"

          echo "selected_source_db=$SRC_DB"
          echo "selected_source_table=$SRC_TABLE"
          echo "selected_source_count=$SRC_COUNT"

          if [ "${SRC_DB}" = "${DB_NAME}" ] && [ "${SRC_TABLE}" = "${CURRENT_OPTIONS_TABLE}" ]; then
            echo "ERROR: selected source is current options table; nothing to recover" >&2
            exit 1
          fi
          if [ "$SRC_COUNT" -le "$CUR_OPT_COUNT" ]; then
            echo "ERROR: source does not contain more widget_logic data than current (${SRC_COUNT} <= ${CUR_OPT_COUNT})" >&2
            exit 1
          fi

          TS="$(date -u +%Y%m%d%H%M%S)"
          REC_TABLE="${TABLE_PREFIX}widget_logic_recovery_${TS}"
          wpdb_query "CREATE TABLE \`${DB_NAME}\`.\`${REC_TABLE}\` AS SELECT * FROM \`${DB_NAME}\`.\`${CURRENT_OPTIONS_TABLE}\` WHERE option_name LIKE 'widget_%' AND option_value LIKE '%widget_logic%';"
          wpdb_query "REPLACE INTO \`${DB_NAME}\`.\`${CURRENT_OPTIONS_TABLE}\` (option_name, option_value, autoload) SELECT option_name, option_value, autoload FROM \`${SRC_DB}\`.\`${SRC_TABLE}\` WHERE option_name LIKE 'widget_%' AND option_value LIKE '%widget_logic%';"

          NEW_OPT_COUNT="$(wpdb_query "SELECT COUNT(*) FROM \`${DB_NAME}\`.\`${CURRENT_OPTIONS_TABLE}\` WHERE option_name LIKE 'widget_%' AND option_value LIKE '%widget_logic%';" | head -n1 || echo 0)"
          NEW_OPT_COUNT="${NEW_OPT_COUNT:-0}"
          echo "widget_logic_recovery_applied=true"
          echo "recovery_backup_table=${DB_NAME}.${REC_TABLE}"
          echo "current_widget_logic_option_count_after=${NEW_OPT_COUNT}"

          echo "=== Post-recovery widget_logic instance summary ==="
          sudo -u www-data wp eval '
          global $wpdb;
          $rows      = $wpdb->get_results( "SELECT option_name, option_value FROM {$wpdb->options} WHERE option_name LIKE \"widget_%\"", ARRAY_A );
          $total     = 0;
          $non_empty = 0;
          foreach ( $rows as $row ) {
            $value = maybe_unserialize( $row["option_value"] );
            if ( ! is_array( $value ) ) {
              continue;
            }
            foreach ( $value as $instance ) {
              if ( ! is_array( $instance ) || ! array_key_exists( "widget_logic", $instance ) ) {
                continue;
              }
              $total++;
              if ( trim( (string) $instance["widget_logic"] ) !== "" ) {
                $non_empty++;
              }
            }
          }
          echo "widget_logic_instances_total_after=" . $total . PHP_EOL;
          echo "widget_logic_instances_non_empty_after=" . $non_empty . PHP_EOL;
          ' --path="$WP_PATH"
          REMOTE

          rm -f ~/.ssh/id_rsa

      - name: Probe production auth and mail health
        if: ${{ inputs.probe_auth_mail == true }}
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ vars.PROD_HOST }}
          DISABLE_JETPACK_PROTECT: ${{ inputs.disable_jetpack_protect }}
          SKIP_SYNTHETIC_LOGIN: ${{ inputs.skip_synthetic_login }}
          INSTALL_LOGIN_HOTFIX: ${{ inputs.install_login_hotfix }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_SSH_PRIVATE_KEY:-}" ]; then
            echo "PROD_SSH_PRIVATE_KEY not set" >&2
            exit 1
          fi

          TARGET_HOST="${PROD_HOST:-REDACTED_PROD_NEW_IP}"
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          REMOTE_SHELL="bash -s"
          if ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa \
            github-deploy@"$TARGET_HOST" "sudo -n true" >/dev/null 2>&1; then
            REMOTE_SHELL="sudo -E -n bash -s"
          fi

          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa \
            github-deploy@"$TARGET_HOST" \
            "DISABLE_JETPACK_PROTECT='${DISABLE_JETPACK_PROTECT:-false}' SKIP_SYNTHETIC_LOGIN='${SKIP_SYNTHETIC_LOGIN:-false}' INSTALL_LOGIN_HOTFIX='${INSTALL_LOGIN_HOTFIX:-false}' $REMOTE_SHELL" <<'REMOTE'
          set -euo pipefail

          WP_PATH="/var/www/html"
          APACHE_LOG_DIR="/var/log/apache2"
          DISABLE_JETPACK_PROTECT="$(printf '%s' "${DISABLE_JETPACK_PROTECT:-false}" | tr '[:upper:]' '[:lower:]')"
          SKIP_SYNTHETIC_LOGIN="$(printf '%s' "${SKIP_SYNTHETIC_LOGIN:-false}" | tr '[:upper:]' '[:lower:]')"
          INSTALL_LOGIN_HOTFIX="$(printf '%s' "${INSTALL_LOGIN_HOTFIX:-false}" | tr '[:upper:]' '[:lower:]')"

          echo "HOST=$(hostname -f 2>/dev/null || hostname)"
          echo "UTC_NOW=$(date -u --iso-8601=seconds)"

          echo "=== WordPress auth/mail configuration ==="
          sudo -u www-data wp core version --path="$WP_PATH"
          sudo -u www-data wp plugin list --status=active --field=name --path="$WP_PATH" | sed -n '1,200p'
          sudo -u www-data wp plugin is-active wp-mail-smtp --path="$WP_PATH" \
            && echo "wp-mail-smtp=active" || echo "wp-mail-smtp=inactive"
          sudo -u www-data wp option get admin_email --path="$WP_PATH" || true
          sudo -u www-data wp eval '
          $o = get_option("wp_mail_smtp");
          if (is_array($o)) {
            echo "wp-mail-smtp-mailer=" . ($o["mail"]["mailer"] ?? "unknown") . PHP_EOL;
            echo "wp-mail-smtp-from-email=" . ($o["mail"]["from_email"] ?? "unknown") . PHP_EOL;
          } else {
            echo "wp-mail-smtp-config=missing";
          }
          ' --path="$WP_PATH" || true

          if sudo -u www-data wp help jetpack >/dev/null 2>&1; then
            if [ "${DISABLE_JETPACK_PROTECT}" = "true" ]; then
              echo "=== Emergency action: disabling Jetpack Protect ==="
              sudo -u www-data wp jetpack module deactivate protect --path="$WP_PATH" || true
            fi
            if sudo -u www-data wp jetpack module is-active protect --path="$WP_PATH" >/dev/null 2>&1; then
              echo "jetpack_protect_active=yes"
            else
              echo "jetpack_protect_active=no"
            fi
          else
            echo "jetpack_cli_unavailable"
          fi

          if [ "${INSTALL_LOGIN_HOTFIX}" = "true" ]; then
            echo "=== Emergency action: install MU login hotfix ==="
            sudo -u www-data wp eval '
            if ( class_exists( "Jetpack" ) ) {
              $before = Jetpack::is_module_active( "protect" ) ? "active" : "inactive";
              if ( Jetpack::is_module_active( "protect" ) ) {
                Jetpack::deactivate_module( "protect" );
              }
              $after = Jetpack::is_module_active( "protect" ) ? "active" : "inactive";
              echo "jetpack_protect_before=" . $before . PHP_EOL;
              echo "jetpack_protect_after=" . $after . PHP_EOL;
            } else {
              echo "jetpack_class_unavailable" . PHP_EOL;
            }
            ' --path="$WP_PATH" || true
            MU_DIR="$WP_PATH/wp-content/mu-plugins"
            MU_FILE="$MU_DIR/pausatf-jetpack-login-hotfix.php"
            mkdir -p "$MU_DIR"
            printf '%s\n' \
              "<?php" \
              "function pausatf_remove_jetpack_math_object_callback( \$hook_name, \$method_name ) {" \
              "    global \$wp_filter;" \
              "    \$class_name = 'Automattic\\\\Jetpack\\\\Waf\\\\Brute_Force_Protection\\\\Brute_Force_Protection_Math_Authenticate';" \
              "    if ( empty( \$wp_filter[ \$hook_name ] ) || empty( \$wp_filter[ \$hook_name ]->callbacks ) ) { return; }" \
              "    foreach ( \$wp_filter[ \$hook_name ]->callbacks as \$priority => \$callbacks ) {" \
              "        foreach ( \$callbacks as \$callback ) {" \
              "            if ( empty( \$callback['function'] ) || ! is_array( \$callback['function'] ) ) { continue; }" \
              "            \$target = \$callback['function'];" \
              "            if ( ! is_object( \$target[0] ?? null ) || ( \$target[1] ?? '' ) !== \$method_name ) { continue; }" \
              "            if ( is_a( \$target[0], \$class_name ) ) { remove_action( \$hook_name, array( \$target[0], \$method_name ), (int) \$priority ); }" \
              "        }" \
              "    }" \
              "}" \
              "function pausatf_remove_jetpack_math_fallback() {" \
              "    pausatf_remove_jetpack_math_object_callback( 'login_form', 'math_form' );" \
              "    pausatf_remove_jetpack_math_object_callback( 'init', 'process_generate_math_page' );" \
              "    for ( \$priority = 1; \$priority <= 1000; \$priority++ ) {" \
              "        remove_filter( 'authenticate', 'Automattic\\\\Jetpack\\\\Waf\\\\Brute_Force_Protection\\\\Brute_Force_Protection_Math_Authenticate::math_authenticate', \$priority );" \
              "    }" \
              "}" \
              "add_action('login_head', function () { echo '<!-- pausatf-mu-hotfix -->'; }, 1);" \
              "add_action('plugins_loaded', 'pausatf_remove_jetpack_math_fallback', 9999);" \
              "add_action('init', 'pausatf_remove_jetpack_math_fallback', 9999);" \
              "add_action('login_init', 'pausatf_remove_jetpack_math_fallback', 9999);" \
              "add_action('login_form', 'pausatf_remove_jetpack_math_fallback', 1);" \
              "add_action('login_form_login', 'pausatf_remove_jetpack_math_fallback', 1);" \
              > "$MU_FILE"
            chown www-data:www-data "$MU_FILE"
            chmod 0644 "$MU_FILE"
            php -l "$MU_FILE"
            echo "mu_hotfix_path=$MU_FILE"
          fi

          echo "=== Locate login challenge source ==="
          grep -R --line-number --fixed-strings \
            "Please solve this math problem to prove that you are not a bot" \
            "$WP_PATH/wp-content" 2>/dev/null | head -n 20 || true
          grep -R --line-number --fixed-strings \
            "IP_ALLOW_LIST_OPTION_NAME" \
            "$WP_PATH/wp-content/plugins/jetpack/jetpack_vendor/automattic/jetpack-waf/src" \
            2>/dev/null | head -n 20 || true
          grep -R --line-number -E 'https?://|api\\.wordpress\\.com|public-api\\.wordpress\\.com|jetpack\\.wordpress\\.com' \
            "$WP_PATH/wp-content/plugins/jetpack/jetpack_vendor/automattic/jetpack-waf/src" \
            2>/dev/null | head -n 80 || true

          echo "=== Jetpack WAF brute-force internals ==="
          JETPACK_MATH_FILE="$WP_PATH/wp-content/plugins/jetpack/jetpack_vendor/automattic/jetpack-waf/src/brute-force-protection/class-math-fallback.php"
          if [ -f "$JETPACK_MATH_FILE" ]; then
            sed -n '1,220p' "$JETPACK_MATH_FILE" | sed -n '1,220p'
            grep -R --line-number -E 'get_option|update_option|apply_filters|do_action|brute|protect|math|ip' \
              "$WP_PATH/wp-content/plugins/jetpack/jetpack_vendor/automattic/jetpack-waf/src/brute-force-protection" \
              2>/dev/null | head -n 200 || true
          else
            echo "jetpack_math_fallback_file_missing"
          fi

          echo "=== Jetpack Protect API reachability ==="
          for URL in "https://public-api.wordpress.com/rest/v1.1/" "https://jetpack.wordpress.com/"; do
            HOST="$(printf '%s' "$URL" | awk -F/ '{print $3}')"
            echo "-- DNS $HOST --"
            getent ahostsv4 "$HOST" | head -n 3 || true
            echo "-- curl $HOST --"
            curl -sS --max-time 20 -o /dev/null \
              -w "$HOST http=%{http_code} ip=%{remote_ip} connect=%{time_connect} total=%{time_total}\n" \
              "$URL" || true
          done
          sudo -u www-data wp eval '
          $urls = array(
            "https://public-api.wordpress.com/rest/v1.1/",
            "https://jetpack.wordpress.com/",
          );
          foreach ( $urls as $url ) {
            $response = wp_remote_get( $url, array( "timeout" => 20 ) );
            if ( is_wp_error( $response ) ) {
              echo "wp_http_error[" . $url . "]=" . $response->get_error_code() . ":" . $response->get_error_message() . PHP_EOL;
              continue;
            }
            echo "wp_http_status[" . $url . "]=" . wp_remote_retrieve_response_code( $response ) . PHP_EOL;
          }
          ' --path="$WP_PATH" || true

          if [ "${SKIP_SYNTHETIC_LOGIN}" != "true" ]; then
            echo "=== Synthetic login transaction ==="
            TEST_USER="copilot-login-probe-$(date +%s)"
            TEST_EMAIL="${TEST_USER}@pausatf.org"
            TEST_PASS="$(openssl rand -hex 16)"
            COOKIE_FILE="$(mktemp)"
            HEADER_FILE="$(mktemp)"
            BODY_FILE="$(mktemp)"

            cleanup_probe_user() {
              sudo -u www-data wp user delete "$TEST_USER" --yes --path="$WP_PATH" >/dev/null 2>&1 || true
              rm -f "$COOKIE_FILE" "$HEADER_FILE" "$BODY_FILE"
            }
            trap cleanup_probe_user EXIT

            sudo -u www-data wp user create "$TEST_USER" "$TEST_EMAIL" \
              --user_pass="$TEST_PASS" --role=subscriber --path="$WP_PATH" >/dev/null

            curl -sS -D "$HEADER_FILE" -o "$BODY_FILE" \
              -c "$COOKIE_FILE" -b "$COOKIE_FILE" \
              --data-urlencode "log=$TEST_USER" \
              --data-urlencode "pwd=$TEST_PASS" \
              --data 'wp-submit=Log In&redirect_to=http%3A%2F%2Fwww.pausatf.org%2Fwp-admin%2F&testcookie=1' \
              https://www.pausatf.org/wp-login.php

            if ! grep -qi '^Set-Cookie: wordpress_logged_in_' "$HEADER_FILE"; then
              echo "ERROR: synthetic login failed to set wordpress_logged_in cookie" >&2
              sed -n '1,120p' "$BODY_FILE" >&2 || true
              exit 1
            fi

            ADMIN_STATUS="$(
              curl -sS -o /dev/null -w '%{http_code}' \
                -b "$COOKIE_FILE" \
                https://www.pausatf.org/wp-admin/
            )"
            echo "synthetic_wp_admin_http_status=$ADMIN_STATUS"
            if [ "$ADMIN_STATUS" != "200" ] && [ "$ADMIN_STATUS" != "302" ]; then
              echo "ERROR: synthetic login reached unexpected wp-admin status ($ADMIN_STATUS)" >&2
              exit 1
            fi
            echo "synthetic_login_result=PASS"
          else
            echo "synthetic_login_skipped=true"
          fi

          echo "=== Synthetic wp_mail transaction ==="
          MAIL_RESULT="$(
            sudo -u www-data wp eval '
            add_action("wp_mail_failed", function($error) {
              fwrite(STDERR, "wp_mail_failed: " . $error->get_error_message() . PHP_EOL);
            });
            $to = get_option("admin_email");
            $subject = "PAUSATF mail probe " . gmdate("c");
            $body = "Automated diagnostics mail probe.";
            $ok = wp_mail($to, $subject, $body);
            echo $ok ? "accepted_by_wp_mail" : "wp_mail_returned_false";
            ' --path="$WP_PATH" 2>&1 || true
          )"
          echo "synthetic_wp_mail_result=$MAIL_RESULT"

          echo "=== Mail transport status ==="
          systemctl is-active postfix || true
          (mailq || true) | head -n 40
          journalctl -u postfix --since '2 days ago' --no-pager | tail -n 120 || true

          echo "=== Recent wp-login/lostpassword access entries ==="
          grep -hE 'wp-login\\.php|action=lostpassword' "$APACHE_LOG_DIR"/access.log* 2>/dev/null | tail -n 120 || true

          echo "=== Recent Apache/PHP errors for auth/mail ==="
          grep -hiE 'wp-login|lostpassword|phpmailer|wp_mail|mail\\(|SMTP|postfix' "$APACHE_LOG_DIR"/error.log* 2>/dev/null | tail -n 120 || true

          if [ -f "$WP_PATH/wp-content/debug.log" ]; then
            echo "=== Recent WordPress debug.log auth/mail lines ==="
            grep -iE 'wp-login|lostpassword|phpmailer|wp_mail|SMTP|mail' "$WP_PATH/wp-content/debug.log" | tail -n 120 || true
          else
            echo "wp-content/debug.log not present"
          fi
          REMOTE

          rm -f ~/.ssh/id_rsa

      - name: Check for available plugin updates
        if: ${{ inputs.probe_auth_mail != true && inputs.probe_widget_logic != true }}
        id: check
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ vars.PROD_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_SSH_PRIVATE_KEY:-}" ] || [ -z "${PROD_HOST:-}" ]; then
            echo "PROD_SSH_PRIVATE_KEY or PROD_HOST not set — skipping"
            echo "updates_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          UPDATES=$(ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa \
            github-deploy@"$PROD_HOST" \
            "/usr/local/bin/wp plugin list --update=available --format=table --path=/var/www/html --allow-root 2>/dev/null" || true)
          rm -f ~/.ssh/id_rsa
          # Strip header-only output (no updates)
          if printf '%s' "$UPDATES" | grep -qv '^+\|^|\|^$\|name'; then
            echo "updates_found=true" >> "$GITHUB_OUTPUT"
            {
              echo "PLUGIN_UPDATES<<EOF"
              printf '%s' "$UPDATES"
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            echo "updates_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue for available updates
        if: steps.check.outputs.updates_found == 'true' && inputs.probe_auth_mail != true && inputs.probe_widget_logic != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          ISSUE_BODY=$(printf "Plugin updates available as of %s.\n\n\`\`\`\n%s\n\`\`\`\n\nTo update: \`wp plugin update --all --path=/var/www/html --allow-root\`" "$TODAY" "$PLUGIN_UPDATES")
          gh issue create \
            --repo pausatf/pausatf \
            --title "chore(wordpress): plugin updates available ${TODAY}" \
            --label "wordpress,dependencies" \
            --body "$ISSUE_BODY"
