name: WordPress Plugin Audit

on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 09:00 UTC
  workflow_dispatch:
    inputs:
      probe_auth_mail:
        description: "Run auth/mail diagnostics on production instead of plugin update audit"
        required: false
        default: false
        type: boolean
      disable_jetpack_protect:
        description: "Emergency: disable Jetpack Protect module before login probe"
        required: false
        default: false
        type: boolean
      skip_synthetic_login:
        description: "Diagnostics only: skip synthetic login transaction"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Check for plugin updates
    runs-on: ubuntu-latest
    steps:
      - name: Probe production auth and mail health
        if: ${{ inputs.probe_auth_mail == true }}
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ vars.PROD_HOST }}
          DISABLE_JETPACK_PROTECT: ${{ inputs.disable_jetpack_protect }}
          SKIP_SYNTHETIC_LOGIN: ${{ inputs.skip_synthetic_login }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_SSH_PRIVATE_KEY:-}" ]; then
            echo "PROD_SSH_PRIVATE_KEY not set" >&2
            exit 1
          fi

          TARGET_HOST="${PROD_HOST:-64.225.40.54}"
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          REMOTE_SHELL="bash -s"
          if ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa \
            github-deploy@"$TARGET_HOST" "sudo -n true" >/dev/null 2>&1; then
            REMOTE_SHELL="sudo -n bash -s"
          fi

          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa \
            github-deploy@"$TARGET_HOST" "$REMOTE_SHELL" <<'REMOTE'
          set -euo pipefail

          WP_PATH="/var/www/html"
          APACHE_LOG_DIR="/var/log/apache2"

          echo "HOST=$(hostname -f 2>/dev/null || hostname)"
          echo "UTC_NOW=$(date -u --iso-8601=seconds)"

          echo "=== WordPress auth/mail configuration ==="
          sudo -u www-data wp core version --path="$WP_PATH"
          sudo -u www-data wp plugin list --status=active --field=name --path="$WP_PATH" | sed -n '1,200p'
          sudo -u www-data wp plugin is-active wp-mail-smtp --path="$WP_PATH" \
            && echo "wp-mail-smtp=active" || echo "wp-mail-smtp=inactive"
          sudo -u www-data wp option get admin_email --path="$WP_PATH" || true
          sudo -u www-data wp eval '
          $o = get_option("wp_mail_smtp");
          if (is_array($o)) {
            echo "wp-mail-smtp-mailer=" . ($o["mail"]["mailer"] ?? "unknown") . PHP_EOL;
            echo "wp-mail-smtp-from-email=" . ($o["mail"]["from_email"] ?? "unknown") . PHP_EOL;
          } else {
            echo "wp-mail-smtp-config=missing";
          }
          ' --path="$WP_PATH" || true

          if sudo -u www-data wp help jetpack >/dev/null 2>&1; then
            if [ "${DISABLE_JETPACK_PROTECT}" = "true" ]; then
              echo "=== Emergency action: disabling Jetpack Protect ==="
              sudo -u www-data wp jetpack module deactivate protect --path="$WP_PATH" || true
            fi
            if sudo -u www-data wp jetpack module is-active protect --path="$WP_PATH" >/dev/null 2>&1; then
              echo "jetpack_protect_active=yes"
            else
              echo "jetpack_protect_active=no"
            fi
          else
            echo "jetpack_cli_unavailable"
          fi

          echo "=== Locate login challenge source ==="
          grep -R --line-number --fixed-strings \
            "Please solve this math problem to prove that you are not a bot" \
            "$WP_PATH/wp-content" 2>/dev/null | head -n 20 || true

          echo "=== Jetpack WAF brute-force internals ==="
          JETPACK_MATH_FILE="$WP_PATH/wp-content/plugins/jetpack/jetpack_vendor/automattic/jetpack-waf/src/brute-force-protection/class-math-fallback.php"
          if [ -f "$JETPACK_MATH_FILE" ]; then
            sed -n '1,220p' "$JETPACK_MATH_FILE" | sed -n '1,220p'
            grep -R --line-number -E 'get_option|update_option|apply_filters|do_action|brute|protect|math|ip' \
              "$WP_PATH/wp-content/plugins/jetpack/jetpack_vendor/automattic/jetpack-waf/src/brute-force-protection" \
              2>/dev/null | head -n 200 || true
          else
            echo "jetpack_math_fallback_file_missing"
          fi

          if [ "${SKIP_SYNTHETIC_LOGIN}" != "true" ]; then
            echo "=== Synthetic login transaction ==="
            TEST_USER="copilot-login-probe-$(date +%s)"
            TEST_EMAIL="${TEST_USER}@pausatf.org"
            TEST_PASS="$(openssl rand -hex 16)"
            COOKIE_FILE="$(mktemp)"
            HEADER_FILE="$(mktemp)"
            BODY_FILE="$(mktemp)"

            cleanup_probe_user() {
              sudo -u www-data wp user delete "$TEST_USER" --yes --path="$WP_PATH" >/dev/null 2>&1 || true
              rm -f "$COOKIE_FILE" "$HEADER_FILE" "$BODY_FILE"
            }
            trap cleanup_probe_user EXIT

            sudo -u www-data wp user create "$TEST_USER" "$TEST_EMAIL" \
              --user_pass="$TEST_PASS" --role=subscriber --path="$WP_PATH" >/dev/null

            curl -sS -D "$HEADER_FILE" -o "$BODY_FILE" \
              -c "$COOKIE_FILE" -b "$COOKIE_FILE" \
              --resolve 'www.pausatf.org:443:127.0.0.1' \
              --data-urlencode "log=$TEST_USER" \
              --data-urlencode "pwd=$TEST_PASS" \
              --data 'wp-submit=Log In&redirect_to=http%3A%2F%2Fwww.pausatf.org%2Fwp-admin%2F&testcookie=1' \
              https://www.pausatf.org/wp-login.php

            if ! grep -qi '^Set-Cookie: wordpress_logged_in_' "$HEADER_FILE"; then
              echo "ERROR: synthetic login failed to set wordpress_logged_in cookie" >&2
              sed -n '1,120p' "$BODY_FILE" >&2 || true
              exit 1
            fi

            ADMIN_STATUS="$(
              curl -sS -o /dev/null -w '%{http_code}' \
                -b "$COOKIE_FILE" \
                --resolve 'www.pausatf.org:443:127.0.0.1' \
                https://www.pausatf.org/wp-admin/
            )"
            echo "synthetic_wp_admin_http_status=$ADMIN_STATUS"
            if [ "$ADMIN_STATUS" != "200" ] && [ "$ADMIN_STATUS" != "302" ]; then
              echo "ERROR: synthetic login reached unexpected wp-admin status ($ADMIN_STATUS)" >&2
              exit 1
            fi
            echo "synthetic_login_result=PASS"
          else
            echo "synthetic_login_skipped=true"
          fi

          echo "=== Synthetic wp_mail transaction ==="
          MAIL_RESULT="$(
            sudo -u www-data wp eval '
            add_action("wp_mail_failed", function($error) {
              fwrite(STDERR, "wp_mail_failed: " . $error->get_error_message() . PHP_EOL);
            });
            $to = get_option("admin_email");
            $subject = "PAUSATF mail probe " . gmdate("c");
            $body = "Automated diagnostics mail probe.";
            $ok = wp_mail($to, $subject, $body);
            echo $ok ? "accepted_by_wp_mail" : "wp_mail_returned_false";
            ' --path="$WP_PATH" 2>&1
          )"
          echo "synthetic_wp_mail_result=$MAIL_RESULT"

          echo "=== Mail transport status ==="
          systemctl is-active postfix || true
          (mailq || true) | head -n 40
          journalctl -u postfix --since '2 days ago' --no-pager | tail -n 120 || true

          echo "=== Recent wp-login/lostpassword access entries ==="
          grep -hE 'wp-login\\.php|action=lostpassword' "$APACHE_LOG_DIR"/access.log* 2>/dev/null | tail -n 120 || true

          echo "=== Recent Apache/PHP errors for auth/mail ==="
          grep -hiE 'wp-login|lostpassword|phpmailer|wp_mail|mail\\(|SMTP|postfix' "$APACHE_LOG_DIR"/error.log* 2>/dev/null | tail -n 120 || true

          if [ -f "$WP_PATH/wp-content/debug.log" ]; then
            echo "=== Recent WordPress debug.log auth/mail lines ==="
            grep -iE 'wp-login|lostpassword|phpmailer|wp_mail|SMTP|mail' "$WP_PATH/wp-content/debug.log" | tail -n 120 || true
          else
            echo "wp-content/debug.log not present"
          fi
          REMOTE

          rm -f ~/.ssh/id_rsa

      - name: Check for available plugin updates
        if: ${{ inputs.probe_auth_mail != true }}
        id: check
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_HOST: ${{ vars.PROD_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_SSH_PRIVATE_KEY:-}" ] || [ -z "${PROD_HOST:-}" ]; then
            echo "PROD_SSH_PRIVATE_KEY or PROD_HOST not set — skipping"
            echo "updates_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          UPDATES=$(ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa \
            github-deploy@"$PROD_HOST" \
            "/usr/local/bin/wp plugin list --update=available --format=table --path=/var/www/html --allow-root 2>/dev/null" || true)
          rm -f ~/.ssh/id_rsa
          # Strip header-only output (no updates)
          if printf '%s' "$UPDATES" | grep -qv '^+\|^|\|^$\|name'; then
            echo "updates_found=true" >> "$GITHUB_OUTPUT"
            {
              echo "PLUGIN_UPDATES<<EOF"
              printf '%s' "$UPDATES"
              echo "EOF"
            } >> "$GITHUB_ENV"
          else
            echo "updates_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue for available updates
        if: steps.check.outputs.updates_found == 'true' && inputs.probe_auth_mail != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          ISSUE_BODY=$(printf "Plugin updates available as of %s.\n\n\`\`\`\n%s\n\`\`\`\n\nTo update: \`wp plugin update --all --path=/var/www/html --allow-root\`" "$TODAY" "$PLUGIN_UPDATES")
          gh issue create \
            --repo pausatf/pausatf \
            --title "chore(wordpress): plugin updates available ${TODAY}" \
            --label "wordpress,dependencies" \
            --body "$ISSUE_BODY"
