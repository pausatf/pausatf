name: Theme Quality
on: [push, pull_request]
jobs:
  stylelint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Stylelint
        run: |
          npx stylelint "themes/**/*.css"
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP Syntax Check
        run: find themes -name "*.php" -exec php -l {} \;
