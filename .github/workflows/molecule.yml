name: Molecule Tests

on:
  pull_request:
    paths:
      - 'ansible/roles/**'
      - '.github/workflows/molecule.yml'
  push:
    branches:
      - main
    paths:
      - 'ansible/roles/**'
      - '.github/workflows/molecule.yml'

concurrency:
  group: molecule-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  molecule:
    name: molecule / ${{ matrix.role }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role:
          - common
          - security_hardening
          - wordpress
          - apache
          - php-fpm
          - mysql
          - redis
          - fail2ban
          - certbot
          - cloudflare
          - postfix
          - monitoring
          - newrelic
          - tailscale
          - lsphp
          - openlitespeed
          - modsecurity
          - apparmor
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install molecule molecule-plugins[docker] ansible-lint

      - name: Run Molecule tests
        run: |
          cd ansible/roles/${{ matrix.role }}
          molecule test
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
