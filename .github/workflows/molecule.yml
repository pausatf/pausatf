name: Molecule Tests

on:
  pull_request:
    paths:
      - 'ansible/roles/**'
      - '.github/workflows/molecule.yml'
  push:
    branches:
      - main
    paths:
      - 'ansible/roles/**'
      - '.github/workflows/molecule.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  molecule:
    name: molecule / ${{ matrix.role }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        role:
          - common
          - wordpress
          - php-fpm
          - redis
          - certbot
          - modsecurity
          - monitoring
          - cloudflare

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Ansible
        uses: ./.github/actions/setup-ansible
        with:
          extra-packages: molecule molecule-plugins[docker]

      - name: Run Molecule
        run: molecule test
        working-directory: ansible/roles/${{ matrix.role }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
