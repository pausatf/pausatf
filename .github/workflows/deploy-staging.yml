name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      ansible_limit: staging
    secrets:
      ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
      ANSIBLE_VAULT_FILE: ${{ secrets.ANSIBLE_VAULT_FILE }}
