name: Deploy to Staging (Ansible)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5
        with:
          python-version: '3.12'

      - name: Install Ansible deps
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.17.5 ansible-lint cloudflare requests

      - name: Decrypt vault file
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          if [ -n "$ANSIBLE_VAULT_PASSWORD" ]; then
            printf "%s" "$ANSIBLE_VAULT_PASSWORD" > vault.pass
          fi

      - name: Run playbook (staging)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: 'false'
        run: |
          VAULT_ARGS=""
          if [ -f ../vault.pass ]; then
            VAULT_ARGS="--vault-password-file ../vault.pass"
          fi
          # shellcheck disable=SC2086
          ansible-playbook -i inventory/hosts.yml site.yml -l staging $VAULT_ARGS || true

      - name: Healthcheck
        run: |
          curl -fsS https://stage.pausatf.org || exit 1
