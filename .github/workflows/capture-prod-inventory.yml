name: Capture Prod WP Inventory

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.17.5

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf "%s" "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ftp.pausatf.org >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run capture playbook (prod)
        run: |
          ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/capture-wp-inventory.yml -l production

      - name: Commit and open inventory PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f ansible/group_vars/production/wordpress.yml ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add ansible/group_vars/production/wordpress.yml
            if [ -n "$(git status --porcelain)" ]; then
              BRANCH="chore/inventory-update-$(date +%Y%m%d-%H%M%S)"
              git checkout -b "$BRANCH"
              git commit -m "chore(inventory): update prod plugins/themes via capture"
              git push origin "$BRANCH"
              gh pr create --title "chore(inventory): update prod WordPress inventory" \
                --body "Automated inventory capture from production server." \
                --base main --head "$BRANCH"
            else
              echo "No changes"
            fi
          else
            echo "wordpress.yml not generated" >&2
            exit 1
          fi
