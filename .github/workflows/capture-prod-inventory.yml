name: Capture Prod WP Inventory

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Ansible
        uses: ./.github/actions/setup-ansible

      - name: Connect to production through Cloudflare Access
        uses: ./.github/actions/cloudflare-access-ssh
        with:
          host: ${{ vars.PROD_SSH_HOST }}
          user: github-deploy
          ssh-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          known-hosts: ${{ vars.PROD_SSH_KNOWN_HOSTS }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          alias: pausatf-prod

      # The inventory reads the production address from PROD_SERVER_IP; the
      # alias picks up the key, pinned known_hosts and Access proxy from
      # ~/.ssh/config. The inventory's ansible_user still applies.
      - name: Run capture playbook (prod)
        env:
          PROD_SERVER_IP: pausatf-prod
        run: |
          ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/capture-wp-inventory.yml -l production

      - name: Commit and open inventory PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f ansible/group_vars/production/wordpress.yml ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add ansible/group_vars/production/wordpress.yml
            if [ -n "$(git status --porcelain)" ]; then
              BRANCH="chore/inventory-update-$(date +%Y%m%d-%H%M%S)"
              git checkout -b "$BRANCH"
              git commit -m "chore(inventory): update prod plugins/themes via capture"
              git push origin "$BRANCH"
              gh pr create --title "chore(inventory): update prod WordPress inventory" \
                --body "Automated inventory capture from production server." \
                --base main --head "$BRANCH"
            else
              echo "No changes"
            fi
          else
            echo "wordpress.yml not generated" >&2
            exit 1
          fi
