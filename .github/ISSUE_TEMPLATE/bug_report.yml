name: Bug Report
description: Report a bug on pausatf.org
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: Affected URL
      placeholder: https://www.pausatf.org/...
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
